condition = "AND"
commits = [
  "aaf2d7c2f04667b43261d8357843a4acecc48e27",
]
paths = [
  '''^\.claude/settings\.local\.json$''',
]

[[allowlists]]
description = "2026-03-30混入分（コミット6b3a2922）: backend/.claude/settings.local.jsonの当該コミットのみ除外。ローテーション方針は上記コメント参照"
condition = "AND"
commits = [
  "6b3a2922d7c83d9f191b0567d0e8a0363d9ec38f",
]
paths = [
  '''^backend/\.claude/settings\.local\.json$''',
