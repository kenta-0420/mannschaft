# 「実装済みなのに画面から到達できないページ」再発防止台帳（正本）
#
# CMP-260909-1141 Phase 5。番人 `OrphanPageGuardTest`
# （backend/src/test/java/com/mannschaft/app/common/architecture/）がこの台帳を検査する。
#
# ## 背景 — 5類型（詳しくは docs/task-list.md の CMP-260909-1141 を参照）
#
# | 型 | 例 | 本台帳・番人が扱うか |
# |---|---|---|
# | ① リンクが無い | Phase 1〜4 で導線を足した18枚 | 扱う（reachable） |
# | ② リンクはあるが条件で永久に消える（機能フラグ等） | サイドバー27項目の永久非表示（#3322で根治） | **扱わない**（別番人を後続で作る） |
# | ③ スコープ配下に同機能ページがある残骸 | /admin/equipment 等4枚（CMP-260917-0041） | 扱う（duplicate-remnant） |
#
# 注: /admin/google-calendar（CMP-260912-0911）は当初この台帳にも duplicate-remnant として
# 載せていたが、本番人の初回実行で「該当ページが実在しない」red を検出した。実測すると
# frontend/app/pages/admin/google-calendar.vue は既に削除済みだった（本戦役の PR #3336 で
# 削除済み。docs/task-list.md 側の「対応中」表記はこの時点で陳腐化している）。本番人が
# 検出できることの実例としてここに記録し、台帳からは当該エントリを除いた。
# | ④ BE が無く到達しても動かない | /admin/campaigns 等7枚（CMP-260912-0909 系） | 扱う（be-pending） |
# | ⑤ 走査後に他セッションが導線を足した | /my/shift-availability（PR #3183 が先行していたのに誤検出） | 番人では防げない。**運用ルール**: 着手直前に最新 main で再確認すること |
#
# ## 分類（4値。すべて reason 必須）
#
# - reachable: 導線があり到達できる。番人は当該パスへのリンクが実在することを検査する
#     （リンクが無くなったら red = 今回直した18枚の退行を捕まえる）
# - duplicate-remnant: 同機能ページが別スコープにある残骸。削除待ち。
#     `replacement`（代替ページの絶対ルートパス）が必須で、そのページが実在し、
#     そこへのリンクが実在することを検査する
# - be-pending: BE が無く動かない。BE 実装待ち。`cmp`（対応する CMP 番号）が必須
# - intentional-direct-only: 意図的に直打ち専用（メールリンク前提など）。reason のみ必須
#
# ## 番人の検査範囲（段階導入 — prefix ではなく exact-match の追跡リスト）
#
# frontend/app/pages/ は500ファイル超あり、今回の戦役で実測できたのは
# CMP-260909-1141 の30ルートのみ。**ディレクトリ prefix（例: `/admin/` 配下すべて）で
# 網羅性を取る案は採用しなかった**: `/admin/` 配下には今回調査していない
# 20枚超（`/admin/users`・`/admin/permission-groups`・`/admin/shift-budget/alerts` 等）が
# 別に存在し、それらを実測せずに prefix に含めると、未分類の大量 red が出て
# 番人が最初から無効化される（intentional-direct-only 等で無審査に埋めるのも同じ理由で不可）。
# `/my/`・`/me/`・`/settings/` も同様に今回調査していない他のページを多数含む。
#
# そのため本番人は `tracked_paths`（下記の30パスちょうど）に対する **exact-match** で
# 網羅性を取る: 「tracked_paths に載っているが pages: に無い」「pages: にあるが実在しない」
# の両方向で陳腐化を検出する。新規ページの黙った孤立を機械的に防ぐという本来の狙い（対象を
# 全FEに広げること）はまだ果たせていない — **対象を広げるときは、その prefix 配下を実測してから
# tracked_paths に個別のパスとして追記すること**（未実測のまま prefix ごと足すと同じ事故になる）。
tracked_paths:
  - /me/payments/receipts
  - /me/guardianship/bulk-payment
  - /me/tournament-fees
  - /my/shift-availability
  - /my/shifts
