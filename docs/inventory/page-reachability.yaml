    reason: "2026-09-20 訂正: /{scopeType}s/{scopeId}/role-permissions/member 専用APIがBEに存在しないこと自体は確定（再確認済み）だが、その『実装待ち』という方針自体を見直す必要がある。F01.2設計（docs/features/F01.2_org_team_member_role/README.md L13）は『DEPUTY_ADMIN の細粒度な権限制御は、ADMIN が名前付き「権限グループ」を作成してユーザーへ割り当てる方式で実現する』と明記しており、メンバー個々に権限キーを直接ON/OFFする本ページの方式を設計は採っていない。この権限グループ方式は既に frontend/app/pages/admin/permission-groups.vue と backend の AdminPermissionGroupController（@RequestMapping(\"/api/v1/admin/permission-groups\")）として実装・稼働している。したがって本来の対処は role-permissions/member APIの新規実装ではなく、本ページを権限グループ方式へ統合するか削除するかという設計判断のはず（duplicate-remnant相当）。**ただし /admin/permission-groups 自体も現時点でアプリ内のどこからもリンクされていないことを実査で確認した**（SystemAdminQuickLinks.vue・TeamSidebar.vue・OrganizationSidebar.vue のいずれにも導線が無い）。番人 OrphanPageGuardTest の duplicate-remnant 判定は replacement ページへの実リンクを機械検査するため、導線が無いまま duplicate-remnant へ分類変更するとCIが赤化する。よって本PRでは分類をbe-pendingのまま据え置き、reasonのみ訂正した。導線整備（別戦役）の後にduplicate-remnantへ再分類すること。**現状はcatchで404を握りつぶし「全権限有効」と嘘表示する危険度の高い欠陥が残っている点は変わらず、いずれの対処（実装/統合/削除）を選ぶ場合も必ず除去すること**"

