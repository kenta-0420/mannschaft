  # --- 重複残骸5枚（CMP-260917-0041 / CMP-260912-0911）: 削除待ち ---
  - path: /admin/equipment
    classification: duplicate-remnant
    replacement: /teams/[slug]/equipment
    reason: "CMP-260917-0041①。teams/[slug]/equipment.vue と organizations/[slug]/equipment.vue が同じ useMemberProfileApi系ではなくequipment APIを叩き、両サイドバーに導線あり。teamsを代表としてreplacementに記載（organizations版も別途導線あり）。削除するかどうかは未着手（要確認事項あり）"
  - path: /admin/member-profiles
    classification: duplicate-remnant
    replacement: /organizations/[slug]/member-profiles
    reason: "CMP-260917-0041②。organizations/[slug]/member-profiles.vue が同一のuseMemberProfileApi().listFields(scopeType, scopeId)を叩き、OrganizationSidebar.vueに導線あり。削除は未着手"
  - path: /admin/reservation-settings
    classification: duplicate-remnant
    replacement: /teams/[slug]/reservations
    link_detection_note: "teams/[slug]/admin/index.vue の AdminConsoleCard は to: `${base.value}/reservations` という動的テンプレートリテラルで導線を持つが、base.value（スコープ基底パス）が実行時にしか決まらないため静的走査では抽出できない（先頭が${で始まり切り落とし後に空文字列になる）。番人の偽陰性を避けるためここで抑制する"
    reason: "CMP-260917-0041③。teams/[slug]/reservations.vue のLineManager.vueが同じreservation-lines APIを叩き、管理コンソールカード（teams/[slug]/admin/index.vue:78）から到達可能。ただしorganizations配下に予約機能自体が無く単純削除できない可能性があるため要確認（未着手）。
      【2026-09-18 追加調査（マスター裁可は予約ライン重複の削除のみを対象としており、これは未確認だった）】
      本ページは reservation-lines の他に ConfirmableNotificationSettings/Sender/History（確認通知設定・手動送信・履歴）セクションも埋め込んでいる（frontend/app/pages/admin/reservation-settings.vue:151-178）。
      これら3コンポーネントは frontend/app 全体でこのページからしか描画されておらず（grep実測）、単純削除すると確認通知機能（TEAM/ORGANIZATION両スコープ）が導線ごと消える。
      予約ライン部分は teams/[slug]/reservations.vue でカバーされるが、確認通知セクションの受け皿が無いため、このページはまだ削除できない。削除するには確認通知セクションの移設先を別途設計する必要がある（未着手）。"
