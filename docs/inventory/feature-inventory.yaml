# ============================================================================
# route ガードの除外ページ（隔離対象機能に属するが、意図的に束縛しないもの）
# ============================================================================
#
# 番人 FeatureGatePageCoverageGuardTest が frontend/app/pages/ を走査し、
# 隔離対象機能の route_keywords に一致するページが GATE_ROUTE_MAP で覆われているかを検査する。
# ここに列挙したパスだけがその検査から除外される。**除外には必ず理由を書くこと**
# （理由が空のエントリは番人が red にする）。
#
# 実在しないパス・既に覆われたパスが残っていても番人が red にする（陳腐化防止）。
route_coverage_exclusions:
  - path: "/ads/unsubscribe"
    reason: "広告配信停止。definePageMeta({ auth: false }) の未ログイン導線であり、
      メール内リンクから第三者が踏む。ここを塞ぐと配信停止そのものが不能になる（法令・信頼性の観点でも塞げない）。"
  - path: "/care-links/invitations/[token]"
    reason: "見守り招待の受諾。definePageMeta({ auth: false }) の未ログイン導線であり、
      招待された側はまだアカウントを持たないことがある。塞ぐと招待受諾が成立しない。"
