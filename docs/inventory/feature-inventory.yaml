# β機能棚卸し台帳（正本）
#
# 本ファイルは Mannschaft のβ機能を横断して棚卸しするための正本である。
# `backend/src/test/java/com/mannschaft/app/common/architecture/FeatureInventorySchemaGuardTest.java`
# がスキーマ規約を機械的に検証する。
#
# ## 語彙（この語彙以外の値は番人がredにする）
#
# - 実装状態（implementation.* の値）: 未実装 / 部分実装 / 実装済 / 不具合あり / 不明 / 対象外
#     （対象外 = そのコンポーネントは当該機能に存在しない。例: 純フロントエンドのみの機能の background）
# - 検証状態（verification.*.status の値）: 対象外 / 未作成 / 未実行 / 失敗中 / 通過 / ブロック中 / 不明
#     省略した軸は「不明」として扱う（明示しなくてよい）。
# - β区分（release.beta の値）: コア / β限定 / 内部限定 / 停止
# - デプロイ安全性（release.deploy_safety の値）: 安全 / 条件付き安全 / デプロイ阻害 / 不明
# - layer: 能力 / ドメイン
#     - 能力: ユーザーが触る実際の機能単位。implementation/verification を持つ。
#     - ドメイン: β解禁判断の粒度が粗い集約行（1ドメイン=1行の簡易運用）。
#       implementation/verification を省略してよく、release.beta と blockers 中心で運用する。
#       β昇格の判断が付いた時点で、能力粒度のレコード群へ分解して置き換える（このドメイン行は削除する）。
# - 検証軸キー（verification の子キー）: unit / integration / authorization / migration /
#   real_e2e / human_ui / resident_test / external_service / load / operation
#
# ## 運用ルール
#
# 1. feature_key は kebab-case・一意。**一度発行した feature_key はリネーム禁止**
#    （他ドキュメント・Issue・チケットからの参照キーであるため）。
# 2. 状態は「不明」起点で書く。証拠（evidence）が無いのに実装済・通過等を書かない。
#    「不明」は常に合法な値であり、埋まっていないことを恥じる必要はない
#    （不明が多いのは棚卸しがまだ実測されていないだけであり、正直な記録の方が価値がある）。
# 3. 検証状態が「通過」の軸は evidence（PR番号・テストクラス名・Issue番号等）を必ず添える。
#    evidence が空の「通過」は番人がredにする。
# 4. implementation の「実装済」は evidence 不要（実装済の証拠はコード自体にあるため）。
# 5. β解禁の判断が付き、ドメイン行（layer=ドメイン）を能力粒度へ展開する際は、
#    ドメイン行を削除し、能力粒度の複数レコードに置き換える。
# 6. gate_key は SCREAMING_SNAKE・あれば一意（AOP Gate 等の実装キーとの対応）。省略可。
#
