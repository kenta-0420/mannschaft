<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ベータテスト3開始後のシナリオ別月間売上予測</title>
  <desc id="desc">保守、標準、好調の三つの月間売上予測と、キャッシュ損益分岐60万円、持続可能ライン120万円を示す折れ線グラフ。</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="26" font-weight="700" fill="#17324d">シナリオ別 月間売上予測</text>
  <text x="600" y="70" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="15" fill="#64748b">β3開始からの経過月 / 単位: 万円・月</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="120" y1="580" x2="1050" y2="580"/>
    <line x1="120" y1="530" x2="1050" y2="530"/>
    <line x1="120" y1="480" x2="1050" y2="480"/>
    <line x1="120" y1="430" x2="1050" y2="430"/>
    <line x1="120" y1="380" x2="1050" y2="380"/>
    <line x1="120" y1="330" x2="1050" y2="330"/>
    <line x1="120" y1="280" x2="1050" y2="280"/>
    <line x1="120" y1="230" x2="1050" y2="230"/>
    <line x1="120" y1="180" x2="1050" y2="180"/>
    <line x1="120" y1="130" x2="1050" y2="130"/>
    <line x1="120" y1="80" x2="1050" y2="80"/>
  </g>

  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#64748b" text-anchor="end">
    <text x="105" y="585">0</text><text x="105" y="535">100</text><text x="105" y="485">200</text>
    <text x="105" y="435">300</text><text x="105" y="385">400</text><text x="105" y="335">500</text>
    <text x="105" y="285">600</text><text x="105" y="235">700</text><text x="105" y="185">800</text>
    <text x="105" y="135">900</text><text x="105" y="85">1,000</text>
  </g>

  <line x1="120" y1="550" x2="1050" y2="550" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1045" y="543" text-anchor="end" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#b45309">キャッシュ損益分岐 60万円</text>
  <line x1="120" y1="520" x2="1050" y2="520" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1045" y="513" text-anchor="end" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#b91c1c">持続可能ライン 120万円</text>

  <polyline points="120,580 270,575 420,565 570,550 720,535 870,515 1020,490" fill="none" stroke="#64748b" stroke-width="4"/>
  <polyline points="120,580 270,571 420,552.5 570,525 720,485 870,430 1020,355" fill="none" stroke="#2563eb" stroke-width="5"/>
  <polyline points="120,580 270,565 420,535 570,480 720,390 870,255 1020,80" fill="none" stroke="#16a34a" stroke-width="4"/>

  <g fill="#64748b"><circle cx="120" cy="580" r="5"/><circle cx="270" cy="575" r="5"/><circle cx="420" cy="565" r="5"/><circle cx="570" cy="550" r="5"/><circle cx="720" cy="535" r="5"/><circle cx="870" cy="515" r="5"/><circle cx="1020" cy="490" r="5"/></g>
  <g fill="#2563eb"><circle cx="120" cy="580" r="6"/><circle cx="270" cy="571" r="6"/><circle cx="420" cy="552.5" r="6"/><circle cx="570" cy="525" r="6"/><circle cx="720" cy="485" r="6"/><circle cx="870" cy="430" r="6"/><circle cx="1020" cy="355" r="6"/></g>
  <g fill="#16a34a"><circle cx="120" cy="580" r="5"/><circle cx="270" cy="565" r="5"/><circle cx="420" cy="535" r="5"/><circle cx="570" cy="480" r="5"/><circle cx="720" cy="390" r="5"/><circle cx="870" cy="255" r="5"/><circle cx="1020" cy="80" r="5"/></g>

  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="120" y="610">0</text><text x="270" y="610">6</text><text x="420" y="610">12</text>
    <text x="570" y="610">18</text><text x="720" y="610">24</text><text x="870" y="610">30</text><text x="1020" y="610">36か月</text>
  </g>

  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="15">
    <line x1="350" y1="652" x2="390" y2="652" stroke="#64748b" stroke-width="4"/><text x="400" y="657" fill="#334155">保守</text>
    <line x1="510" y1="652" x2="550" y2="652" stroke="#2563eb" stroke-width="5"/><text x="560" y="657" fill="#334155">標準</text>
    <line x1="670" y1="652" x2="710" y2="652" stroke="#16a34a" stroke-width="4"/><text x="720" y="657" fill="#334155">好調</text>
  </g>
</svg>
