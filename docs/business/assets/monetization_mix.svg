<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">標準シナリオの収益源別月間売上</title>
  <desc id="desc">ベータテスト3開始後6か月から36か月までの機能、容量、通知メール、広告、匿名統計の月間売上を示す積み上げ棒グラフ。</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="26" font-weight="700" fill="#17324d">標準シナリオ 収益源別月間売上</text>
  <text x="600" y="70" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="15" fill="#64748b">β3開始からの経過月 / 単位: 万円・月</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="120" y1="560" x2="1080" y2="560"/>
    <line x1="120" y1="460" x2="1080" y2="460"/>
    <line x1="120" y1="360" x2="1080" y2="360"/>
    <line x1="120" y1="260" x2="1080" y2="260"/>
    <line x1="120" y1="160" x2="1080" y2="160"/>
    <line x1="120" y1="110" x2="1080" y2="110"/>
  </g>
  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#64748b" text-anchor="end">
    <text x="105" y="565">0</text><text x="105" y="465">100</text><text x="105" y="365">200</text>
    <text x="105" y="265">300</text><text x="105" y="165">400</text><text x="105" y="115">450</text>
  </g>

  <!-- 6 months: 18 -->
  <rect x="170" y="545" width="100" height="15" fill="#2563eb"/><rect x="170" y="544" width="100" height="1" fill="#06b6d4"/><rect x="170" y="542" width="100" height="2" fill="#8b5cf6"/>
  <text x="220" y="533" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#334155">18</text>
  <!-- 12 months: 55 -->
  <rect x="320" y="515" width="100" height="45" fill="#2563eb"/><rect x="320" y="511" width="100" height="4" fill="#06b6d4"/><rect x="320" y="506" width="100" height="5" fill="#8b5cf6"/><rect x="320" y="505" width="100" height="1" fill="#f59e0b"/>
  <text x="370" y="495" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#334155">55</text>
  <!-- 18 months: 110 -->
  <rect x="470" y="475" width="100" height="85" fill="#2563eb"/><rect x="470" y="465" width="100" height="10" fill="#06b6d4"/><rect x="470" y="455" width="100" height="10" fill="#8b5cf6"/><rect x="470" y="450" width="100" height="5" fill="#f59e0b"/>
  <text x="520" y="440" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#334155">110</text>
  <!-- 24 months: 190 -->
  <rect x="620" y="425" width="100" height="135" fill="#2563eb"/><rect x="620" y="407" width="100" height="18" fill="#06b6d4"/><rect x="620" y="385" width="100" height="22" fill="#8b5cf6"/><rect x="620" y="372" width="100" height="13" fill="#f59e0b"/><rect x="620" y="370" width="100" height="2" fill="#ec4899"/>
  <text x="670" y="360" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#334155">190</text>
  <!-- 30 months: 300 -->
  <rect x="770" y="365" width="100" height="195" fill="#2563eb"/><rect x="770" y="335" width="100" height="30" fill="#06b6d4"/><rect x="770" y="290" width="100" height="45" fill="#8b5cf6"/><rect x="770" y="265" width="100" height="25" fill="#f59e0b"/><rect x="770" y="260" width="100" height="5" fill="#ec4899"/>
  <text x="820" y="250" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#334155">300</text>
  <!-- 36 months: 450 -->
  <rect x="920" y="290" width="100" height="270" fill="#2563eb"/><rect x="920" y="240" width="100" height="50" fill="#06b6d4"/><rect x="920" y="170" width="100" height="70" fill="#8b5cf6"/><rect x="920" y="125" width="100" height="45" fill="#f59e0b"/><rect x="920" y="110" width="100" height="15" fill="#ec4899"/>
  <text x="970" y="100" text-anchor="middle" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#334155">450</text>

  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="220" y="590">6か月</text><text x="370" y="590">12か月</text><text x="520" y="590">18か月</text>
    <text x="670" y="590">24か月</text><text x="820" y="590">30か月</text><text x="970" y="590">36か月</text>
  </g>

  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#334155">
    <rect x="210" y="630" width="18" height="18" fill="#2563eb"/><text x="238" y="644">機能</text>
    <rect x="340" y="630" width="18" height="18" fill="#06b6d4"/><text x="368" y="644">容量</text>
    <rect x="470" y="630" width="18" height="18" fill="#8b5cf6"/><text x="498" y="644">通知・メール</text>
    <rect x="650" y="630" width="18" height="18" fill="#f59e0b"/><text x="678" y="644">広告</text>
    <rect x="770" y="630" width="18" height="18" fill="#ec4899"/><text x="798" y="644">匿名統計</text>
  </g>
</svg>
