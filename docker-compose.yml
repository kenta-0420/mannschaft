services:
  mysql:
    image: mysql:8.0
    container_name: mannschaft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mannschaft
      MYSQL_USER: mannschaft
      MYSQL_PASSWORD: mannschaft
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # F10.5 Phase 10-α: スロークエリログをホスト側 `./logs/mysql-slow/` に永続化し、
      # 外部 APM や手元解析で吸い上げ可能にする（設計書 §3.3 / §5.1.3）
      - ./logs/mysql-slow:/var/log/mysql-slow
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00
      --slow_query_log=ON
      --slow_query_log_file=/var/log/mysql-slow/mannschaft-slow.log
      --long_query_time=1.0
      --log_queries_not_using_indexes=0
      --log_slow_admin_statements=1

  backend:
    # Spring Boot バックエンドコンテナ（ローカル開発用）
    # F10.6 Phase 10-γ-③-a: スロークエリログをコンテナ内から読み取るため
    # MySQL コンテナが出力したスロークエリログディレクトリを読み取り専用でマウントする
    # 通常の docker compose up -d では起動しない（bootRun を使う）
    # 起動: docker compose --profile dev-docker up -d backend
    profiles: [dev-docker]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mannschaft-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - valkey
    ports:
      - "8080:8080"
    environment:
      SLOW_QUERY_LOG_PATH: /app/logs/mysql-slow/mannschaft-slow.log
      # フロントエンド / iCal URL 組み立てに使用するベース URL（app.base-url の正準環境変数）
      APP_BASE_URL: http://localhost:3000
    volumes:
      - ./logs/mysql-slow:/app/logs/mysql-slow:ro

  valkey:
    image: valkey/valkey:8-alpine
    container_name: mannschaft-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  # ──────────────────────────────────────────────────────────────────
  # MinIO — ローカル開発用 S3 互換オブジェクトストレージ（R2 代替）
  # アバター・バナー画像等の presigned URL フロー（profile-media EP）をローカルで動かす際に使用。
  # 起動: docker compose --profile storage up -d
  # API:     http://localhost:9000
  # Console: http://localhost:9001  (ユーザー: minioadmin / パスワード: minioadmin)
  # バケット mannschaft-storage は起動時に minio-init が自動作成する。
  # BE 設定: application-local.yml に mannschaft.storage.endpoint=http://localhost:9000 を追加（下記参照）
  # ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: mannschaft-minio
    profiles:
      - storage
    restart: unless-stopped
    ports:
      - "9000:9000"   # API（presigned URL 発行・S3 互換）
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # ブラウザ（localhost:3000）からの presigned PUT を許可する CORS 設定
      # MinIO v2023.x 以降は MINIO_API_CORS_ALLOW_ORIGIN で指定する
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO 初期化（バケット作成・公開設定）
  # minio の healthcheck が green になってから 1 度だけ実行される
  minio-init:
    image: minio/mc:latest
    container_name: mannschaft-minio-init
    profiles:
      - storage
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/mannschaft-storage;
        echo 'バケット mannschaft-storage 作成完了';
      "
    restart: "no"

  # OpenTelemetry トレース可視化（ローカル開発用）
  # F10.5 Phase 10-β: 分散トレーシング可視化
  # 起動: docker-compose --profile observability up -d jaeger
  # UI:   http://localhost:16686
  # Service 名: mannschaft
  # 通常の docker-compose up では起動しない（profiles: observability で隔離）
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: mannschaft-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles:
      - observability

volumes:
  mysql-data:
  valkey-data:
  minio-data:
