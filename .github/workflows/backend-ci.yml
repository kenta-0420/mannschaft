# =============================================================================
# Backend CI — pull_request to main
# =============================================================================
# Runs compile + test on every PR targeting main.
# No AWS credentials required — build and deploy are intentionally omitted.
# 2026-05-07: forkEvery(100) + G1GC + AbandonedConnectionCleanup 無効化 + timezone=Asia/Tokyo
# =============================================================================

name: Backend — CI (PR Check)

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: backend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  # ---------------------------------------------------------------------------
  # Compile + test (Docker required for Testcontainers)
  # ---------------------------------------------------------------------------
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Compile all source sets first so compilation errors surface quickly
      # before the slower test run starts.
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      # Run the full test suite.
      # --continue ensures all test failures are collected (not just the first).
      - name: Run tests
        run: ./gradlew test --no-daemon --continue
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-pr-${{ github.event.pull_request.number }}
          path: build/reports/tests/
          retention-days: 7

      # springdoc-openapi-gradle-plugin で docs/openapi.json を静的生成する。
      # フォークした Spring Boot プロセスを内部起動して /v3/api-docs を取得するため
      # MySQL / Valkey は不要（Testcontainers も起動しない）。
      # ただし DB 接続を試みるとフォークプロセスが落ちるため、将来的に
      # spring.datasource.url=jdbc:tc:mysql:8.0:/// 等のモック設定が必要になる場合は
      # customBootRun.args を追加すること。
      - name: Generate OpenAPI JSON
        run: ./gradlew generateOpenApiDocs --no-daemon
        working-directory: ./backend

      - name: Verify openapi.json generated
        run: test -f ../docs/openapi.json

      - name: Upload openapi.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json-pr-${{ github.event.pull_request.number }}
          path: docs/openapi.json
          retention-days: 30
