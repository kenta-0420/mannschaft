name: PDF URL source unit RED

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-url-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pdf-url-unit-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NUXT_PUBLIC_API_BASE: ''
      NUXT_INTERNAL_API_BASE: ''
      HUSKY: '0'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install canonical dependencies and prepare Nuxt
        run: npm ci
      - name: Run existing Nuxt suite (expected two assertion failures)
        id: unit
        run: |
          mkdir -p test-results
          set +e
          npx vitest run app/composables/shift/useShiftApi.spec.ts --reporter=default --reporter=junit --outputFile.junit=test-results/pdf-url-red.xml > "$RUNNER_TEMP/pdf-url-unit.log" 2>&1
          result=$?
          set -e
          echo "vitest_exit=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Verify exact RED evidence
        if: always() && steps.unit.outcome != 'skipped'
        env:
          VITEST_EXIT: ${{ steps.unit.outputs.vitest_exit }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, xml.etree.ElementTree as ET
          root = ET.parse('test-results/pdf-url-red.xml').getroot()
          cases = root.findall('.//testcase')
          failed = [c for c in cases if c.find('failure') is not None]
          skipped = root.findall('.//skipped')
          errors = root.findall('.//error')
          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'pdf-url-unit.log').read_text()
          unhandled = bool(re.search(r'unhandled errors?|unhandled rejections?|uncaughtException', log, re.I))
          log_skipped = bool(re.search(r'\bskipped\b', log, re.I))
          assert os.environ['VITEST_EXIT'] == '1', 'expected assertion RED exit 1'
          assert len(cases) == 3 and len(failed) == 2, 'expected 3 cases / 2 failures'
          assert not skipped and not errors and not unhandled and not log_skipped, 'unexpected skip/error/unhandled'
          assert all(int(s.get('errors', '0')) == 0 for s in root.iter('testsuite'))
          expected_names = ["schedule ID\u3092\u624b\u52d5\u7763\u4fc3API\u3078POST\u3057\u3001data\u3092\u8fd4\u3059", "team PDF\u306fhost\u306bAPI prefix\u30921\u56de\u3060\u3051\u4ed8\u3051\u308b", "personal PDF\u306fhost\u306bAPI prefix\u30921\u56de\u3060\u3051\u4ed8\u3051\u308b"]
          def case_name(case):
              name = case.get('name', '')
              matches = [e for e in expected_names if name == e or name.endswith(' > ' + e)]
              assert len(matches) == 1, 'unexpected testcase name'
              return matches[0]
          assert sorted(case_name(c) for c in cases) == sorted(expected_names)
          assert sorted(case_name(c) for c in failed) == sorted(expected_names[1:])
          for case in failed:
              failure = case.find('failure')
              assert failure.get('type') == 'AssertionError', 'setup/runtime failure is not URL RED'
              message = failure.text or ''
              assert '/api/v1/api/v1/shifts/schedules/399/pdf' in message
              assert 'credentials' in message and 'include' in message
          assert all(not (e.text or '').strip() for c in cases for e in c if e.tag in ('system-out', 'system-err'))
          print('source-unit RED: cases=3 failures=2 skipped=0 errors=0 unhandled=0')
          PY
      - name: Upload only unit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-url-unit-red-${{ github.run_id }}
          path: frontend/test-results/pdf-url-red.xml
          if-no-files-found: error
