name: Receipt guard diagnostic

on:
  workflow_dispatch:
    inputs:
      run_calendar_browser:
        description: '隔離された Receipt guard Nuxt 診断を実行する（実機 gold ではない）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  receipt-guard:
    if: inputs.run_calendar_browser == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NUXT_PUBLIC_API_BASE: ''
      NUXT_INTERNAL_API_BASE: ''
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install fixed dependencies
        id: dependencies
        working-directory: frontend
        run: npm ci
      - name: Run isolated old cold case
        working-directory: frontend
        env:
          RECEIPT_GUARD_SOURCE: old
        run: |
          git fetch --no-tags --depth=1 origin af0bee20eacb374ff7f91db065d22aaac0a3e92b aa01495abe481ea971b4524b38a1228f5d2d6fa2
          git show af0bee20eacb374ff7f91db065d22aaac0a3e92b:frontend/app/composables/useAdminScopeGuard.ts > app/composables/useAdminScopeGuard.ts
          npm run test:unit -- tests/unit/pages/ReceiptScopeGuardNavigation.spec.ts --testNamePattern='middleware 待機=false' --reporter=default --reporter=junit --outputFile.junit=receipt-guard-old-cold-junit.xml
      - name: Restore exact AA guard
        id: restore
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: frontend
        run: |
          git show aa01495abe481ea971b4524b38a1228f5d2d6fa2:frontend/app/composables/useAdminScopeGuard.ts > app/composables/useAdminScopeGuard.ts
          git diff --exit-code -- app/composables/useAdminScopeGuard.ts
      - name: Run isolated AA cold case in a new Vitest process
        if: always() && steps.dependencies.outcome == 'success' && steps.restore.outcome == 'success'
        working-directory: frontend
        env:
          RECEIPT_GUARD_SOURCE: AA
        run: >-
          npm run test:unit -- tests/unit/pages/ReceiptScopeGuardNavigation.spec.ts
          --testNamePattern='middleware 待機=false'
          --reporter=default --reporter=junit --outputFile.junit=receipt-guard-aa-cold-junit.xml
      - name: Classify isolated cold JUnit
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for source in ('old', 'aa'):
              root = ET.parse(f'receipt-guard-{source}-cold-junit.xml').getroot()
              cases = list(root.iter('testcase'))
              cold = [c for c in cases if 'middleware 待機=false' in c.get('name', '')]
              held = [c for c in cases if 'middleware 待機=true' in c.get('name', '')]
              assert len(cold) == 1 and cold[0].find('skipped') is None
              assert len(held) == 1 and held[0].find('skipped') is not None
              assert all(c.find('error') is None for c in cases)
              failure = cold[0].find('failure')
              text = '' if failure is None else failure.get('message', '') + (failure.text or '')
              result = 'PASS' if failure is None else 'test-timeout' if 'timed out in 5000ms' in text else 'route-assertion' if '/dashboard' in text and '/admin/receipts' in text else 'other-failure'
              print(f'{source}: selected cold1 {result}, duration={cold[0].get("time")}; held1 intentionally unselected; Receipt14 not invoked')
          PY
      - name: Preserve separate cold JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-guard-isolated-cold-junit
          path: |
            frontend/receipt-guard-old-cold-junit.xml
            frontend/receipt-guard-aa-cold-junit.xml
          if-no-files-found: warn
          retention-days: 7
