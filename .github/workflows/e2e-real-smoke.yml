name: Receipt guard diagnostic

on:
  workflow_dispatch:
    inputs:
      run_calendar_browser:
        description: '隔離された Receipt guard Nuxt 診断を実行する（実機 gold ではない）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  receipt-guard:
    if: inputs.run_calendar_browser == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NUXT_PUBLIC_API_BASE: ''
      NUXT_INTERNAL_API_BASE: ''
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install fixed dependencies
        working-directory: frontend
        run: npm ci
      - name: Run actual Nuxt regression and existing receipt contracts
        working-directory: frontend
        run: >-
          npm run test:unit -- tests/unit/pages/ReceiptScopeGuardNavigation.spec.ts
          tests/unit/pages/ReceiptVoidAccess.spec.ts
          --reporter=default --reporter=junit --outputFile.junit=receipt-guard-junit.xml
      - name: Preserve JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-guard-junit
          path: frontend/receipt-guard-junit.xml
          if-no-files-found: warn
          retention-days: 7
