# 軍議用草案。専用verify refの登録済みe2e-real-smoke.ymlだけを置換し、gold/出荷ゲートとは区別する。
name: CMP0700 実MySQL 試練 (leaf)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmp0700-leaf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  count-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact verify source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up canonical Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Confirm Docker for real Testcontainers
        run: docker info --format '{{.ServerVersion}}'
      - name: Run actual count and visibility contracts
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --build-cache -Pmax.parallel.forks=1 \
            --tests com.mannschaft.app.search.GlobalSearchCountContractIT \
            --tests com.mannschaft.app.search.GlobalSearchVisibilityContractIT \
            --tests com.mannschaft.app.schedule.ScheduleMinViewRoleContractIT
      - name: Validate actual executions without skipped cases
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'com.mannschaft.app.search.GlobalSearchCountContractIT': 59, 'com.mannschaft.app.search.GlobalSearchVisibilityContractIT': 23, 'com.mannschaft.app.schedule.ScheduleMinViewRoleContractIT': 24}
          paths = list(Path('backend/build/test-results/test').glob('TEST-*.xml'))
          for name, count in expected.items():
              family = [p for p in paths if p.name == 'TEST-' + name + '.xml' or p.name.startswith('TEST-' + name + '$')]
              assert family, 'JUnit family missing: ' + name
              totals = dict.fromkeys(['tests', 'failures', 'errors', 'skipped'], 0)
              for path in family:
                  suite = ET.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(suite.attrib[key])
              print(name, totals)
              assert totals['tests'] == count, 'Invocation count mismatch: ' + name
              assert totals['skipped'] == 0 and totals['errors'] == 0, 'Not behavior evidence: ' + name
              if name.endswith('.GlobalSearchCountContractIT'):
                  exact = Path('backend/build/test-results/test') / ('TEST-' + name + '.xml')
                  assert exact.is_file() and int(ET.parse(exact).getroot().attrib['tests']) == 59
              else:
                  assert totals['failures'] == 0, 'Existing visibility regression: ' + name
          PY
      - name: Preserve JUnit assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp0700-leaf-junit-${{ github.run_id }}
          path: backend/build/test-results/test/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
