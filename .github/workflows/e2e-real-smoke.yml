# 専用 verify ref の診断のみ。製品・既存 gate・解析 rule は変更しない。
name: ArchUnit store multiset diagnostic (gold excluded)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archunit-store-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SOURCE: 72e180af9407109378a4cc7eafe80824a94fccf9
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: 固定 source と解析設定を確認・snapshot helper 準備
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SOURCE"
          test "$(git diff --name-only "$BASE_SOURCE" HEAD)" = '.github/workflows/e2e-real-smoke.yml'
          git diff --exit-code "$BASE_SOURCE" HEAD -- backend
          test ! -e backend/build
          mkdir -p evidence
          git rev-parse HEAD > evidence/diagnostic-head.txt
          git rev-parse "$BASE_SOURCE" > evidence/source-head.txt
          git ls-tree -r "$BASE_SOURCE" backend > evidence/backend-source-blobs.txt
          java -version 2> evidence/jdk-version.txt
          sha256sum backend/gradle/wrapper/gradle-wrapper.jar backend/gradle/wrapper/gradle-wrapper.properties backend/build.gradle.kts backend/src/test/resources/archunit.properties > evidence/execution-config-sha256.txt
          grep -Fx 'freeze.refreeze=false' backend/src/test/resources/archunit.properties
          chmod +x backend/gradlew
          cat > evidence/snapshot.py <<'PY'
          import collections, hashlib, json, pathlib, shutil, subprocess, sys
          root = pathlib.Path.cwd()
          source = root / 'backend/src/test/resources/archunit_store'
          evidence = root / 'evidence'
          phase = sys.argv[1]
          def sha(data): return hashlib.sha256(data).hexdigest()
          tracked = subprocess.check_output(['git','ls-files','--','backend/src/test/resources/archunit_store'],text=True).splitlines()
          snapshot = evidence / phase
          snapshot.mkdir(exist_ok=False)
          manifest = {}
          for file in sorted(source.rglob('*')):
              if file.is_symlink(): raise RuntimeError('Unexpected store symlink')
              if not file.is_file(): continue
              name = file.relative_to(source).as_posix()
              data = file.read_bytes()
              target = snapshot / name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              manifest[name] = {'sha256':sha(data),'bytes':len(data),'lines':len(data.decode('utf-8').splitlines())}
          (evidence / (phase + '-manifest.json')).write_text(json.dumps({'tracked':tracked,'actual':manifest},ensure_ascii=False,indent=2),encoding='utf-8')
          if phase == 'after':
              before = json.loads((evidence/'before-manifest.json').read_text(encoding='utf-8'))['actual']
              report = {}
              for name in sorted(set(before)|set(manifest)):
                  a = collections.Counter((evidence/'before'/name).read_text(encoding='utf-8').splitlines()) if name in before else collections.Counter()
                  b = collections.Counter((evidence/'after'/name).read_text(encoding='utf-8').splitlines()) if name in manifest else collections.Counter()
                  report[name] = {'before':before.get(name),'after':manifest.get(name),
                      'removed':[{'line':line,'count':count} for line,count in sorted((a-b).items())],
                      'added':[{'line':line,'count':count} for line,count in sorted((b-a).items())]}
              (evidence/'multiset-diff.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
              diff = subprocess.run(['git','diff','--','backend/src/test/resources/archunit_store'],capture_output=True,text=True,check=True)
              (evidence/'tracked-store.diff').write_text(diff.stdout,encoding='utf-8')
              classes = root/'backend/build/classes/java/main/com/mannschaft/app'
              files = sorted(classes.rglob('*.class')) if classes.exists() else []
              metadata = [{'path':f.relative_to(root).as_posix(),'sha256':sha(f.read_bytes())} for f in files]
              (evidence/'app-bytecode-metadata.json').write_text(json.dumps({'classCount':len(files),'classes':metadata,'actualImportedClassCount':'not observed; available app bytecode only'},indent=2),encoding='utf-8')
          PY
          cat > evidence/classpath.init.gradle <<'GROOVY'
          import groovy.json.JsonOutput
          gradle.projectsEvaluated {
              def p = gradle.rootProject
              def diagnostic = p.tasks.register('diagnosticClasspath') {
                  dependsOn(p.tasks.named('testClasses'))
                  doLast {
                      def entries = p.tasks.named('archUnitTest').get().classpath.files.collect { f ->
                          def digest = null
                          if (f.isFile()) {
                              def md = java.security.MessageDigest.getInstance('SHA-256')
                              f.withInputStream { stream -> byte[] buffer = new byte[65536]; int length
                                  while ((length = stream.read(buffer)) > 0) md.update(buffer,0,length)
                              }
                              digest = md.digest().encodeHex().toString()
                          }
                          [path:f.absolutePath,name:f.name,sha256:digest,isDirectory:f.isDirectory()]
                      }
                      new File(p.rootDir.parentFile,'evidence/resolved-classpath.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(entries))
                  }
              }
              p.tasks.named('archUnitTest').configure { dependsOn(diagnostic) }
          }
          GROOVY
          python3 evidence/snapshot.py before
      - name: 全 ArchUnit engine を絞り込みなしで解析
        id: analysis
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          set +e
          ./gradlew archUnitTest --no-daemon --no-build-cache --max-workers=1 -Pmax.parallel.forks=1 -Pfork.every=0 -I ../evidence/classpath.init.gradle
          code=$?
          set -e
          printf '%s\n' "$code" > ../evidence/archunit-exit.txt
          exit "$code"
      - name: 失敗時も解析後 store を保全
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/before-manifest.json
          python3 evidence/snapshot.py after
      - name: read-only Integrity guard を確認（全解析を再実行しない）
        if: always() && steps.analysis.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/after-manifest.json
          test -n "$(find backend/build/test-results/archUnitTest -maxdepth 1 -name 'TEST-*.xml' -print -quit)"
          cd backend
          set +e
          ./gradlew test --tests com.mannschaft.app.common.architecture.ArchUnitFreezeStoreIntegrityTest -x archUnitTest --no-daemon --max-workers=1 -Pmax.parallel.forks=1 -Pfork.every=0
          code=$?
          set -e
          printf '%s\n' "$code" > ../evidence/integrity-exit.txt
          exit "$code"
      - name: 安全な JUnit 件数と guard 後不変性を保存
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          evidence=root/'evidence'
          after=json.loads((evidence/'after-manifest.json').read_text(encoding='utf-8'))['actual']
          store=root/'backend/src/test/resources/archunit_store'
          assert sorted(f.relative_to(store).as_posix() for f in store.rglob('*') if f.is_file())==sorted(after),'read-only guard changed store file set'
          for name,meta in after.items():
              data=(root/'backend/src/test/resources/archunit_store'/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==meta['sha256'], 'read-only guard changed store'
          rows=[]
          for file in sorted((root/'backend/build/test-results').rglob('*.xml')):
              if file.parent.name not in ['archUnitTest','test']: continue
              for event,node in ET.iterparse(file,events=['start']):
                  if node.tag=='testsuite':
                      rows.append({'entry':file.relative_to(root).as_posix(),'name':node.attrib.get('name'),
                          **{key:int(node.attrib.get(key,0)) for key in ['tests','failures','errors','skipped']}})
                      break
          (evidence/'junit-headers.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          arch=[row for row in rows if row['entry'].startswith('backend/build/test-results/archUnitTest/')]
          guard=[row for row in rows if row['name']=='com.mannschaft.app.common.architecture.ArchUnitFreezeStoreIntegrityTest']
          assert sum(row['tests'] for row in arch)>0,'ArchUnit unexecuted'
          for target in ['CrossDomainTransactionalArchTest','CrossDomainRepositoryDependencyArchTest']:
              selected=[row for row in arch if row['entry']=='backend/build/test-results/archUnitTest/TEST-com.mannschaft.app.common.architecture.'+target+'.xml']
              assert len(selected)==1 and selected[0]['tests']==1,'D3/D5 missing or unexpected count: '+target
              assert all(selected[0][key]==0 for key in ['failures','errors','skipped']),'D3/D5 failed or unexecuted: '+target
          assert len(guard)==1 and guard[0]['tests']==2,'Integrity unexecuted'
          assert all(row['errors']==0 and row['skipped']==0 for row in arch+guard),'Diagnostic has errors or skips'
          assert sum(row['failures'] for row in arch)==0,'ArchUnit analysis failed; shrink legitimacy unproven'
          PY
      - name: before/after・重複保持差分・実行同一性を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archunit-store-multiset-${{ github.run_id }}
          path: |
            evidence/
          if-no-files-found: error
          retention-days: 7
