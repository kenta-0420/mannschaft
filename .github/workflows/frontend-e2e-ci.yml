# =============================================================================
# Frontend E2E CI — pull_request to main
# =============================================================================
# F15.4 / F22.1 を含む smoke subset の Playwright E2E を毎 PR で実行する。
#
# 設計方針:
#   - 全 1809 spec を CI で走らせると約 7.5 時間と非現実的のため、
#     smoke subset のみを実行（F15.4-org-team-search・f221-swipe-dashboard・F15.4-slug-navigation・mobile/insight-ui-regressions、拡大予定）。
#   - これらの spec は `page.route()` で全 API をモック化しているため、バックエンド非依存。
#   - dev サーバは playwright.config.ts の `webServer` 設定で自動起動。
#   - Playwright Chromium ブラウザは package-lock.json ハッシュをキーにキャッシュ。
#
# F22.1（横スワイプ・スコープダッシュボード）の CI スモーク範囲（決定的なものに限定）:
#   - カルーセルシェル描画 / 初期=個人パネル / セグメントトグル切替 / 左右矢印・キーボード循環
#   - 個人パネルに検索・タグ無し / チーム・組織パネルに有り
#   - チーム検索フォーム submit → /teams/search?keyword=... 遷移
#   - localStorage(scope-dashboard) 保存・リロード復元
#   ※ touch スワイプ慣性・多数シードのページ送り・要対応の実データ依存シナリオは
#     フレーキー/重シードのため CI から意図的に除外（夜間ジョブ候補）。
# =============================================================================

name: Frontend — E2E (PR Check)

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e-ci.yml"

concurrency:
  group: frontend-e2e-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"

jobs:
  e2e:
    name: Smoke E2E (F15.4 + F22.1 + 拡大予定)
    # Playwright 1.60.0 の依存導入が未対応のため 24.04 に固定。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure system deps for Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts の chromium project が
      # storageState: 'tests/e2e/.auth/user.json' を要求するため、
      # CI では空の storageState を用意してプロジェクト起動エラーを回避する。
      # F15.4 spec は addInitScript / page.route() で完全自己完結のため空 JSON で問題なし。
      - name: Prepare empty Playwright storageState (CI only)
        run: |
          mkdir -p tests/e2e/.auth
          if [ ! -f tests/e2e/.auth/user.json ]; then
            echo '{"cookies":[],"origins":[]}' > tests/e2e/.auth/user.json
          fi

      # 共通UIを含む smoke spec を 1 回の dev サーバ起動で実行する。
      # 各 spec は page.route() で API 境界をモックするためバックエンド非依存。
      - name: Run smoke E2E (F15.4 + F22.1 + common UI)
        # SmokeのSSR worker用にheap余裕を与え、本番・通常dev設定へ広げない。
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          free -m
          node <<'NODE'
          const { getHeapStatistics } = require('node:v8')
          const { Worker } = require('node:worker_threads')
          const heapMiB = () => Math.round(getHeapStatistics().heap_size_limit / 1024 / 1024)
          console.log(JSON.stringify({ scope: 'smoke-main', nodeOptions: process.env.NODE_OPTIONS, heapLimitMiB: heapMiB() }))
          const worker = new Worker(`
            const { parentPort, resourceLimits } = require('node:worker_threads')
            const { getHeapStatistics } = require('node:v8')
            parentPort.postMessage({
              scope: 'smoke-worker', nodeOptions: process.env.NODE_OPTIONS,
              heapLimitMiB: Math.round(getHeapStatistics().heap_size_limit / 1024 / 1024), resourceLimits,
            })
          `, { eval: true })
          worker.once('message', data => console.log(JSON.stringify(data)))
          ;(async () => {
            await new Promise((resolve, reject) => {
              worker.once('error', reject)
              worker.once('exit', code => code === 0 ? resolve() : reject(new Error(`heap診断worker exit ${code}`)))
            })
          })().catch(error => { console.error(error); process.exitCode = 1 })
          NODE
          npx playwright test F15.4-org-team-search f221-swipe-dashboard F15.4-slug-navigation mobile/insight-ui-regressions mobile/common-controls mobile/calendar-layout --project=chromium --workers=1 --timeout=120000 --trace=retain-on-failure --output=test-results/smoke

      - name: smoke E2Eの失敗時証跡を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-e2e-first-failure-evidence
          path: frontend/test-results/smoke/
          retention-days: 14

      - name: I18N-004 の SSR・Cookie 保持を確認
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: build/i18n004-ci/actual.json
        run: npx playwright test tests/e2e/i18n/locale-switch.spec.ts --grep I18N-004 --project=chromium --workers=1 --retries=0 --timeout=120000 --reporter=list,json --trace=on --output=test-results/i18n004-ci

      - name: I18N-004 の実結果と出力を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n004-ci-results
          path: |
            frontend/build/i18n004-ci/actual.json
            frontend/test-results/i18n004-ci/
          retention-days: 14

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: frontend/playwright-report/
          retention-days: 14
