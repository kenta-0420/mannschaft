# =============================================================================
# API Drift Check — pull_request to main（Stage 4 第六陣 / 案 A 段階移行対応）
# =============================================================================
# 設計書 (docs/features/F*.md) と Controller 実装の API 乖離をスキャンし、
# main の baseline (docs/internal/api_drift_baseline.md) との差分を
# PR コメントとして投稿する。
#
# 重要:
# - 既定は warning-only（`STRICT_DRIFT` 未設定 / 'false'）。Stage 3 と挙動互換
# - GitHub Repository Variable `STRICT_DRIFT=true` を設定すると案A昇格:
#     * PR で新規発生した missing_impl / missing_design があれば PR を fail
#     * 既知の baseline drift は無視（chip-away 運用）
# - フォーク PR ではコメント投稿に write 権限が必要なため、pull_request イベントで
#   permissions を明示する
# - 既存 backend-ci.yml / frontend-ci.yml と独立した concurrency group
# - PR コメント投稿は `if: always()` + `continue-on-error: true` のまま維持し、
#   fail させる場合もユーザに通知できるようにする
# =============================================================================

name: API Drift — Check (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/main/java/**/controller/**/*.java"
      - "docs/features/**"
      - "backend/scripts/scan_api_drift.py"
      - "backend/scripts/ci_drift_summary.py"
      - "docs/internal/api_drift_baseline.md"
      - "docs/internal/api_drift_exclusions.yml"
      - ".github/workflows/api-drift-check.yml"

# 同一 PR の新規 push で前回 run をキャンセル（独立 group）
concurrency:
  group: api-drift-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# PR コメント投稿に必要な権限
permissions:
  contents: read
  pull-requests: write

jobs:
  drift-check:
    name: Scan & Comment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          # main の baseline と diff を取るため、十分な履歴を取得
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # main の baseline.md を一時退避（PR ブランチでスキャンすると上書きされるため）
      - name: Capture main baseline
        id: capture_main
        run: |
          set -e
          mkdir -p /tmp/drift
          # origin/main は actions/checkout で取得済み
          if git show "origin/${{ github.base_ref }}:docs/internal/api_drift_baseline.md" \
              > /tmp/drift/baseline_main.md 2>/dev/null; then
            echo "main_baseline_present=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] main baseline captured: $(wc -l < /tmp/drift/baseline_main.md) lines"
          else
            echo "main_baseline_present=false" >> "$GITHUB_OUTPUT"
            echo "[WARN] main baseline not found on base branch"
          fi

      # PR ブランチで scan_api_drift.py を実行
      # → docs/internal/api_drift_baseline.md が上書きされる（コミットはしない）
      - name: Run drift scanner on PR
        run: |
          set -e
          python backend/scripts/scan_api_drift.py
          cp docs/internal/api_drift_baseline.md /tmp/drift/baseline_pr.md
          echo "[INFO] PR baseline captured: $(wc -l < /tmp/drift/baseline_pr.md) lines"

      # 生成された baseline.md は CI 用の作業ファイルなので元の状態に戻す
      # （後続ステップが PR の add 状態を見ても困らないように）
      - name: Restore baseline.md to checkout state
        run: |
          git checkout -- docs/internal/api_drift_baseline.md || true

      # 差分サマリを生成
      # STRICT_DRIFT=true のとき、新規発生 drift があれば exit 1 となり、ジョブ全体が fail する。
      # GitHub Repository Variable `STRICT_DRIFT` 未設定時は 'false' をデフォルトとして渡す。
      - name: Build PR comment body
        id: build_comment
        env:
          STRICT_DRIFT: ${{ vars.STRICT_DRIFT || 'false' }}
        run: |
          set -e
          echo "[INFO] STRICT_DRIFT=${STRICT_DRIFT}"
          python backend/scripts/ci_drift_summary.py \
            --main /tmp/drift/baseline_main.md \
            --pr   /tmp/drift/baseline_pr.md \
            --output /tmp/drift/comment.md
          echo "----- generated PR comment -----"
          cat /tmp/drift/comment.md

      # PR コメントを投稿（既存コメントがあれば update、重複防止のためマーカーで識別）
      # warning-only 設計のため: スキャナ失敗時も実行 + コメント投稿失敗(fork PR の権限不足等)で
      # ワークフロー全体が FAILED にならぬよう常に成功扱いとする
      - name: Post or update PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- api-drift-check-marker -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            let body;
            try {
              body = fs.readFileSync('/tmp/drift/comment.md', 'utf8');
            } catch (e) {
              core.notice(`Skip PR comment: drift comment body not generated (${e.message}).`);
              return;
            }

            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              );
              const existing = comments.find(c =>
                c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body
                });
                core.info(`Updated existing PR comment #${existing.id}`);
              } else {
                const created = await github.rest.issues.createComment({
                  owner, repo, issue_number, body
                });
                core.info(`Created new PR comment #${created.data.id}`);
              }
            } catch (e) {
              core.notice(`PR comment post failed (warning-only, likely missing write permission on fork PR): ${e.message}`);
            }

      # ジョブの最終ステータスを notice として明示
      # STRICT_DRIFT=true で fail した場合は build_comment ステップ自体が exit 1 となり、
      # この notice は出ない（後続ステップは if: always() が無いとスキップされる）。
      - name: Annotate final status
        if: always()
        env:
          STRICT_DRIFT: ${{ vars.STRICT_DRIFT || 'false' }}
        run: |
          if [ "${STRICT_DRIFT}" = "true" ]; then
            echo "::notice::API drift check is in STRICT mode. New drift will fail the PR (existing baseline drift is ignored)."
          else
            echo "::notice::API drift check is warning-only (STRICT_DRIFT=false). PR will not be failed."
          fi
