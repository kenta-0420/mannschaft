# CMP-261021-0718 の業務redを取得するための一時的な補助workflow。
# red確認後に削除し、最終PR差分には残さない。既存の必須CIは変更しない。
name: CMP0718 対象IT再現（補助・一時）

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cmp0718-repro.yml
      - backend/src/test/java/com/mannschaft/app/shiftbudget/ShiftBudgetPublicationGenerationIT.java
      - backend/src/test/java/com/mannschaft/app/shiftbudget/ShiftBudgetPublicationGenerationTestFixture.java

permissions:
  contents: read

concurrency:
  group: cmp0718-repro-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cmp0718-repro:
    name: CMP0718 公開世代・取消履歴の実DB再現（補助）
    if: >-
      github.event.pull_request.number == 4308 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 試練の固定headを取得
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: 実source headを照合
        run: |
          set -eu
          source_head="$(git rev-parse HEAD)"
          test "$source_head" = '${{ github.event.pull_request.head.sha }}'
          printf 'sourceHead=%s\n' "$source_head"

      - name: Java 21を準備
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradleを準備（キャッシュ読み取りのみ）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Gradle wrapperの実行権限を設定
        run: chmod +x gradlew

      - name: 対象の実MySQL試練2件を実行
        timeout-minutes: 30
        run: >-
          ./gradlew test --tests com.mannschaft.app.shiftbudget.ShiftBudgetPublicationGenerationIT
          --no-daemon --max-workers=1 -Pmax.parallel.forks=1 -PexcludeMigrationTests=true

      - name: 原JUnitと全ArchUnit storeを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cmp0718-repro-results-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            backend/build/test-results/test/TEST-com.mannschaft.app.shiftbudget.ShiftBudgetPublicationGenerationIT.xml
            backend/src/test/resources/archunit_store/*
          retention-days: 7
          if-no-files-found: error
