# =============================================================================
# OpenAPI Drift Check — pull_request to main（Phase 2 / 源流①の機械強制）
# =============================================================================
# 「BE の API を変えたのに docs/openapi.json を再生成していない PR」を CI で機械的に弾く。
#
# 背景（同期チェーン）:
#   BE コード ─①generateOpenApiDocs→ docs/openapi.json ─②generate:types→ 生成型
#   ②（openapi.json → 生成型）は frontend-ci.yml / check-generated-types.yml で強制済み。
#   ①（BE コード → openapi.json）だけ CI 不在だったのが慢性ドリフトの真因。本 workflow が①を担う。
#
# 決定性の前提（#2008 Phase0+1 で確立）:
#   OpenApiConfig の server 正規化 + 全スキーマのプロパティをアルファベット順に正準化する
#   customizer により docs/openapi.json はバイト決定的になった。よって main 同期済みの状態で
#   ./gradlew generateOpenApiDocs を回せば diff ゼロになる。本ゲートはその決定性に立脚する。
#
# 生成方法:
#   ./gradlew generateOpenApiDocs は openapi-gen プロファイル（application-openapi-gen.yml /
#   H2 インメモリ・Flyway 無効・Redis lazy）で BE を :8082 にフォークし /v3/api-docs から
#   docs/openapi.json を生成する。MySQL / Redis などの外部サービスは不要なため、
#   GitHub Actions ubuntu-latest 上で DB サービスコンテナ無しに完走する。
#
# ─────────────────────────────────────────────────────────────────────────────
# 段階運用（Stage A → B → C）:
#   - Stage A: 安定観測。本ゲートを「非必須チェック」として追加し、runner で
#              generateOpenApiDocs が安定して完走することを観測する。
#   - Stage B: 実 fail 運用（非必須のまま）。ドリフト PR は本ゲートが赤くなるが、
#              main ブランチ保護の required には未追加なのでマージ自体はブロックしない。
#   - Stage C: 必須化。main ブランチ保護 Ruleset の required status checks に
#              「OpenAPI Drift Check」を追加する（← **現在ここ**。登録済み）。
#
# 重要:
#   - 本 workflow は既存の必須チェック（backend-ci.yml の "Compile & Test" 等）を
#     一切改名・改変しない（既存 PR のマージ性を壊さないため）。
#   - チェック名「OpenAPI Drift Check」は main の Ruleset に required として登録済み。
#     **ジョブ名 / workflow 名を変更すると全 PR が永久ブロックされる。絶対に変えないこと。**
#
# ─────────────────────────────────────────────────────────────────────────────
# 2026-07-28: paths フィルタ起因の「永久 pending → BLOCKED」を根治（本ファイルの主変更）
#
#   【何が起きたか】
#     Stage C（required 登録）後、`on.pull_request.paths` に当たらない PR
#     （= Service / Repository / Entity / common だけ触る BE の PR・FE のみの PR・
#       ドキュメントのみの PR）で、本 workflow が **そもそも起動しなかった**。
#     GitHub の required status check は「その名前の結果が報告されるまで待つ」仕様のため、
#     起動しなかった workflow は成功も失敗も報告せず **永久 pending** となり、
#     PR は他の全チェックが緑でも mergeStateStatus=BLOCKED でマージ不能になる。
#
#   【実例】
#     PR #2484 — 12 チェック全緑・Failed 0 にもかかわらず BLOCKED。
#     `gh api repos/<owner>/<repo>/commits/<sha>/check-runs` に
#     「OpenAPI Drift Check」の check-run が **一件も存在しなかった**。
#     やむなく `--admin` で越える運用事故になった。
#     （変更ファイルは common/GlobalExceptionHandler.java 等で paths に当たらなかった）
#
#   【なぜ paths をトリガーから外し、ステップ側の if に移したか】
#     - トリガーの paths は「workflow を起動しない」＝ **結果を報告しない**。
#       required check とは構造的に噛み合わない（backend-ci.yml が 2026-05-25 に
#       同じ理由で全 PR トリガー化しており、その先例に揃えた）。
#     - 代わりに **ジョブは全 PR で必ず起動し、必ず success を報告する**。
#       関連変更が無い PR では重いステップ（Java/Gradle セットアップ・
#       generateOpenApiDocs・drift 判定）を step-level の `if` で skip して即終了する。
#     - **ジョブごと skip（job-level `if`）にはしない**。skipped な required check を
#       Ruleset がどう扱うかは曖昧な挙動に依存するため、
#       「常に走って常に緑を返す」形にして曖昧さを排除している。
#
#   【コスト設計】
#     無関係 PR でも runner は起動するが、checkout（fetch-depth: 0）と数秒の
#     パス判定だけで終わる。最長 30 分かかりうる generateOpenApiDocs は必ず
#     `if: steps.changes.outputs.openapi_related == 'true'` の配下に置くこと。
#     ここを条件付きから外すと CI 料金が跳ね上がる。
# =============================================================================

name: OpenAPI Drift Check

on:
  pull_request:
    branches:
      - main
    # ⚠️ ここに paths: を復活させてはならない。
    # required status check「OpenAPI Drift Check」が報告されず永久 pending になり、
    # 無関係な PR まで全て BLOCKED になる（上記 2026-07-28 の項を参照）。
    # 実行対象の絞り込みは下の「関連変更パス検出」ステップ + 各ステップの if で行う。
  workflow_dispatch:

# 同一 PR の新規 push で前回 run をキャンセル（既存 CI と独立した group）
concurrency:
  group: openapi-drift-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  # ---------------------------------------------------------------------------
  # drift-check
  #
  # ジョブは 1 本のまま・ジョブ名も「OpenAPI Drift Check」のまま維持する
  # （main Ruleset の required status check 登録名と一致させるため）。
  # ジョブ自体に if: を付けないこと（skipped な required check を避けるため）。
  # ---------------------------------------------------------------------------
  drift-check:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend

    steps:
      # PR の base...head 差分を見て関連変更を判定するため全履歴を取得する。
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 関連変更パス検出（旧 on.pull_request.paths と同一の 6 パターン）
      #
      # 判定の流儀は backend-ci.yml の detect ジョブに揃えている:
      #   - 3 ドット（BASE...HEAD = merge-base...head）で「PR が実際に加えた純変更」のみ対象。
      #     2 ドットだと base が分岐後に進めた変更まで拾い、無関係 PR で重い生成が走る。
      #   - 結果は $GITHUB_OUTPUT に書き出し、後続ステップの if で参照する。
      #   - pull_request 以外のイベント（workflow_dispatch 等）は PR コンテキストが無いため
      #     安全側（= 検査を実行する）にフォールバックする。
      #
      # ⚠️ このジョブは defaults.run.working-directory: ./backend が効くため、
      #    git をリポジトリルート基準で叩けるよう working-directory を明示的に上書きする。
      #    （backend/ 基準のままだと git diff の相対パスがずれて誤判定する）
      # -----------------------------------------------------------------------
      - name: 関連変更パス検出
        id: changes
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "[INFO] non-PR event (${{ github.event_name }}) → openapi_related=true（安全側でフル実行）"
            echo "openapi_related=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "[INFO] diff range: ${BASE_SHA}...${HEAD_SHA}"
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "----- changed files -----"
          echo "${CHANGED}"
          echo "-------------------------"
          # 旧 on.pull_request.paths の 6 パターンを正規表現へ落としたもの（増減させないこと）:
          #   1. backend/src/main/java/**/controller/**
          #   2. backend/src/main/java/**/dto/**
          #   3. backend/src/main/java/**/config/OpenApiConfig.java
          #   4. backend/src/main/resources/application-openapi-gen.yml
          #   5. backend/build.gradle.kts
          #   6. .github/workflows/openapi-drift-check.yml
          # glob の `**` は「0 個以上のパスセグメント」なので `(.*/)?` に対応させる。
          PATTERN='^(backend/src/main/java/(.*/)?(controller|dto)/|backend/src/main/java/(.*/)?config/OpenApiConfig\.java$|backend/src/main/resources/application-openapi-gen\.yml$|backend/build\.gradle\.kts$|\.github/workflows/openapi-drift-check\.yml$)'
          if echo "${CHANGED}" | grep -E "${PATTERN}" > /dev/null; then
            echo "[INFO] OpenAPI 関連の変更を検出 → openapi_related=true（ドリフト検査を実行）"
            echo "openapi_related=true" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] OpenAPI 関連の変更なし → openapi_related=false（重いステップを skip し success で終了）"
            echo "openapi_related=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java ${{ env.JAVA_VERSION }}
        if: steps.changes.outputs.openapi_related == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          # Gradle キャッシュは下の setup-gradle に一本化するため、ここでは有効化しない。

      # backend-ci.yml と同じ作法で Gradle 依存・wrapper・ビルドキャッシュを共有する。
      # 本 workflow は on: pull_request 主体で main への push では起動しないため、
      # PR ビルドでもキャッシュを育てられるよう cache-read-only: false を明示する。
      - name: Set up Gradle（依存＋ビルドキャッシュ）
        if: steps.changes.outputs.openapi_related == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Grant Gradle wrapper execute permission
        if: steps.changes.outputs.openapi_related == 'true'
        run: chmod +x gradlew

      # openapi-gen プロファイル（H2・:8082 フォーク・MySQL/Redis 不要）で docs/openapi.json を生成。
      # 生成先は build.gradle.kts の openApi{} 設定によりリポジトリルートの docs/openapi.json。
      # ⚠️ 最長 30 分かかる重量ステップ。必ず if 条件付きのままにすること（コスト設計の要）。
      - name: Generate OpenAPI docs
        if: steps.changes.outputs.openapi_related == 'true'
        run: ./gradlew generateOpenApiDocs --no-daemon --build-cache

      # 生成後の docs/openapi.json に差分があれば「BE 変更が未反映」とみなして fail する。
      # working-directory は backend なのでリポジトリルートのパスを ../ で指定する。
      - name: Check for OpenAPI drift
        id: drift
        if: steps.changes.outputs.openapi_related == 'true'
        run: |
          if ! git diff --exit-code ../docs/openapi.json; then
            echo ""
            echo "::error title=docs/openapi.json が古い状態です::BE の API 変更が docs/openapi.json に未反映です。'cd backend && ./gradlew generateOpenApiDocs' を実行し docs/openapi.json をコミットしてください"
            echo ""
            echo "----- docs/openapi.json の差分（先頭のみ） -----"
            git --no-pager diff ../docs/openapi.json | head -n 100
            echo "------------------------------------------------"
            exit 1
          fi
          echo "docs/openapi.json は BE の現状と同期しています。"

      # ドリフト判定ステップ（id: drift）が失敗したときだけ、CI が生成した openapi.json を artifact に残す。
      # 上の検査ログは差分の先頭 100 行しか出さないため、生成物そのものを取れないと
      # 「CI が生成した内容に docs/openapi.json を合わせる」修繕ができない
      # （ローカルでの再生成は turnstile 待ちで長時間かかりうる）。
      # artifact をダウンロードして docs/openapi.json へ置き、`npm run generate:types` で生成型を作り直す。
      - name: Upload generated openapi.json（ドリフト検出時のみ）
        if: always() && steps.drift.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-openapi-json
          path: docs/openapi.json
          if-no-files-found: warn
          retention-days: 7

      # 関連変更が無い PR はここで明示的に「スキップした」旨を残して success で終わる。
      # これにより required status check「OpenAPI Drift Check」が必ず結果を報告し、
      # 永久 pending → BLOCKED を構造的に防ぐ。
      - name: OpenAPI ドリフト検査をスキップ
        if: steps.changes.outputs.openapi_related != 'true'
        run: |
          echo "OpenAPI 関連ファイル（controller / dto / OpenApiConfig.java /"
          echo "application-openapi-gen.yml / build.gradle.kts / 本 workflow）の変更が"
          echo "無いため、OpenAPI ドリフト検査をスキップしました。"
          echo "required status check としては success を報告します。"

  # 検証専用一時PRのみ。既ジョブ/requiredチェック/通常PRはそのまま。
  owned-shift-bootjar:
    name: Owned Slot B4 bootJar artifact
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/shift-slot-b4-bootjar-ci-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OWNED_SHIFT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 402622dd1889eb2e008ab9d19950d6abb87dbb2e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: 固定sourceから実機用Jarだけ生成
        run: |
          python3 - <<'PY'
          """Slot+B4 CI専用bootJar来歴。workflow埋込み候補、未実行。"""
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat
          import struct
          import subprocess
          import sys
          import zipfile
          import zlib

          CHUNK = 4 * 1024 * 1024
          SOURCE_COMMIT = '402622dd1889eb2e008ab9d19950d6abb87dbb2e'
          SOURCE_TREE = '519eb1ea0879df5876497bbf1c0282f736fb6c36'
          HEADER_SHA = '77aacfdc9b39a71cfcb02a6e53c9add74ebb74e98fba06752ad00349db85af4a'
          JVM_BASE = '-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
          JVM_ADDED = '-XX:MaxDirectMemorySize=256m -XX:ReservedCodeCacheSize=128m'
          SOURCE_PINS = {'TEST_CONVENTION.md': '46d2ad708cb292de1854c3ae356c49feca2c86908af5073ca26793cd1263a11a', 'backend/BACKEND_CODING_CONVENTION.md': 'a4267924c901ae0f19852ff67a1982b6384022b9d41101693ea0d9e4f62860e5', 'backend/src/main/java/com/mannschaft/app/shift/dto/ChangeRequestResponse.java': 'ae11e033772c836858f04788e8b88c4ae6cdc0840274af02fcc8d1e70e93d721', 'backend/src/main/java/com/mannschaft/app/shift/dto/ReviewChangeRequestRequest.java': '6735d1bd9933fd01af8a82b1c4fbc77ace40c968be40ca9f22857fe38374c3d3', 'backend/src/main/java/com/mannschaft/app/shift/dto/ShiftSlotResponse.java': '73aeb18512db950b6130bce318eadb7467645e83b3dea1c54ea65e397ca96bc3', 'backend/src/main/java/com/mannschaft/app/shift/dto/SlotAssignmentPatchRequest.java': 'fdc6327936768690821fef50605e1de36af6c4d4f99e16d9f7736a69271e9ac9', 'backend/src/main/java/com/mannschaft/app/shift/service/ShiftChangeRequestService.java': '5c133a0e12aba8fe05413110b5db95909909076e248d4c74291282a288bf5346', 'backend/src/main/java/com/mannschaft/app/shift/service/ShiftSlotService.java': '1a47d9a069e566f05b2c5213f9038bc37bb2c1a61303746536d8574be127a6d3', 'backend/src/main/resources/db/migration/V237.20261008050316__align_shift_version_columns_to_bigint.sql': 'dc4d9befcb6c68f638385a0df48e9f04f01a3a61207cb29bd6f06b31a0a77e45', 'backend/src/test/java/com/mannschaft/app/common/migration/FlywayFromScratchMigrationTest.java': 'fd82c41ac4204f73f2654acf9028253fe0887126e7248c5dde1765e5a600d3ed', 'backend/src/test/java/com/mannschaft/app/common/migration/ShiftVersionBigintMigrationFixture.java': '5e79e814338875a7e89bb51ac754f12aad3482e41bf25acef8c54e9921773b4b', 'backend/src/test/java/com/mannschaft/app/shift/ShiftChangeRequestVersionContractIT.java': 'bdbd52c1e9ed35cac9bf4ebb7eab180438a92ac748beb6b745d15565b8da98d9', 'backend/src/test/java/com/mannschaft/app/shift/ShiftSlotServiceTest.java': '1624ac93e2622408dbf758c063d9cb50ca28f6d25ab8b1f46849ba9e47c9f987', 'backend/src/test/java/com/mannschaft/app/shift/ShiftSlotVersionContractIT.java': 'a86a9978a0cbc1937ebe19d8689c108ef4ce23cc57faf304e70821c0001e66b8', 'backend/src/test/java/com/mannschaft/app/shift/service/ShiftChangeRequestServiceAuthzTest.java': '3ba814ca22aa4308e2307ae91270f2a132662578d35271597f330d80edf67ec6', 'backend/src/test/java/com/mannschaft/app/shift/service/ShiftSlotFacadeTest.java': 'abbd54efe7d8e73a592ed2f283ce3a0da398e71888531fc2cb4bece6f4792fa4', 'docs/features/F03.5_shift/01_db_design.md': '7e7f7b725dcb37749a79d9d20776e0413e98109d212033d5a5151042b85c3ac6', 'docs/features/F03.5_shift/02_api_design.md': 'dbefd2a66fc96ce5524605722e5d38b74e78759aaea73451d962fbba9e946502', 'docs/features/F03.5_shift/README.md': '7877e5e029374b37e235833b92ccc22b0bc86f64e1e3322152f43b70d4b86a17', 'docs/openapi.json': '95716133749faa47d0d51247b889cf68878f8fdb062edacc201fb37a25a9624c', 'frontend/app/composables/shift/useShiftAssignmentApi.ts': '00cc4ff931a3616547a7114fa20bfd5f7fa59525e78f87630c263672441540b8', 'frontend/app/composables/useChangeRequest.ts': '7fa8f6de7e2d3f688ad8cdc8fd7839badab96fbd3f770a1e73928572d4c5952e', 'frontend/app/composables/useShiftBoard.ts': '9dcd311c65daa3861c80a5c20fe18276492e77451caea501c732aa508bc6bed9', 'frontend/app/pages/teams/[slug]/shifts/[scheduleId]/board.vue': '075e888cde107d6012bdc335fbb66516bebb9ac5dd1ad4fada2a06f2ae285cac', 'frontend/app/types/generated/index.ts': 'e90629eaecc9c381ac17053957996ac7fdd0b12b3271b67d477b0e8de7ab3153', 'frontend/app/types/shift.ts': 'e8c5fc8d6703f5945aedcac28324ecf397d5122847a16a39d14ba19a4a0a53fd', 'frontend/tests/unit/composables/useChangeRequestVersion.spec.ts': '5fbc225b99b05d5b236cc12752daf4f3ec6d190904aec6471197241f3f3ffea0', 'frontend/tests/unit/composables/useShiftBoardVersion.spec.ts': '11aa06f12cc19c87d427fd4c0508f94a8fb2c3ab3d61f7bb80a924c9613ac983'}


          def sha(path):
              h = hashlib.sha256()
              with Path(path).open('rb') as f:
                  while block := f.read(CHUNK):
                      h.update(block)
              return h.hexdigest()


          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()


          def save(path, value):
              with path.open('xb') as f:
                  f.write(canonical(value))
              return {'path': path.name, 'SHA': sha(path), 'bytes': path.stat().st_size}


          def run(argv, cwd=None):
              return subprocess.check_output(argv, cwd=cwd, stderr=subprocess.STDOUT).decode().strip()


          def git(*args):
              return run(['git', '--no-optional-locks', *args])


          def source_snapshot(artifact, label):
              commit = git('rev-parse', 'HEAD')
              tree = git('rev-parse', 'HEAD^{tree}')
              assert (commit, tree) == (SOURCE_COMMIT, SOURCE_TREE), 'fixed-checkout'
              raw = subprocess.check_output(['git', '--no-optional-locks', 'ls-tree', '-r', '-l', '-z', 'HEAD', '--', 'backend/'])
              header_files, physical_files = [], []
              for entry in raw.split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t', 1)
                  mode, kind, blob, size = metadata.decode().split()
                  name = name.decode('utf-8')
                  assert kind == 'blob' and mode in ('100644', '100755'), 'backend-regular-file'
                  path = Path(name)
                  assert path.is_file() and not path.is_symlink(), 'physical-file'
                  size = int(size)
                  actual_mode = '100755' if path.stat().st_mode & 0o111 else '100644'
                  assert actual_mode == mode, 'physical-mode'
                  raw_bytes = path.read_bytes()
                  def git_blob(value):
                      return hashlib.sha1(('blob ' + str(len(value)) + '\0').encode() + value).hexdigest()
                  canonical_bytes = raw_bytes
                  transformation = 'NONE'
                  if git_blob(raw_bytes) != blob:
                      canonical_bytes = raw_bytes.replace(b'\r\n', b'\n')
                      transformation = 'CRLF_TO_LF_EXACT_GIT_BLOB'
                  assert git_blob(canonical_bytes) == blob and len(canonical_bytes) == size, 'exact-canonical-git-blob'
                  row = {'path': name, 'mode': mode, 'blob': blob, 'bytes': size}
                  header_files.append(row)
                  physical_files.append(dict(row, physicalSHA=hashlib.sha256(raw_bytes).hexdigest(), rawBytes=len(raw_bytes), canonicalSHA=hashlib.sha256(canonical_bytes).hexdigest(), transformation=transformation))
              header = {'commit': commit, 'tree': tree, 'files': header_files}
              assert hashlib.sha256(canonical(header)).hexdigest() == HEADER_SHA, 'exact-approved-backend-header'
              assert len(header_files) == 12178 and sum(x['bytes'] for x in header_files) == 95542759, 'backend-count-bytes'
              expected_paths = {x['path'] for x in header_files}
              actual_paths = set()
              for path in Path('backend').rglob('*'):
                  rel = path.relative_to('backend')
                  if rel.parts[0] in ('build', '.gradle'):
                      continue
                  assert not path.is_symlink(), 'backend-no-extra-symlinks'
                  if path.is_file():
                      actual_paths.add(path.as_posix())
              assert actual_paths == expected_paths, 'backend-no-untracked-source'
              sourcePins, sourcePins_physical = {}, {}
              for name, expected_sha in SOURCE_PINS.items():
                  path = Path(name)
                  assert path.is_file() and not path.is_symlink(), 'sourcePins-regular'
                  blob = subprocess.check_output(['git', '--no-optional-locks', 'show', 'HEAD:' + name])
                  assert hashlib.sha256(blob).hexdigest() == expected_sha, 'sourcePins-git-canonical'
                  raw_bytes = path.read_bytes()
                  canonical_bytes = raw_bytes if raw_bytes == blob else raw_bytes.replace(b'\r\n', b'\n')
                  assert canonical_bytes == blob, 'sourcePins-physical-canonical'
                  sourcePins[name] = expected_sha
                  sourcePins_physical[name] = {'physicalSHA': hashlib.sha256(raw_bytes).hexdigest(), 'rawBytes': len(raw_bytes), 'canonicalSHA': expected_sha, 'bytes': len(blob), 'mode': '100755' if path.stat().st_mode & 0o111 else '100644'}
              manifest = {'commit': commit, 'tree': tree, 'headerSHA': HEADER_SHA, 'files': physical_files, 'sourcePinsCanonicalPins': sourcePins, 'sourcePinsPhysicalPins': sourcePins_physical}
              pin = save(artifact / ('backend-source-' + label + '.json'), manifest)
              return manifest, pin


          def toolchain():
              java_home = Path(os.environ['JAVA_HOME']).resolve()
              java_version = run([str(java_home / 'bin/java'), '-version'])
              raw_gradle_version = run(['bash', './gradlew', '--version', '--no-daemon', '--console=plain'], cwd='backend')
              version_marker = re.search(r'(?m)^Gradle 8\.14\.4\s*$', raw_gradle_version)
              assert version_marker, 'gradle8144'
              # 初回のdownload/welcome出力は版fingerprintに含めない。配布物bytesは別途全libをpinする。
              gradle_version = raw_gradle_version[version_marker.start():]
              gradle_user_home = Path(os.environ.get('GRADLE_USER_HOME', str(Path.home() / '.gradle')))
              homes = list((gradle_user_home / 'wrapper/dists/gradle-8.14.4-bin').glob('*/gradle-8.14.4'))
              assert len(homes) == 1, 'exact-wrapper-distribution'
              gradle_home = homes[0]
              gradle = gradle_home / 'bin/gradle'
              assert 'version "21.' in java_version and ('Temurin' in java_version or 'temurin' in java_version), 'temurin21'
              assert re.search(r'(?m)^Gradle 8\.14\.4\s*$', gradle_version), 'gradle8144'
              files = [java_home / 'bin/java', java_home / 'bin/javac', java_home / 'release', java_home / 'lib/modules', java_home / 'lib/server/libjvm.so', gradle, Path('backend/gradle/wrapper/gradle-wrapper.properties'), Path('backend/gradle/wrapper/gradle-wrapper.jar'), Path('backend/gradlew')]
              files.extend(sorted((gradle_home / 'lib').rglob('*.jar')))
              pins = [{'path': str(p), 'SHA': sha(p), 'bytes': p.stat().st_size} for p in files]
              fingerprint = {'distribution': 'temurin', 'javaMajor': 21, 'gradleVersion': '8.14.4', 'javaVersionOutput': java_version, 'gradleVersionOutput': gradle_version, 'files': pins, 'notSameBytesAsLocalOpenJDK21': True}
              return dict(fingerprint, rawGradleVersionOutput=raw_gradle_version, fingerprintSHA=hashlib.sha256(canonical(fingerprint)).hexdigest(), versionArgv=['bash', './gradlew', '--version', '--no-daemon', '--console=plain'])


          def jar_manifest(artifact):
              jars = [p for p in Path('backend/build/libs').glob('*.jar') if not p.name.endswith('-plain.jar')]
              assert len(jars) == 1, 'exactly-one-bootjar'
              jar = jars[0]
              assert jar.is_file() and not jar.is_symlink(), 'jar-regular'
              members, names = [], set()
              entry = 'BOOT-INF/classes/com/mannschaft/app/MannschaftApplication.class'
              entry_major = None
              with zipfile.ZipFile(jar) as z:
                  for member in z.infolist():
                      name = member.filename
                      parts = name.rstrip('/').split('/')
                      assert name and not name.startswith('/') and '\\' not in name and '\0' not in name and all(x not in ('', '.', '..') for x in parts), 'safe-member-path'
                      assert not re.match(r'^[A-Za-z]:', name) and name not in names, 'unique-relative-member'
                      assert not stat.S_ISLNK(member.external_attr >> 16), 'no-member-symlink'
                      names.add(name)
                      h, size, crc, first = hashlib.sha256(), 0, 0, b''
                      with z.open(member) as f:
                          while block := f.read(CHUNK):
                              if len(first) < 8:
                                  first += block[:8 - len(first)]
                              h.update(block)
                              size += len(block)
                              crc = zlib.crc32(block, crc)
                      assert size == member.file_size and crc & 0xffffffff == member.CRC, 'member-size-crc'
                      if name == entry:
                          assert first[:4] == b'\xca\xfe\xba\xbe', 'entry-class-magic'
                          entry_major = struct.unpack('>H', first[6:8])[0]
                          assert entry_major == 65, 'entry-class-java21'
                      members.append({'member': name, 'bytes': size, 'CRC': member.CRC, 'compressedBytes': member.compress_size, 'SHA': h.hexdigest(), 'directory': member.is_dir()})
              assert entry_major == 65, 'entry-class-present'
              assert {'org/springframework/boot/loader/launch/PropertiesLauncher.class', 'org/springframework/boot/loader/launch/JarLauncher.class'} <= names, 'boot-loader-present'
              dependencies = [x for x in members if x['member'].startswith('BOOT-INF/lib/') and not x['directory']]
              assert dependencies and all(x['member'].endswith('.jar') for x in dependencies), 'dependency-library-pins'
              member_pin = save(artifact / 'jar-members.json', members)
              destination = artifact / jar.name
              shutil.copyfile(jar, destination)
              assert sha(destination) == sha(jar), 'artifact-exact-jar'
              return {'path': destination.name, 'SHA': sha(destination), 'bytes': destination.stat().st_size, 'fullMembersManifest': member_pin, 'entryClass': entry, 'entryClassMajor': entry_major, 'javaMajor': 21, 'dependencyLibraryPins': dependencies}


          def main():
              artifact = Path('shift-slot-b4-buildonly-artifact')
              artifact.mkdir(mode=0o700)
              workflow = {k: os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA', 'GITHUB_JOB', 'OWNED_SHIFT_PR_HEAD')}
              receipt = {'schema': 'shift-slot-b4-ci-buildonly-provenance/v1', 'workflow': workflow, 'source': None, 'toolchain': {}, 'build': {'argv': None, 'actualExit': None}, 'jar': None, 'status': 'NOT_BUILT', 'remoteProcessClosure': 'NOT_OBSERVED', 'compileAppTestDBGreen': False, 'applicationStarted': False, 'testsStarted': False, 'databaseStarted': False, 'seedStarted': False, 'deploymentStarted': False, 'doesNotClaimGlobalProcessZero': True}
              try:
                  before, before_pin = source_snapshot(artifact, 'before')
                  receipt['source'] = {'actualCheckoutCommit': SOURCE_COMMIT, 'actualCheckoutTree': SOURCE_TREE, 'expectedBackendHeaderSHA': HEADER_SHA, 'backendBefore': before_pin, 'backendAfter': None, 'sourcePinsCanonicalPins': before['sourcePinsCanonicalPins'], 'overlays': []}
                  receipt['toolchain']['before'] = toolchain()
                  match = re.search(r'(?m)^org\.gradle\.jvmargs=(.*)$', Path('backend/gradle.properties').read_text())
                  assert match and match.group(1).strip() == JVM_BASE, 'unchanged-source-jvm'
                  argv = ['bash', './gradlew', '-Dorg.gradle.jvmargs=' + JVM_BASE + ' ' + JVM_ADDED, 'bootJar', '--no-daemon', '--max-workers=1', '--console=plain', '--no-build-cache']
                  receipt['build']['argv'] = argv
                  receipt['build']['argvSHA'] = hashlib.sha256(canonical(argv)).hexdigest()
                  receipt['status'] = 'BUILD_STARTED'
                  actual_exit = subprocess.run(argv, cwd='backend', check=False).returncode
                  receipt['build']['actualExit'] = actual_exit
                  after, after_pin = source_snapshot(artifact, 'after')
                  receipt['source']['backendAfter'] = after_pin
                  assert before == after, 'build-source-before-after-identical'
                  receipt['toolchain']['after'] = toolchain()
                  assert receipt['toolchain']['before']['fingerprintSHA'] == receipt['toolchain']['after']['fingerprintSHA'], 'toolchain-before-after-identical'
                  assert actual_exit == 0, 'bootjar-actual-exit'
                  receipt['jar'] = jar_manifest(artifact)
                  runtime_manifest = {'sourceHead': SOURCE_COMMIT, 'sourceTree': SOURCE_TREE, 'backendTree': 'c151eb503f6eacf7ada1f16c73aa56e62c05a688', 'frontendTree': 'feb23613d507130c11d854f6c4b39b6419489877', 'runId': os.environ['GITHUB_RUN_ID'], 'jarFile': receipt['jar']['path'], 'jarBytes': receipt['jar']['bytes'], 'jarSha256': receipt['jar']['SHA'], 'backendManifest': {x['path']: {'bytes': x['bytes'], 'sha256': x['canonicalSHA'], 'gitBlob': x['blob']} for x in after['files']}, 'buildArgv': argv, 'appStarted': False, 'sourceBeforePin': before_pin, 'sourceAfterPin': after_pin, 'toolchainFingerprintSHA': receipt['toolchain']['after']['fingerprintSHA'], 'fullJarMembersPin': receipt['jar']['fullMembersManifest']}
                  receipt['runtimeManifest'] = save(artifact / 'runtime-manifest.json', runtime_manifest)
                  receipt['status'] = 'BOOTJAR_BUILD_ONLY_NOT_RUNTIME_OR_TEST_GREEN'
              except BaseException as exc:
                  receipt['status'] = 'UNKNOWN_OR_BUILD_FAILURE'
                  receipt['failureType'] = type(exc).__name__
                  raise
              finally:
                  save(artifact / 'provenance.json', receipt)
              return 0


          if __name__ == '__main__':
              sys.exit(main())
