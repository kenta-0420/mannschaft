          JVM_BASE = '-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
          JVM_ADDED = '-XX:MaxDirectMemorySize=256m -XX:ReservedCodeCacheSize=128m'
