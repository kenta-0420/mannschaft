# =============================================================================
# Frontend CI — pull_request to main / push to main
# =============================================================================
# Runs install, lint, and typecheck on every PR targeting main.
# No AWS credentials required — build and deploy are intentionally omitted.
#
# main への push でも実行する理由:
# 本ワークフローは元々 pull_request のみで main では一度も走らなかった。
# そのため main に壊れた状態（例: eslint-suppressions.json のカウント乖離で
# lint が exit 2）が紛れ込んでも誰も気づけず、次に frontend を触った
# 無関係な PR が赤くなって初めて露見していた。push トリガを追加し main を
# 常時監視することで、壊れた main を早期検知する。
# =============================================================================

name: Frontend — CI (PR Check)

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docs/openapi.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docs/openapi.json"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  # push イベントでは github.event.pull_request.number が空になるため、
  # PR番号だけだと main への全 push が単一グループに落ちて次々キャンセルされ、
  # main 監視の実績が一度も残らない。push は github.sha で個別グループにする。
  group: frontend-ci-${{ github.event.pull_request.number || github.sha }}
  # cancel-in-progress は PR の再実行のみに適用する（main の検証を打ち切らないため）。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 依存関係の既知脆弱性スキャン（OWASP A06）。
      # 設計書 docs/security/04_dependency_and_supply_chain.md §4/§6 に基づく。
      # high レベルの脆弱性が 0 件のためブロッキング化（2026-06-02）。
      - name: npm audit (依存脆弱性スキャン)
        run: npm audit --audit-level=high

      - name: Generate OpenAPI types
        run: npm run generate:types

      - name: Check for type drift
        run: |
          if ! git diff --quiet app/types/generated/index.ts; then
            echo "::error::openapi.json と生成型が乖離しています。npm run generate:types を実行してください"
            git diff app/types/generated/index.ts
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        # nuxt typecheck (vue-tsc) はプロジェクト成長で node 既定ヒープ(約4GB)を超過し
        # CI ランナーで OOM(exit 134) する。ubuntu-latest は 16GB RAM のためヒープを 8GB に引き上げる。
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # ユニットテスト（Issue #2609 後続）。ワーカー過剰供給是正のため
      # vitest.config.ts の maxWorkers はコア数8未満（本ランナーは2〜4コア）
      # では未指定（vitest既定）のまま動くため、typecheck と同様の
      # メモリ配慮は不要（多コア機のみで踏む問題のため）。
      - name: Unit test (vitest)
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # Docker ビルド検証
  # ---------------------------------------------------------------------------
  # frontend-deploy.yml（デプロイ経路）は AWS secrets 未設定のため一度も実行された
  # ことがなく、Dockerfile が実際にビルドできるかは検証されていなかった。デプロイ
  # 当日に初めて Dockerfile が壊れていると気づく事態を防ぐため、PR CI で毎回
  # `docker build` のみを実行する（ECR への push は行わず、AWS 資格情報も不要）。
  #
  # 独立ジョブにした理由: 上の `build` ジョブは npm ci → lint → typecheck →
  # unit test という Node 環境前提の直列ステップ列であり、Docker ビルドは
  # コンテナイメージの成否という別の関心事のため、そこへ割り込ませず並列の
  # 別ジョブとして追加した（`build` ジョブの既存ステップの順序・条件には触れていない）。
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Actions のキャッシュ（gha）を使う。ECR push は行わないため
      # レイヤーキャッシュを跨ぐ実利用は無いが、npm ci を含む重いビルド
      # ステージ（deps/builder）の再実行を毎PRごとに避け、CI 所要時間を
      # 抑えるために使う。
      - name: Build frontend Docker image (push なし)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: mannschaft-frontend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
