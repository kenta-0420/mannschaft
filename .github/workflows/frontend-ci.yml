# =============================================================================
# Frontend CI — pull_request to main
# =============================================================================
# Runs install, lint, and typecheck on every PR targeting main.
# No AWS credentials required — build and deploy are intentionally omitted.
# =============================================================================

name: Frontend — CI (PR Check)

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docs/openapi.json"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 依存関係の既知脆弱性スキャン（OWASP A06）。
      # 設計書 docs/security/04_dependency_and_supply_chain.md §4/§6 に基づく。
      # high レベルの脆弱性が 0 件のためブロッキング化（2026-06-02）。
      - name: npm audit (依存脆弱性スキャン)
        run: npm audit --audit-level=high

      - name: Generate OpenAPI types
        run: npm run generate:types

      - name: Check for type drift
        run: |
          if ! git diff --quiet app/types/generated/index.ts; then
            echo "::error::openapi.json と生成型が乖離しています。npm run generate:types を実行してください"
            git diff app/types/generated/index.ts
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        # nuxt typecheck (vue-tsc) はプロジェクト成長で node 既定ヒープ(約4GB)を超過し
        # CI ランナーで OOM(exit 134) する。ubuntu-latest は 16GB RAM のためヒープを 8GB に引き上げる。
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
