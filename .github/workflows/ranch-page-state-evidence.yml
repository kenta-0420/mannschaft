name: Ranch page state — red and green evidence 4a0f69d1

on:
  push:
    branches:
      - 'feature/ranch-page-state-4a0f69d1-20261014-01'

env:
  NODE_VERSION: "22.23.2"

permissions:
  contents: read

concurrency:
  group: ranch-page-state-4a0f69d1-20261014-01
  cancel-in-progress: false

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TZ: UTC
      SOURCE_SHA: '4a0f69d12c1440bdbfc3986bb20e4d1bec514e78'
      BASELINE_SHA: 'dafcf6bc1f3a92b93ac3ca203c4660fe18aa80f3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '4a0f69d12c1440bdbfc3986bb20e4d1bec514e78'
          fetch-depth: 0
      - name: SHAと証拠対象を確認
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          mkdir -p ../ci-ranch-state
          printf '%s\n' "$SOURCE_SHA" "$BASELINE_SHA" > ../ci-ranch-state/revisions.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 固定lockで依存を導入
        run: npm ci
      - name: 修正前3ファイルでbehavior REDを実測
        run: |
          set -euo pipefail
          for file in app/composables/useRanchState.ts app/components/ranch/RanchPageContent.vue app/components/ranch/RanchWidgetContent.vue; do
            git show "${BASELINE_SHA}:frontend/${file}" > "$file"
          done
          set +e
          npm run test:unit -- app/components/ranch/RanchPageContent.state.spec.ts --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=../ci-ranch-state/red.json > ../ci-ranch-state/red.log 2>&1
          red_exit=$?
          set -e
          printf '%s\n' "$red_exit" > ../ci-ranch-state/red-exit.txt
          cat ../ci-ranch-state/red.log
          test "$red_exit" -ne 0
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('../ci-ranch-state/red.json', 'utf8'))
          const assertions = report.testResults.flatMap(result => result.assertionResults ?? [])
          const target = assertions.find(result => result.title === 'ごはんとTOUCH後にようすが更新され、続くpauseは最新versionを送る')
          const failures = (target?.failureMessages ?? []).join('\n')
          if (target?.status !== 'failed' || !failures.includes('20 XP') || !failures.includes('0 XP')) {
            throw new Error('RED_NOT_PROVEN: 起動・環境失敗は同期欠落のREDとして数えない')
          }
          console.log('RED_PROVEN: feed成功後もようすが0 XPのままで20 XP assertionが失敗')
          NODE
      - name: 修正HEADを戻してbehaviorと既存境界をGREEN検証
        run: |
          set -euo pipefail
          git restore --source="$SOURCE_SHA" --worktree -- app/composables/useRanchState.ts app/components/ranch/RanchPageContent.vue app/components/ranch/RanchWidgetContent.vue
          npm run test:unit -- app/components/ranch/RanchPageContent.state.spec.ts app/composables/useRanchState.account.spec.ts app/components/widgets/WidgetRanch.account.spec.ts app/components/widgets/WidgetRanch.activation.spec.ts tests/unit/pages/ranchStart.visibility.spec.ts --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=../ci-ranch-state/green.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('../ci-ranch-state/green.json', 'utf8'))
          const behavior = report.testResults.find(result => result.name.endsWith('RanchPageContent.state.spec.ts'))
          const assertions = behavior?.assertionResults ?? []
          if (assertions.length !== 6 || assertions.some(result => result.status !== 'passed') || report.numFailedTests !== 0) {
            throw new Error('GREEN_NOT_PROVEN: 新behavior全6件と既存境界の合格が必要')
          }
          console.log('GREEN_PROVEN: 新behavior全6件と既存境界が合格')
          NODE
      - name: REDとGREENの証拠を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranch-page-state-4a0f69d1-20261014-01
          path: ci-ranch-state/
          if-no-files-found: error

  canonical_frontend:
    name: Canonical frontend checks on fixed ranch source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: '4a0f69d12c1440bdbfc3986bb20e4d1bec514e78'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 依存関係の既知脆弱性スキャン（OWASP A06）。
      # 設計書 docs/security/04_dependency_and_supply_chain.md §4/§6 に基づく。
      # high レベルの脆弱性が 0 件のためブロッキング化（2026-06-02）。
      - name: Audit gate regression tests
        run: node --test scripts/audit-with-exemption.test.mjs scripts/patch-nuxt-devtools-simple-git.test.mjs

      - name: npm audit (依存脆弱性スキャン)
      # 【期限付き除外】GHSA-86w9-cpqp-85rv（node-forge）と GHSA-vfj7-8cjw-p6xm（braces）を名指しで除外（期限 2026-10-16、超過で exit 1）。
      # 理由: 両依存の修正版が未公開。限定調査の範囲と非到達未証明の留保は security04 §4.3/§4.4 を参照。
      # 解除条件: 各修正版の導入または依存撤去で該当例外を削除し、全解除後に npm audit --audit-level=high に戻す。
      # audit-level を下げることは禁止。詳細は scripts/audit-with-exemption.mjs 冒頭と docs/task-list.md。
        run: node scripts/audit-with-exemption.mjs

      - name: Generate OpenAPI types
        run: npm run generate:types

      - name: Check for type drift
        run: |
          if ! git diff --quiet app/types/generated/index.ts; then
            echo "::error::openapi.json と生成型が乖離しています。npm run generate:types を実行してください"
            git diff app/types/generated/index.ts
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        # nuxt typecheck (vue-tsc) はプロジェクト成長で node 既定ヒープ(約4GB)を超過し
        # CI ランナーで OOM(exit 134) する。ubuntu-latest は 16GB RAM のためヒープを 8GB に引き上げる。
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # ユニットテスト（Issue #2609 後続）。ワーカー過剰供給是正のため
      # vitest.config.ts の maxWorkers はコア数8未満（本ランナーは2〜4コア）
      # では未指定（vitest既定）のまま動くため、typecheck と同様の
      # メモリ配慮は不要（多コア機のみで踏む問題のため）。
      - name: Unit test (vitest)
        run: npm run test:unit

