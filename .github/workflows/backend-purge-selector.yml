name: Backend — purge method selector proof (8eeb)

on:
  push:
    branches:
      - feature/ranch-purge-selector-8eeb-20261014-01

permissions:
  contents: read

concurrency:
  group: purge-selector-8eeb-${{ github.run_id }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  purge-method:
    name: Purge exact method (${{ matrix.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: withdrawal-renewal
            method: 退会取消と再申請は元参加状態を保ち旧配送で復帰しない
          - key: populated-restoration
            method: 名前XP残高と所有配置済み置物は退会申請中操作を拒否して取消後に同値復帰する
    defaults:
      run:
        working-directory: product/backend
        shell: bash
    steps:
      - name: 検分済み workflow/helper を採用commitから取得
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: 試験sourceを8eebに固定
        uses: actions/checkout@v7
        with:
          ref: 8eeb33e37e22eec11d5f75b9f722b7b6f2961225
          path: product
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle（正規Backend CIと同じ依存・ビルドキャッシュ）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications

      - name: 固定source・selectorヘッダーを記録
        run: |
          python3 ../../harness/.github/scripts/purge-selector/evidence.py prepare \
            --repo-root .. --key '${{ matrix.key }}' \
            --selector 'com.mannschaft.app.ranch.RanchPurgeServiceIT.${{ matrix.method }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow-sha '${{ github.sha }}' --workflow-ref '${{ github.ref }}' \
            --event-name '${{ github.event_name }}' --output-dir build/purge-selector

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Compile（正規Backend CIと同一）
        run: ./gradlew compileJava compileTestJava --no-daemon --build-cache

      - name: Run tests（exact methodをこのjobで実走）
        id: run-tests
        run: |
          set +e
          ./gradlew test --no-daemon --continue --build-cache \
            --init-script ../../harness/.github/scripts/purge-selector/selector.init.gradle \
            -Ppurge.selector='com.mannschaft.app.ranch.RanchPurgeServiceIT.${{ matrix.method }}' \
            --tests 'com.mannschaft.app.ranch.RanchPurgeServiceIT.${{ matrix.method }}'
          test_exit=$?
          set -e
          printf '%s\n' "$test_exit" > build/purge-selector/run-tests-exit.txt
          exit "$test_exit"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: 0case・他class・余分case・失敗skipを証拠採択から拒否
        if: always()
        run: |
          python3 ../../harness/.github/scripts/purge-selector/evidence.py verify \
            --repo-root .. --key '${{ matrix.key }}' \
            --selector 'com.mannschaft.app.ranch.RanchPurgeServiceIT.${{ matrix.method }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow-sha '${{ github.sha }}' --workflow-ref '${{ github.ref }}' \
            --event-name '${{ github.event_name }}' --output-dir build/purge-selector

      - name: job固有identity・実数・actualexit・JUnitXMLだけを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purge-selector-8eeb-${{ matrix.key }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            product/backend/build/purge-selector/*.json
            product/backend/build/purge-selector/run-tests-exit.txt
            product/backend/build/test-results/test/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
