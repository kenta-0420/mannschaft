name: Backend — shard0 cache5 diagnostic (1c6411fc)

on:
  push:
    branches:
      - feature/ranch-shard0-cache5-1c6411fc-20261015-01

permissions:
  contents: read

concurrency:
  group: shard0-cache5-1c6411fc-${{ github.run_id }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  SHARD_TOTAL: "6"

jobs:
  shard0-cache5:
    name: Shard0 cache5 hypothesis diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        working-directory: product/backend
        shell: bash
    steps:
      - name: Checkout reviewed helper event
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout exact product 1c6411fc
        uses: actions/checkout@v7
        with:
          ref: 1c6411fcb13cbee4cfd4de7e2a972a2426746735
          path: product
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle（normal CIと同じ設定）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Record exact source and install observation-only init
        run: |
          python3 ../../harness/.github/scripts/shard0-cache5-1c6411fc/evidence.py prepare \
            --repo-root .. --harness-root ../../harness \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow-sha '${{ github.sha }}' --workflow-ref '${{ github.ref }}' \
            --event-name '${{ github.event_name }}'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Compile（normal CI argv unchanged）
        run: |
          python3 ../../harness/.github/scripts/shard0-cache5-1c6411fc/evidence.py run \
            --repo-root .. --phase compile -- \
            ./gradlew compileJava compileTestJava --no-daemon --build-cache

      - name: Test shard0（only cache maxSize property added）
        run: |
          python3 ../../harness/.github/scripts/shard0-cache5-1c6411fc/evidence.py run \
            --repo-root .. --phase test -- \
            ./gradlew test --no-daemon --continue --build-cache \
            -Pshard.total=6 -Pshard.index=0 -PexcludeMigrationTests=false \
            -Pspring.test.context.cache.maxSize=5
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Record finite outcome without normal-CI adoption
        if: always()
        run: |
          python3 ../../harness/.github/scripts/shard0-cache5-1c6411fc/evidence.py finalize --repo-root ..

      - name: Upload finite diagnostic metadata（raw logs/dumps excluded）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard0-cache5-1c6411fc-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: product/backend/build/shard0-cache5-1c6411fc/*.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload JUnit XML（private artifact, character data not projected）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard0-cache5-1c6411fc-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product/backend/build/test-results/**/*.xml
            product/backend/src/test/resources/archunit_store/*
          retention-days: 7
          if-no-files-found: warn
