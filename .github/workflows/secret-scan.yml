# =============================================================================
# 秘密情報スキャン（gitleaks） — PR差分ゲート + 週次フル履歴スキャン
# =============================================================================
# 本リポジトリは PUBLIC 運用（デプロイ前に Private 化予定）。GitHub の
# secret scanning / push protection は有効だが、secret_scanning_non_provider_patterns
# が無効のため、自前発行の JWT・DBパスワード・Cookie 等は検知されない。
# gitleaks でこれを補い、機械的に混入を防止する。
#
# gitleaks-action（有料ライセンスが必要）は使わず、公式リリースの Linux バイナリを
# 直接取得して実行する。バージョンは固定（latest は使わない）。
#
# ジョブA: PR差分スキャン（必須ゲート） — ベースブランチとの差分のみを走査
# ジョブB: フル履歴スキャン（週次） — 全履歴を走査（時間がかかるため週次のみ）
#
# 2026-08-12: 初版作成（PUBLIC リポジトリ運用における秘密混入の機械的防止戦役）
# =============================================================================

name: 秘密情報スキャン（gitleaks）

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 毎週火曜 JST 10:00（UTC 01:00）に実行（security-scan.yml の月曜と重ならないようずらす）
    - cron: '0 1 * * 2'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # 検査ジョブは打ち切らない（cancel-in-progress: false）。
  # 過去に「mainのCIがcancel-in-progressで常に打ち切られ、緑の実績がゼロなのに
  # 誰も気づかない」事故が起きている。打ち切ってよいのはdeployであって検査ではない。
  cancel-in-progress: false

env:
  # 殿の実測環境（8.28.0）に合わせる。allowlistのcondition="AND"はgitleaks 8.19以降で
  # 使用可能だが、検証環境と実行環境を揃える意味でも最新の実測済みバージョンに固定する。
  GITLEAKS_VERSION: "8.28.0"

jobs:
  # ---------------------------------------------------------------------------
  # ジョブA: PR差分スキャン（必須ゲート）
  # フル履歴（15.6万オブジェクト/252MB）を毎PRで走らせると遅いため、
  # ベースブランチから HEAD までの差分のみを走査する。
  # ---------------------------------------------------------------------------
  diff-scan:
    name: PR差分スキャン
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source（履歴を含めて取得）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks バイナリを取得
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: "走査範囲を決定（PR: ベース〜HEAD差分 / push: 直前コミットとの差分）"
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          # push で before が全ゼロ（新規ブランチ等）の場合は直前1コミットに限定
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          echo "log_opts=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: gitleaks 実行（差分スキャン・ログに秘密を出力しない）
        id: gitleaks
        run: |
          set -euo pipefail
          mkdir -p reports
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${{ steps.range.outputs.log_opts }}" \
            --redact \
            --report-format sarif \
            --report-path reports/gitleaks-diff.sarif \
            --exit-code 1 \
            --verbose

      - name: スキャンレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-diff-report-${{ github.run_number }}
          path: reports/gitleaks-diff.sarif
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ジョブB: フル履歴スキャン（週次）
  # ---------------------------------------------------------------------------
  full-history-scan:
    name: フル履歴スキャン（週次）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source（全履歴を取得）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks バイナリを取得
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: gitleaks 実行（全履歴スキャン・ログに秘密を出力しない）
        run: |
          set -euo pipefail
          mkdir -p reports
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path reports/gitleaks-full.sarif \
            --exit-code 1 \
            --verbose

      - name: スキャンレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-report-${{ github.run_number }}
          path: reports/gitleaks-full.sarif
          retention-days: 30
          if-no-files-found: ignore
