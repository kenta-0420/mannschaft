name: Infra — Terraform Apply

# main ブランチへの push（= PR マージ）で terraform apply を実行する。
# bootstrap（infra/terraform/bootstrap/README.md）が完了して GitHub variable
# INFRA_CI_ENABLED=true が設定されるまで、ジョブは if: 条件でスキップされる（眠っている）。
#
# 必要な GitHub variables / secrets（一覧は infra/README.md 参照）:
#   vars.INFRA_CI_ENABLED            — 'true' で CI 起動
#   vars.INFRA_TF_APPLY_ROLE_ARN     — bootstrap output tf_apply_role_arn
#   vars.INFRA_DOMAIN_NAME           — 本番ドメイン名（TF_VAR_domain_name として注入）
#   vars.INFRA_CLOUDFLARE_ACCOUNT_ID — Cloudflare アカウント ID
#   vars.INFRA_CLOUDFLARE_ZONE_ID    — Cloudflare ゾーン ID
#   secrets.CLOUDFLARE_API_TOKEN     — cloudflare provider の認証トークン

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-apply.yml"

permissions:
  id-token: write
  contents: read

# apply の同時実行を直列化する。実行中の apply を中断すると state が壊れ得るため
# cancel-in-progress は付けない（後続は待機する）。
concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply (envs/prod)
    # bootstrap 完了まで眠らせるゲート
    if: vars.INFRA_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 必須変数は GitHub variables から TF_VAR_ 経由で注入（prod.tfvars は gitignore のため CI に存在しない）
      TF_VAR_domain_name: ${{ vars.INFRA_DOMAIN_NAME }}
      TF_VAR_cloudflare_account_id: ${{ vars.INFRA_CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.INFRA_CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Configure AWS credentials (OIDC / apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INFRA_TF_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Terraform init
        run: terraform init -input=false

      # ログに差分を残すための plan（apply は直後に再計画して適用する）
      - name: Terraform plan
        run: terraform plan -no-color -input=false

      - name: Terraform apply
        run: terraform apply -no-color -input=false -auto-approve
