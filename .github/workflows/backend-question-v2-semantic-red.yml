# 実行sourceはsource-review済み旧3cb＋TEST_ONLY commitへ固定。workflow/docs commitとは別SHA。
# 既存CI・製品コード・テスト期待値は変更しない。限定RED診断専用。
name: Backend — Question v2 semantic RED diagnostic
run-name: Question v2 semantic RED / ${{ github.sha }}

on:
  push:
    branches:
      - feature/question-v2-semantic-red-ci

permissions:
  contents: read

concurrency:
  group: backend-question-v2-semantic-red-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  semantic-red:
    name: Question v2 semantic RED (diagnostic only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout reviewed TEST-ONLY source
        uses: actions/checkout@v7
        with:
          ref: 49fb75180addfcab0a63b842f14bfeb7e3801a53
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle（既存cache読取のみ）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Verify Docker availability
        run: docker info > /dev/null

      - name: Compile
        timeout-minutes: 15
        run: ./gradlew compileJava compileTestJava --no-daemon --build-cache

      - name: Run three question v2 RED class selectors（test cache不使用）
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p build/test-results/test
          set +e
          ./gradlew test --no-daemon --no-build-cache \
          --tests 'com.mannschaft.app.diagnosis.service.DiagnosisQuestionnaireCatalogTest' \
          --tests 'com.mannschaft.app.diagnosis.service.DiagnosisApprovedQuestionnaireRegistryTest' \
          --tests 'com.mannschaft.app.diagnosis.DiagnosisQuizPersistenceIT' \
          -Pmax.parallel.forks=1 \
          -x archUnitTest -x archUnitFreezeStoreIntegrityTest
          task_status=$?
          printf '%s\n' "$task_status" > build/test-results/test/question-v2-gradle-exit.txt
          exit "$task_status"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload selected test XML and actual Gradle exit（失敗時も保存）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-v2-semantic-red-xml-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/test-results/test/TEST-com.mannschaft.app.diagnosis.service.DiagnosisQuestionnaireCatalogTest.xml
            backend/build/test-results/test/TEST-com.mannschaft.app.diagnosis.service.DiagnosisApprovedQuestionnaireRegistryTest.xml
            backend/build/test-results/test/TEST-com.mannschaft.app.diagnosis.DiagnosisQuizPersistenceIT.xml
            backend/build/test-results/test/question-v2-gradle-exit.txt
          retention-days: 3
          if-no-files-found: error
