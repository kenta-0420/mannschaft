name: Backend — Ranch DATE fixed source verification (1c6411fc)

on:
  push:
    branches:
      - feature/ranch-date-roundtrip-fixed-1c6411fc-20261015-01

permissions:
  contents: read

concurrency:
  group: ranch-date-roundtrip-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ranch-date-method:
    name: Ranch DATE (${{ matrix.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: utc-red
            timezone: UTC
          - key: jst-control
            timezone: Asia/Tokyo
    defaults:
      run:
        working-directory: product/backend
        shell: bash
    steps:
      - name: 検分済みhelperをevent commitから取得
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: 採用済みtestだけを追加したsource commitを固定checkout
        uses: actions/checkout@v7
        with:
          ref: 1c6411fcb13cbee4cfd4de7e2a972a2426746735
          path: product
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle（依存取得のみ、test成果物を再利用しない）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          gradle-home-cache-includes: |
            caches
            notifications
      - name: 固定source・method・初期timezoneのheaderを採取
        run: |
          python3 ../../harness/.github/scripts/ranch-date-selector/evidence.py prepare \
            --repo-root .. --key '${{ matrix.key }}' --selector 'com.mannschaft.app.ranch.RanchCareDateRoundTripHttpIT.無料care保存後のDATEと本人GETがUTC週を保ち再操作でも親密度は一日一回' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow-sha '${{ github.sha }}' --workflow-ref '${{ github.ref }}' \
            --event-name '${{ github.event_name }}' --output-dir build/ranch-date-selector
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Exact methodを指定初期timezoneで実走（cache・up-to-date禁止）
        id: run-tests
        run: |
          set +e
          ./gradlew test --no-daemon --no-build-cache --rerun-tasks -x jacocoTestReport \
            --init-script ../../harness/.github/scripts/ranch-date-selector/selector.init.gradle \
            -Ptest.timezone='${{ matrix.timezone }}' -Pdate.selector='com.mannschaft.app.ranch.RanchCareDateRoundTripHttpIT.無料care保存後のDATEと本人GETがUTC週を保ち再操作でも親密度は一日一回' \
            --tests 'com.mannschaft.app.ranch.RanchCareDateRoundTripHttpIT.無料care保存後のDATEと本人GETがUTC週を保ち再操作でも親密度は一日一回' > build/ranch-date-selector/gradle.private.log 2>&1
          test_exit=$?
          set -e
          printf '%s\n' "$test_exit" > build/ranch-date-selector/run-tests-exit.txt
          printf 'GRADLE_TEST_EXIT=%s\n' "$test_exit"
          exit "$test_exit"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
      - name: 実class・method・実数・cached driver timezone・DATE assertionを有限分類
        if: always()
        run: |
          python3 ../../harness/.github/scripts/ranch-date-selector/evidence.py verify \
            --repo-root .. --key '${{ matrix.key }}' --selector 'com.mannschaft.app.ranch.RanchCareDateRoundTripHttpIT.無料care保存後のDATEと本人GETがUTC週を保ち再操作でも親密度は一日一回' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow-sha '${{ github.sha }}' --workflow-ref '${{ github.ref }}' \
            --event-name '${{ github.event_name }}' --output-dir build/ranch-date-selector
      - name: 有限identity・actualexit・DATE分類だけをartifact化（private log/生XMLは送信しない）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranch-date-selector-${{ matrix.key }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            product/backend/build/ranch-date-selector/*.json
            product/backend/build/ranch-date-selector/run-tests-exit.txt
            product/backend/build/ranch-date-selector/finite-junit.xml
          retention-days: 7
          if-no-files-found: error
