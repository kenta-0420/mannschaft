name: Modulith spike registry red

on:
  push:
    branches:
      - spike/cmp-261021-0017-modulith-261021

permissions:
  contents: read

concurrency:
  group: modulith-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry-red:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout throwaway spike
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Record execution environment
        run: |
          git rev-parse HEAD
          java -version
          docker info --format '{{.ServerVersion}}'
      - name: Run registry test before persistence filter implementation
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/spike-evidence
          bash ./scripts/gradle-turnstile.sh bash ./gradlew modulithRegistrySpike --console=plain 2>&1 | tee build/spike-evidence/registry-red.log
      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modulith-registry-red-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            backend/build/test-results/modulithRegistrySpike/
            backend/build/reports/tests/modulithRegistrySpike/
            backend/build/spike-evidence/
            backend/build/reports/problems/
            docs/evidence/CMP-261021-1602-modulith-spike-schema.txt