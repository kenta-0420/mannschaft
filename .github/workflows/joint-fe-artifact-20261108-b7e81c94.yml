# 承認用資料。まだ .github/workflows に配置しない。
name: joint FE production artifact b7e81c94
'on':
  push:
    branches: ['feature/october-joint-fe-artifact-20261108-78469caf']
    paths: ['.github/workflows/joint-fe-artifact-20261108-b7e81c94.yml']
permissions:
  contents: read
concurrency:
  group: joint-fe-artifact-b7e81c94
  cancel-in-progress: false
jobs:
  produce:
    if: github.repository == 'kenta-0420/mannschaft' && github.event_name == 'push' && github.ref == 'refs/heads/feature/october-joint-fe-artifact-20261108-78469caf'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: 固定push sourceをcheckout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: 既存exact Nodeを用意（cache保存なし）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          check-latest: false
      - name: source差分・入力・tool・入口資源を記録
        id: source
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/joint-fe-b7e81c94"
          mkdir -m 700 "$RUNNER_TEMP/joint-fe-b7e81c94/payload" "$RUNNER_TEMP/joint-fe-b7e81c94/home"
          : > "$RUNNER_TEMP/joint-fe-b7e81c94/empty-npmrc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,shutil,platform
          R=pathlib.Path(os.environ['RUNNER_TEMP'])/'joint-fe-b7e81c94'
          H='ee02706b27ea790c7cffb572d386f80be4c6688d'
          WF='.github/workflows/joint-fe-artifact-20261108-b7e81c94.yml'
          def git(*a):return subprocess.check_output(['git',*a])
          actual=git('rev-parse','HEAD').decode().strip()
          assert actual==os.environ['GITHUB_SHA']
          parents=git('show','-s','--format=%P','HEAD').decode().split();assert len(parents)==1
          BASE=parents[0]
          assert git('diff','--name-only',BASE,'HEAD').decode().splitlines()==[WF]
          assert git('rev-parse',BASE+'^{tree}').decode().strip()=='52bce8d63febd30cdcd6317e022e1b19b4c3d204'
          ft=git('rev-parse','HEAD:frontend').decode().strip()
          assert ft==git('rev-parse',BASE+':frontend').decode().strip()=='e3e396ce9c0b091325f66ce12b4a1babf237d34b'
          paths=['frontend','.github','scripts','config','public','test-fixtures','.githooks','.gitattributes','.nvmrc','.npmrc','package.json','package-lock.json','npm-shrinkwrap.json','.github/workflows/frontend-ci.yml','frontend/package.json','frontend/package-lock.json','frontend/nuxt.config.ts','scripts/verification-run.mjs','docs/openapi.json','backend/scripts','backend/src/main/resources','backend/src/main/java/com/mannschaft/app/social/SocialErrorCode.java','backend/src/main/java/com/mannschaft/app/social/announcement/AnnouncementSourceType.java','backend/src/main/java/com/mannschaft/app/tournament/TournamentErrorCode.java','backend/src/main/java/com/mannschaft/app/school/entity/AbsenceReason.java','backend/src/main/java/com/mannschaft/app/diagnosis/controller/DiagnosisController.java','backend/src/main/java/com/mannschaft/app/ranch/controller/RanchAssignmentController.java','backend/src/main/java/com/mannschaft/app/ranch/dto/AssignmentResult.java']
          def inputs(ref):
              out={}
              for p in paths:
                  q=subprocess.run(['git','cat-file','-t',ref+':'+p],capture_output=True)
                  if q.returncode:
                      assert q.returncode==128
                      out[p]={'present':False};continue
                  kind=q.stdout.decode().strip();oid=git('rev-parse',ref+':'+p).decode().strip()
                  row={'present':True,'kind':kind,'oid':oid}
                  if kind=='blob':
                      b=git('cat-file','blob',ref+':'+p);row.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                  out[p]=row
              return out
          baseline,current=inputs(BASE),inputs('HEAD')
          assert [p for p in paths if baseline[p]!=current[p]]==['.github']
          versions={t:subprocess.check_output([t,'--version']).decode().strip() for t in ['node','npm']}
          (R/'tool-versions.json').write_text(json.dumps(versions)+'\n')
          assert versions=={'node':'v22.23.2','npm':'10.9.8'}
          tools={}
          for tool in ['node','npm']:
              p=pathlib.Path(shutil.which(tool)).resolve();tools[tool]={'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          mem={k:int(v.split()[0])*1024 for k,v in (x.split(':',1) for x in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ['MemTotal','MemAvailable','SwapTotal','SwapFree']}
          mem.update(diskFreeBytes=shutil.disk_usage('.').free)
          (R/'initial-resources.json').write_text(json.dumps(mem,indent=2)+'\n')
          print(json.dumps({'initialResourceBytes':mem}),flush=True)
          record={'sourceHead':BASE,'originalLocalJointHeadH':H,'equivalentSourceS':BASE,'producerHeadP':actual,'sourceTree':'52bce8d63febd30cdcd6317e022e1b19b4c3d204','actualCheckoutCommit':actual,'producerTree':git('rev-parse','HEAD^{tree}').decode().strip(),'frontendTree':ft,'workflowOnlyDifference':WF,'workflowSHA256':hashlib.sha256(pathlib.Path(WF).read_bytes()).hexdigest(),'inputBaseline':baseline,'inputActual':current,'all28Equivalent':False,'expectedOnlyDifferentInput':'.github','toolVersions':{'node':'v22.23.2','npm':'10.9.8'},'os':{'machine':platform.machine(),'kernel':platform.release()},'tools':tools,'initialResources':dict(mem,diskFreeBytes=shutil.disk_usage('.').free),'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'repository':os.environ['GITHUB_REPOSITORY'],'ref':os.environ['GITHUB_REF']}
          (R/'source.json').write_text(json.dumps(record,indent=2)+'\n')
          assert mem['MemAvailable']>=14*1024**3
          PY
      - name: 正規npm ci（私有cache・明示env・process-local core対策）
        id: deps
        working-directory: frontend
        run: |
          set -euo pipefail
          printf '0\n' > /proc/self/coredump_filter
          ulimit -c 0
          node -e "if(require('fs').readFileSync('/proc/self/coredump_filter','utf8').trim()!=='00000000')process.exit(1)"
          set +e
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/joint-fe-b7e81c94/home" LANG=C.UTF-8 TZ=UTC CI=true HUSKY=0 NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/joint-fe-b7e81c94/empty-npmrc" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/joint-fe-b7e81c94/empty-npmrc" NPM_CONFIG_CACHE="$RUNNER_TEMP/joint-fe-b7e81c94/npm-cache" npm ci
          actual=$?
          set -e
          printf '{"actualExit":%s}\n' "$actual" > "$RUNNER_TEMP/joint-fe-b7e81c94/npm-ci-exit.json"
          exit "$actual"
      - name: 既存供給網gate（例外・閾値を変更しない）
        id: audit
        working-directory: frontend
        run: |
          set -euo pipefail
          printf '0\n' > /proc/self/coredump_filter
          ulimit -c 0
          node --test scripts/audit-with-exemption.test.mjs scripts/patch-nuxt-devtools-simple-git.test.mjs
          node scripts/audit-with-exemption.mjs
      - name: 非秘密Node producer factsだけを観測するpreloadを用意
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/joint-fe-b7e81c94/node-facts"
          cat > "$RUNNER_TEMP/joint-fe-b7e81c94/node-observer.cjs" <<'JS'
          const fs = require('node:fs'), path = require('node:path'), v8 = require('node:v8');
          const { threadId, isMainThread } = require('node:worker_threads');
          const options = process.env.NODE_OPTIONS || '';
          const coreFilter = fs.readFileSync('/proc/self/coredump_filter','utf8').trim();
          const entry = process.argv[1] || '';
          const isNuxtEntry = /(?:nuxt|nuxi)(?:[\/]|\.m?js|$)|@nuxt[\/]cli/.test(entry);
          const row = { pid:process.pid, ppid:process.ppid, threadId, isMainThread, isNuxtEntry, nodeOptions:options, coreFilter, heapLimitBytes:v8.getHeapStatistics().heap_size_limit };
          if (isMainThread && isNuxtEntry && (!options.includes('--max-old-space-size=8192') || coreFilter !== '00000000')) throw new Error('NUXT_PRODUCER_INPUT_CHANGED');
          fs.writeFileSync(path.join(__dirname,'node-facts',`${process.pid}-${threadId}.json`),JSON.stringify(row),{flag:'wx',mode:0o600});
          JS
      - name: fresh資源確認後に通常production build
        id: build
        working-directory: frontend
        run: |
          set -euo pipefail
          printf '0\n' > /proc/self/coredump_filter
          ulimit -c 0
          node -e "if(require('fs').readFileSync('/proc/self/coredump_filter','utf8').trim()!=='00000000')process.exit(1)"
          python3 - <<'PY'
          import pathlib,os,json,shutil
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'joint-fe-b7e81c94'
          mem={k:int(v.split()[0])*1024 for k,v in (x.split(':',1) for x in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ['MemTotal','MemAvailable','SwapTotal','SwapFree']}
          mem.update(diskFreeBytes=shutil.disk_usage('.').free,coreFilter=pathlib.Path('/proc/self/coredump_filter').read_text().strip())
          (r/'prebuild-resources.json').write_text(json.dumps(mem,indent=2)+'\n')
          print(json.dumps({'prebuildResourceBytes':{k:v for k,v in mem.items() if type(v)is int}}),flush=True)
          assert mem['MemAvailable']>=14*1024**3
          PY
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/joint-fe-b7e81c94/build-time.txt" env -i PATH="$PATH" HOME="$RUNNER_TEMP/joint-fe-b7e81c94/home" LANG=C.UTF-8 TZ=UTC CI=true HUSKY=0 NODE_ENV=production NODE_OPTIONS="--max-old-space-size=8192 --require=$RUNNER_TEMP/joint-fe-b7e81c94/node-observer.cjs" NUXT_PUBLIC_API_BASE=http://localhost:8085 NUXT_INTERNAL_API_BASE=http://localhost:8085 NUXT_PUBLIC_BASE_URL=http://localhost:3005 NUXT_GENERATE_SPA=false npm run build
          actual=$?
          set -e
          printf '{"actualExit":%s}\n' "$actual" > "$RUNNER_TEMP/joint-fe-b7e81c94/build-exit.json"
          exit "$actual"
      - name: regular-only・512MiB以内のoutputとproducer manifestを確定
        id: package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json,os,stat,subprocess
          R=pathlib.Path(os.environ['RUNNER_TEMP'])/'joint-fe-b7e81c94'
          root=pathlib.Path('frontend/.output');assert root.is_dir() and not root.is_symlink()
          assert (root/'server/index.mjs').is_file() and (root/'server/node_modules/vue/index.mjs').is_file()
          assert subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'])==b''
          rows=[];total=0
          for p in sorted(root.rglob('*')):
              s=p.lstat();assert not stat.S_ISLNK(s.st_mode)
              rel=p.relative_to(root).as_posix();assert not any(ord(c)<32 for c in rel) and '\\' not in rel
              assert not (s.st_mode&(stat.S_ISUID|stat.S_ISGID))
              if stat.S_ISDIR(s.st_mode):continue
              assert stat.S_ISREG(s.st_mode)
              total+=s.st_size;assert total<=512*1024**2
              rows.append({'path':rel,'bytes':s.st_size,'mode':stat.S_IMODE(s.st_mode),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert rows
          source=json.loads((R/'source.json').read_text());ci=json.loads((R/'npm-ci-exit.json').read_text());build=json.loads((R/'build-exit.json').read_text());assert ci['actualExit']==build['actualExit']==0
          nodePaths=sorted((R/'node-facts').glob('*.json'));assert 0<len(nodePaths)<=256
          assert sum(p.stat().st_size for p in nodePaths)<=262144
          nodeFacts=[json.loads(p.read_text()) for p in nodePaths]
          assert any(x['isMainThread'] and x['isNuxtEntry'] for x in nodeFacts)
          assert all(x['coreFilter']=='00000000' and '--max-old-space-size=8192' in x['nodeOptions'] for x in nodeFacts)
          source.update(state='CI_PRODUCER_CANDIDATE_ROOT_ADOPTION_PENDING',runtimeAdopted=False,nodeProducerFacts=nodeFacts,nodeObserverSHA256=hashlib.sha256((R/'node-observer.cjs').read_bytes()).hexdigest(),nodeObserverScope='startup facts for Node processes/threads that inherited preload; no full environment or argv',files=rows,logicalBytes=total,noSymlinks=True,regularFilesOnly=True,buildActualExit=build['actualExit'],npmCiActualExit=ci['actualExit'],prebuildResources=json.loads((R/'prebuild-resources.json').read_text()),productionEnvironment={'NODE_ENV':'production','NODE_OPTIONS':'--max-old-space-size=8192 --require='+str(R/'node-observer.cjs'),'NUXT_PUBLIC_API_BASE':'http://localhost:8085','NUXT_INTERNAL_API_BASE':'http://localhost:8085','NUXT_PUBLIC_BASE_URL':'http://localhost:3005','NUXT_GENERATE_SPA':'false','CI':'true','HUSKY':'0'},environmentScope='explicit nonsecret allowlist passed to npm; npm may augment PATH',nuxtVersion=json.loads(pathlib.Path('frontend/node_modules/nuxt/package.json').read_text())['version'],cliVersion=json.loads(pathlib.Path('frontend/node_modules/@nuxt/cli/package.json').read_text())['version'],compilerInputSHA256={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in [pathlib.Path('frontend/node_modules/nuxt/bin/nuxt.mjs'),pathlib.Path('frontend/node_modules/@nuxt/cli/package.json')]},buildTimeMetadata=(R/'build-time.txt').read_text(),peakScope='GNU time max RSS only; not aggregate process-tree peak')
          raw=(json.dumps(source,indent=2)+'\n').encode();assert len(raw)<=16*1024**2
          (R/'payload/manifest.json').write_bytes(raw)
          PY
          tar --hard-dereference --format=posix --pax-option=delete=atime,delete=ctime --sort=name --numeric-owner --owner=0 --group=0 -czf "$RUNNER_TEMP/joint-fe-b7e81c94/payload/frontend-output.tar.gz" -C frontend .output
          python3 - <<'PY'
          import pathlib,hashlib,json,os,tarfile
          R=pathlib.Path(os.environ['RUNNER_TEMP'])/'joint-fe-b7e81c94/payload'
          m=json.loads((R/'manifest.json').read_text());expected={'.output/'+x['path']:x for x in m['files']};seen=set();p=R/'frontend-output.tar.gz';assert p.stat().st_size<=512*1024**2
          with tarfile.open(p,'r:gz')as tf:
              for item in tf:
                  q=pathlib.PurePosixPath(item.name);assert not q.is_absolute() and '..' not in q.parts and q.parts[0]=='.output'
                  if item.isdir():continue
                  assert item.type in (tarfile.REGTYPE,tarfile.AREGTYPE) and item.name not in seen and item.name in expected
                  row=expected[item.name];assert item.size==row['bytes'] and hashlib.sha256(tf.extractfile(item).read()).hexdigest()==row['sha256'];seen.add(item.name)
          assert seen==set(expected)
          receipt={'state':'PACKAGED_FOR_OFFICIAL_UPLOAD_NOT_RUNTIME_ADOPTION','archiveBytes':p.stat().st_size,'archiveSHA256':hashlib.sha256(p.read_bytes()).hexdigest(),'manifestSHA256':hashlib.sha256((R/'manifest.json').read_bytes()).hexdigest(),'logicalBytes':m['logicalBytes'],'regularNoSymlinkArchiveVerified':True,'actualCheckoutCommit':m['actualCheckoutCommit'],'sourceHead':m['sourceHead'],'originalLocalJointHeadH':m['originalLocalJointHeadH'],'equivalentSourceS':m['equivalentSourceS'],'producerHeadP':m['producerHeadP'],'frontendTree':m['frontendTree'],'runId':m['runId'],'runAttempt':m['runAttempt'],'buildActualExit':m['buildActualExit'],'rawArtifactBodyPrinted':False,'secretEnvironmentDumped':False}
          (R/'producer-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: 公式artifactへ限定3fileを1日保存
        id: production_upload
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: joint-fe-ee02706-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/joint-fe-b7e81c94/payload/frontend-output.tar.gz
            ${{ runner.temp }}/joint-fe-b7e81c94/payload/manifest.json
            ${{ runner.temp }}/joint-fe-b7e81c94/payload/producer-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1
          compression-level: 0
      - name: always collect bounded nonsecret failure diagnostics
        id: diagnostics
        if: ${{ always() }}
        env:
          DIAG_JOB_STATUS: ${{ job.status }}
          DIAG_SOURCE: ${{ steps.source.outcome }}
          DIAG_DEPS: ${{ steps.deps.outcome }}
          DIAG_AUDIT: ${{ steps.audit.outcome }}
          DIAG_BUILD: ${{ steps.build.outcome }}
          DIAG_PACKAGE: ${{ steps.package.outcome }}
          DIAG_PRODUCTION_UPLOAD: ${{ steps.production_upload.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,json,stat,re,hashlib
          R=pathlib.Path(os.environ['RUNNER_TEMP'])/'joint-fe-b7e81c94'
          D=R.with_name(R.name+'-diagnostics');D.mkdir(mode=0o700)
          LIMIT=1024*1024;used=0
          # Only known files below our regular, nonsymlink owned root are read. No globs outside node-facts.
          def read(name,cap=131072):
              global used
              parts=pathlib.PurePosixPath(name).parts;p=R
              if not R.exists():return None
              if R.is_symlink() or not R.is_dir():raise RuntimeError('UNSAFE_DIAGNOSTIC_ROOT')
              for part in parts:
                  p=p/part
                  if p.is_symlink():raise RuntimeError('DIAGNOSTIC_SYMLINK')
              if not p.exists():return None
              st=p.lstat()
              if not stat.S_ISREG(st.st_mode) or st.st_size>cap or used+st.st_size>LIMIT:raise RuntimeError('DIAGNOSTIC_LIMIT_OR_TYPE')
              used+=st.st_size
              return p.read_bytes()
          def obj(name):
              b=read(name);return json.loads(b) if b is not None else None
          def resources(name):
              o=obj(name)
              if o is None:return {'state':'unknown','values':None}
              keys=['MemTotal','MemAvailable','SwapTotal','SwapFree','diskFreeBytes']
              return {'state':'observed','values':{k:o[k] for k in keys if type(o.get(k))is int and o[k]>=0}}
          def exit_value(name):
              o=obj(name)
              return {'state':'observed','actualExit':o['actualExit']} if o is not None and type(o.get('actualExit'))is int else {'state':'unknown','actualExit':None}
          summary={'diagnosticOnly':True,'successEvidence':False,'jobStatusAtCollection':os.environ['DIAG_JOB_STATUS'],'stepOutcomes':{k:os.environ.get('DIAG_'+k,'unknown') for k in ['SOURCE','DEPS','AUDIT','BUILD','PACKAGE','PRODUCTION_UPLOAD']},'initialResources':resources('initial-resources.json'),'prebuildResources':resources('prebuild-resources.json'),'npmCi':exit_value('npm-ci-exit.json'),'build':exit_value('build-exit.json')}
          source=obj('source.json');summary['source']={'state':'unknown'}
          if source is not None:
              keys=['sourceHead','originalLocalJointHeadH','equivalentSourceS','producerHeadP','sourceTree','actualCheckoutCommit','producerTree','frontendTree','workflowSHA256']
              summary['source']={'state':'observed',**{k:source[k] for k in keys if isinstance(source.get(k),str) and re.fullmatch('[0-9a-f]{40}|[0-9a-f]{64}',source[k])}}
          v=obj('tool-versions.json');summary['toolVersions']={'state':'unknown'}
          if v is not None:summary['toolVersions']={'state':'observed',**{k:v[k] for k in ['node','npm'] if isinstance(v.get(k),str) and re.fullmatch('v?[0-9]+\.[0-9]+\.[0-9]+',v[k])}}
          summary['nodeFacts']={'state':'unknown','rows':[]};nd=R/'node-facts'
          if nd.is_symlink():raise RuntimeError('DIAGNOSTIC_SYMLINK')
          if nd.is_dir():
              ps=sorted(nd.glob('*.json'));assert len(ps)<=256
              rows=[]
              for p in ps:
                  assert re.fullmatch('[0-9]+-[0-9]+\.json',p.name)
                  o=obj('node-facts/'+p.name)
                  if o is None:continue
                  row={k:o[k] for k in ['pid','ppid','threadId','heapLimitBytes'] if type(o.get(k))is int and o[k]>=0}
                  row.update({k:o[k] for k in ['isMainThread','isNuxtEntry'] if type(o.get(k))is bool})
                  row.update(coreFilterZero=o.get('coreFilter')=='00000000',heap8192OptionObserved='--max-old-space-size=8192' in str(o.get('nodeOptions','')))
                  rows.append(row)
              summary['nodeFacts']={'state':'observed' if rows else 'unknown','rows':rows}
          b=read('build-time.txt',16384);summary['gnuTime']={'state':'unknown','numeric':{}}
          if b is not None:
              allowed=['User time (seconds)','System time (seconds)','Maximum resident set size (kbytes)','Major (requiring I/O) page faults','Minor (reclaiming a frame) page faults','Exit status']
              vals={}
              for line in b.decode('utf-8',errors='replace').splitlines():
                  for key in allowed:
                      prefix=key+':'
                      if line.strip().startswith(prefix):
                          value=line.strip()[len(prefix):].strip()
                          if re.fullmatch('[0-9]+(?:\.[0-9]+)?',value):vals[key]=float(value) if '.' in value else int(value)
              summary['gnuTime']={'state':'observed','numeric':vals,'aggregateTreePeakProven':False}
          summary['inputBytesRead']=used
          raw=(json.dumps(summary,indent=2)+'\n').encode();assert len(raw)<=LIMIT
          (D/'diagnostic.json').write_bytes(raw)
          print(json.dumps({'diagnosticBytes':len(raw),'inputBytesRead':used,'buildExitObserved':summary['build']['state']=='observed'}),flush=True)
          PY
      - name: always upload diagnostics separately from production output
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: joint-fe-diagnostics-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/joint-fe-b7e81c94-diagnostics/diagnostic.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1
          compression-level: 0
