# 承認用資料。まだ .github/workflows に配置しない。
name: joint FE production artifact b7e81c94
'on':
  push:
    branches: ['feature/october-joint-fe-artifact-20261108-78469caf']
    paths: ['.github/workflows/joint-fe-artifact-20261108-b7e81c94.yml']
permissions:
  contents: read
concurrency:
  group: joint-fe-artifact-b7e81c94
  cancel-in-progress: false
jobs:
  produce:
    if: github.repository == 'kenta-0420/mannschaft' && github.event_name == 'push' && github.ref == 'refs/heads/feature/october-joint-fe-artifact-20261108-78469caf'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: 固定push sourceをcheckout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: 既存exact Nodeを用意（cache保存なし）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          check-latest: false
      - name: source差分・入力・tool・入口資源を記録
        id: source
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/joint-fe-b7e81c94"
          mkdir -m 700 "$RUNNER_TEMP/joint-fe-b7e81c94/payload" "$RUNNER_TEMP/joint-fe-b7e81c94/home"
          : > "$RUNNER_TEMP/joint-fe-b7e81c94/empty-user-npmrc"
          : > "$RUNNER_TEMP/joint-fe-b7e81c94/empty-global-npmrc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,shutil,platform
          R=pathlib.Path(os.environ['RUNNER_TEMP'])/'joint-fe-b7e81c94'
          H='0647a7f2aa98bdabaeb18708dd420a677009cad4'
          WF='.github/workflows/joint-fe-artifact-20261108-b7e81c94.yml'
          def git(*a):return subprocess.check_output(['git',*a])
          actual=git('rev-parse','HEAD').decode().strip()
          assert actual==os.environ['GITHUB_SHA']
          parents=git('show','-s','--format=%P','HEAD').decode().split();assert parents==['95b5a591623015cefc471f3475c0bf22d2718235','d37c830673c71ae01d9bf2b85e547db1ee398a3f']
          BASE='d37c830673c71ae01d9bf2b85e547db1ee398a3f'
          if subprocess.run(['git','cat-file','-e',BASE+'^{commit}'],capture_output=True).returncode:
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',BASE],check=True)
          assert git('diff','--name-status',BASE,'HEAD').decode().splitlines()==['A\t'+WF]
          assert git('rev-parse',BASE+'^{tree}').decode().strip()=='df0204e2b0ba26b5d914f569598e0587e359bfd8'
          ft=git('rev-parse','HEAD:frontend').decode().strip()
          assert ft==git('rev-parse',BASE+':frontend').decode().strip()=='17e5648808c917713d993a16672e5255a49c6e02'
          paths=['frontend','.github','scripts','config','public','test-fixtures','.githooks','.gitattributes','.nvmrc','.npmrc','package.json','package-lock.json','npm-shrinkwrap.json','.github/workflows/frontend-ci.yml','frontend/package.json','frontend/package-lock.json','frontend/nuxt.config.ts','scripts/verification-run.mjs','docs/openapi.json','backend/scripts','backend/src/main/resources','backend/src/main/java/com/mannschaft/app/social/SocialErrorCode.java','backend/src/main/java/com/mannschaft/app/social/announcement/AnnouncementSourceType.java','backend/src/main/java/com/mannschaft/app/tournament/TournamentErrorCode.java','backend/src/main/java/com/mannschaft/app/school/entity/AbsenceReason.java','backend/src/main/java/com/mannschaft/app/diagnosis/controller/DiagnosisController.java','backend/src/main/java/com/mannschaft/app/ranch/controller/RanchAssignmentController.java','backend/src/main/java/com/mannschaft/app/ranch/dto/AssignmentResult.java']
          def inputs(ref):
              out={}
              for p in paths:
                  q=subprocess.run(['git','cat-file','-t',ref+':'+p],capture_output=True)
                  if q.returncode:
                      assert q.returncode==128
                      out[p]={'present':False};continue
                  kind=q.stdout.decode().strip();oid=git('rev-parse',ref+':'+p).decode().strip()
                  row={'present':True,'kind':kind,'oid':oid}
                  if kind=='blob':
                      b=git('cat-file','blob',ref+':'+p);row.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                  out[p]=row
              return out
          baseline,current=inputs(BASE),inputs('HEAD')
          assert [p for p in paths if baseline[p]!=current[p]]==['.github']
          versions={t:subprocess.check_output([t,'--version']).decode().strip() for t in ['node','npm']}
          (R/'tool-versions.json').write_text(json.dumps(versions)+'\n')
          assert versions=={'node':'v22.23.2','npm':'10.9.8'}
          tools={}
          for tool in ['node','npm']:
              p=pathlib.Path(shutil.which(tool)).resolve();tools[tool]={'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          mem={k:int(v.split()[0])*1024 for k,v in (x.split(':',1) for x in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ['MemTotal','MemAvailable','SwapTotal','SwapFree']}
          mem.update(diskFreeBytes=shutil.disk_usage('.').free)
          (R/'initial-resources.json').write_text(json.dumps(mem,indent=2)+'\n')
          print(json.dumps({'initialResourceBytes':mem}),flush=True)
          record={'sourceHead':BASE,'originalLocalJointHeadH':H,'equivalentSourceS':BASE,'producerHeadP':actual,'directParent':parents[0],'directParents':parents,'sourceTree':'df0204e2b0ba26b5d914f569598e0587e359bfd8','actualCheckoutCommit':actual,'producerTree':git('rev-parse','HEAD^{tree}').decode().strip(),'frontendTree':ft,'workflowOnlyDifference':WF,'workflowSHA256':hashlib.sha256(pathlib.Path(WF).read_bytes()).hexdigest(),'inputBaseline':baseline,'inputActual':current,'all28Equivalent':False,'expectedOnlyDifferentInput':'.github','toolVersions':{'node':'v22.23.2','npm':'10.9.8'},'os':{'machine':platform.machine(),'kernel':platform.release()},'tools':tools,'initialResources':dict(mem,diskFreeBytes=shutil.disk_usage('.').free),'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'repository':os.environ['GITHUB_REPOSITORY'],'ref':os.environ['GITHUB_REF']}
          (R/'source.json').write_text(json.dumps(record,indent=2)+'\n')
          assert mem['MemAvailable']>=14*1024**3
          PY
      - name: 正規npm ci（私有cache・明示env・process-local core対策）
        id: deps
        working-directory: frontend
        run: |
          set -euo pipefail
          printf '0\n' > /proc/self/coredump_filter
          ulimit -c 0
          node -e "if(require('fs').readFileSync('/proc/self/coredump_filter','utf8').trim()!=='00000000')process.exit(1)"
          set +e
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/joint-fe-b7e81c94/home" LANG=C.UTF-8 TZ=UTC CI=true HUSKY=0 NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/joint-fe-b7e81c94/empty-user-npmrc" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/joint-fe-b7e81c94/empty-global-npmrc" NPM_CONFIG_CACHE="$RUNNER_TEMP/joint-fe-b7e81c94/npm-cache" npm ci
          actual=$?
          set -e
          printf '{"actualExit":%s}\n' "$actual" > "$RUNNER_TEMP/joint-fe-b7e81c94/npm-ci-exit.json"
          exit "$actual"
      - name: 既存供給網gate（例外・閾値を変更しない）
        id: audit
        working-directory: frontend
        run: |
          set -euo pipefail
          printf '0\n' > /proc/self/coredump_filter
          ulimit -c 0
          node --test scripts/audit-with-exemption.test.mjs scripts/patch-nuxt-devtools-simple-git.test.mjs
          node scripts/audit-with-exemption.mjs
          npm run verify:ranch-development-appearances
      - name: 非秘密Node producer factsだけを観測するpreloadを用意
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/joint-fe-b7e81c94/node-facts"
          cat > "$RUNNER_TEMP/joint-fe-b7e81c94/node-observer.cjs" <<'JS'
          const fs = require('node:fs'), path = require('node:path'), v8 = require('node:v8');
          const { threadId, isMainThread } = require('node:worker_threads');
          const options = process.env.NODE_OPTIONS || '';
          const coreFilter = fs.readFileSync('/proc/self/coredump_filter','utf8').trim();
          const entry = process.argv[1] || '';
          const isNuxtEntry = /(?:nuxt|nuxi)(?:[\/]|\.m?js|$)|@nuxt[\/]cli/.test(entry);
          const row = { pid:process.pid, ppid:process.ppid, threadId, isMainThread, isNuxtEntry, nodeOptions:options, coreFilter, heapLimitBytes:v8.getHeapStatistics().heap_size_limit };
          if (isMainThread && isNuxtEntry && (!options.includes('--max-old-space-size=8192') || coreFilter !== '00000000')) throw new Error('NUXT_PRODUCER_INPUT_CHANGED');
          fs.writeFileSync(path.join(__dirname,'node-facts',`${process.pid}-${threadId}.json`),JSON.stringify(row),{flag:'wx',mode:0o600});
          JS
      - name: fresh資源確認後に通常production build
        id: build
        working-directory: frontend
        run: |
          set -euo pipefail
          printf '0\n' > /proc/self/coredump_filter
          ulimit -c 0
          node -e "if(require('fs').readFileSync('/proc/self/coredump_filter','utf8').trim()!=='00000000')process.exit(1)"
          python3 - <<'PY'
          import pathlib,os,json,shutil
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'joint-fe-b7e81c94'
          mem={k:int(v.split()[0])*1024 for k,v in (x.split(':',1) for x in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ['MemTotal','MemAvailable','SwapTotal','SwapFree']}
          mem.update(diskFreeBytes=shutil.disk_usage('.').free,coreFilter=pathlib.Path('/proc/self/coredump_filter').read_text().strip())
          (r/'prebuild-resources.json').write_text(json.dumps(mem,indent=2)+'\n')
          print(json.dumps({'prebuildResourceBytes':{k:v for k,v in mem.items() if type(v)is int}}),flush=True)
          assert mem['MemAvailable']>=14*1024**3
          PY
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/joint-fe-b7e81c94/build-time.txt" env -i PATH="$PATH" HOME="$RUNNER_TEMP/joint-fe-b7e81c94/home" LANG=C.UTF-8 TZ=UTC CI=true HUSKY=0 NODE_ENV=production NODE_OPTIONS="--max-old-space-size=8192 --require=$RUNNER_TEMP/joint-fe-b7e81c94/node-observer.cjs" NUXT_PUBLIC_API_BASE=http://localhost:8085 NUXT_INTERNAL_API_BASE=http://localhost:8085 NUXT_PUBLIC_BASE_URL=http://localhost:3005 NUXT_GENERATE_SPA=false npm run build
          actual=$?
          set -e
          printf '{"actualExit":%s}\n' "$actual" > "$RUNNER_TEMP/joint-fe-b7e81c94/build-exit.json"
          exit "$actual"
      - name: run default ranch production artifact gate
        id: production_gate
        working-directory: frontend
        run: |
          set -euo pipefail
          printf '0\n' > /proc/self/coredump_filter
          ulimit -c 0
          set +e
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/joint-fe-b7e81c94/home" LANG=C.UTF-8 TZ=UTC CI=true NODE_OPTIONS="--max-old-space-size=8192 --require=$RUNNER_TEMP/joint-fe-b7e81c94/node-observer.cjs" node scripts/verify-ranch-production-artifact.mjs
          actual=$?
          set -e
          printf '{"actualExit":%s}\n' "$actual" > "$RUNNER_TEMP/joint-fe-b7e81c94/ranch-production-exit.json"
          exit "$actual"
