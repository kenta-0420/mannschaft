name: heap-analysis-oneshot

on:
  push:
    branches: [ops/heap-analysis-3620]

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Show disk/mem before
        run: |
          df -h
          free -g

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download heap dump artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh api repos/${{ github.repository }}/actions/artifacts/11266068128/zip > dump.zip
          unzip -o dump.zip
          rm dump.zip
          ls -lh
          df -h

      - name: Download Eclipse MAT (standalone, Linux x86_64)
        run: |
          set -eux
          curl -L -o mat.zip "https://www.eclipse.org/downloads/download.php?file=/mat/1.17.0/rcp/MemoryAnalyzer-1.17.0.20260601-linux.gtk.x86_64.zip&r=1"
          mkdir -p mat
          unzip -q mat.zip -d mat
          rm mat.zip
          find mat -maxdepth 2
          MAT_DIR=$(find mat -maxdepth 2 -name MemoryAnalyzer.ini -printf '%h\n' | head -1)
          echo "MAT_DIR=$MAT_DIR" >> "$GITHUB_ENV"

      - name: Tune MAT heap size
        run: |
          set -eux
          free -g
          sed -i '/-Xmx/d' "$MAT_DIR/MemoryAnalyzer.ini"
          echo "-Xmx12g" >> "$MAT_DIR/MemoryAnalyzer.ini"
          cat "$MAT_DIR/MemoryAnalyzer.ini"
          chmod +x "$MAT_DIR/ParseHeapDump.sh" "$MAT_DIR/MemoryAnalyzer"

      - name: Run MAT parse (suspects/overview/top_components)
        run: |
          set -eux
          HPROF=$(find . -maxdepth 1 -name '*.hprof' | head -1)
          echo "HPROF=$HPROF"
          cd "$MAT_DIR"
          ./ParseHeapDump.sh "$GITHUB_WORKSPACE/$HPROF" \
            org.eclipse.mat.api:suspects \
            org.eclipse.mat.api:overview \
            org.eclipse.mat.api:top_components

      - name: Mockito InterceptedInvocation / WeakConcurrentMap OQL diagnostics
        run: |
          set -eux
          HPROF=$(find . -maxdepth 1 -name '*.hprof' | head -1)
          cd "$MAT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/oql"
          OUT="$GITHUB_WORKSPACE/oql"

          run_oql () {
            local label="$1" query="$2"
            echo "### $label" >> "$OUT/_log.txt"
            # Snapshot existing files (workspace root + MAT_DIR) so we can diff out whatever
            # ParseHeapDump.sh actually writes for this query -- it does NOT print results to
            # stdout, it drops a new file (zip or unzipped txt) next to the hprof or cwd.
            before=$(mktemp)
            find "$GITHUB_WORKSPACE" "$MAT_DIR" -maxdepth 1 -type f 2>/dev/null | sort > "$before"
            set +e
            ./ParseHeapDump.sh "$GITHUB_WORKSPACE/$HPROF" \
              "-command=oql \"$query\"" \
              org.eclipse.mat.api:query -format=txt -unzip \
              > "$OUT/${label}_stdout.txt" 2>> "$OUT/_log.txt"
            rc=$?
            set -e
            echo "  rc=$rc" >> "$OUT/_log.txt"
            after=$(mktemp)
            find "$GITHUB_WORKSPACE" "$MAT_DIR" -maxdepth 1 -type f 2>/dev/null | sort > "$after"
            new_files=$(comm -13 "$before" "$after")
            echo "  new_files: $new_files" >> "$OUT/_log.txt"
            n=0
            for nf in $new_files; do
              n=$((n+1))
              ext="${nf##*.}"
              if [ "$ext" = "zip" ]; then
                mkdir -p "$OUT/${label}_unzipped_$n"
                unzip -q -o "$nf" -d "$OUT/${label}_unzipped_$n" || true
                rm -f "$nf"
              else
                cp "$nf" "$OUT/${label}_result_$n.$ext" 2>/dev/null || true
                rm -f "$nf"
              fi
            done
            rm -f "$before" "$after"
          }

          # NOTE on round-3 fix: round 2's queries all failed with "yields null ... not supported
          # by classof" / "of object java.lang.Class [name=InterceptedInvocation]". Root cause:
          # "FROM OBJECTS <ClassName> <alias>" is NOT valid OQL for a concrete class -- "OBJECTS"
          # right after FROM is only for string/regex class-name patterns (see OQL doc: "FROM
          # OBJECTS \"java.lang\\.S.*\"") or for arbitrary object-id expressions (e.g.
          # "FROM OBJECTS inbounds(x)"). For a concrete class with an alias, FROM must be used
          # WITHOUT "OBJECTS": "FROM org.mockito.internal.invocation.InterceptedInvocation invocation".
          # This round drops the stray "OBJECTS" token from every per-instance query below.

          # 0) Field-name sanity check: dump classof+toString of the raw mockRef field itself
          #    (no deeper dotting) so the log shows whether "mockRef" resolves to a real object at
          #    all -- cheap signal for diagnosing v1 vs v2 below without risking fragile ${snapshot}
          #    escaping through yaml/bash/OQL quoting layers.
          run_oql "00_mockref_raw" \
            "SELECT DISTINCT toString(classof(invocation.mockRef)) AS mockRefType FROM org.mockito.internal.invocation.InterceptedInvocation invocation"
          run_oql "00_mockitomethod_raw" \
            "SELECT DISTINCT toString(classof(invocation.mockitoMethod)) AS mockitoMethodType FROM org.mockito.internal.invocation.InterceptedInvocation invocation"

          # 1) Distinct (mock type, method name) pairs -- "OBJECTS" dropped; mockRef is assumed to
          #    extend java.lang.ref.WeakReference directly (field "referent"), v2 keeps a fallback
          #    guess in case Mockito wraps it one level deeper.
          run_oql "01_distinct_pairs_v1" \
            "SELECT DISTINCT toString(classof(invocation.mockRef.referent)) AS mockType, toString(invocation.mockitoMethod.name) AS methodName FROM org.mockito.internal.invocation.InterceptedInvocation invocation"
          run_oql "01_distinct_pairs_v2" \
            "SELECT DISTINCT toString(classof(invocation.mockRef.reference.referent)) AS mockType, toString(invocation.mockitoMethod.method.name) AS methodName FROM org.mockito.internal.invocation.InterceptedInvocation invocation"

          # 2) Fallback: raw per-object dump of mock class + method (every InterceptedInvocation);
          #    aggregated locally with sort|uniq -c below instead of relying on OQL GROUP BY.
          run_oql "02_raw_pairs_v1" \
            "SELECT toString(classof(invocation.mockRef.referent)) AS mockType, toString(invocation.mockitoMethod.name) AS methodName FROM org.mockito.internal.invocation.InterceptedInvocation invocation"
          run_oql "02_raw_pairs_v2" \
            "SELECT toString(classof(invocation.mockRef.reference.referent)) AS mockType, toString(invocation.mockitoMethod.method.name) AS methodName FROM org.mockito.internal.invocation.InterceptedInvocation invocation"

          # 3) Per-mock invocation counts: mock address + type for every InterceptedInvocation,
          #    aggregated locally to get a top-N list of which individual mock instances hold the
          #    most history entries.
          run_oql "03_mock_per_invocation_v1" \
            "SELECT toHex(invocation.mockRef.referent.@objectAddress) AS mockAddr, toString(classof(invocation.mockRef.referent)) AS mockType FROM org.mockito.internal.invocation.InterceptedInvocation invocation"

          # 4) Who holds the WeakConcurrentMap -- 1-hop and 2-hop inbound references (owner chain)
          #    for every WeakConcurrentMap instance. inbounds(x) returns an int[] of object ids;
          #    "SELECT OBJECTS inbounds(x) AS y" resolves+flattens them into heap objects.
          run_oql "04_weakmap_inbound_1hop" \
            "SELECT toString(classof(y)) AS ownerType, toHex(y.@objectAddress) AS addr FROM OBJECTS ( SELECT OBJECTS inbounds(x) AS y FROM org.mockito.internal.util.concurrent.WeakConcurrentMap x )"
          run_oql "04_weakmap_inbound_2hop" \
            "SELECT toString(classof(z)) AS ownerType, toHex(z.@objectAddress) AS addr FROM OBJECTS ( SELECT OBJECTS inbounds(y) AS z FROM OBJECTS ( SELECT OBJECTS inbounds(x) AS y FROM org.mockito.internal.util.concurrent.WeakConcurrentMap x ) )"

          echo "---- oql dir (recursive) ----"
          find "$OUT" -type f | sort
          echo "---- sizes ----"
          find "$OUT" -type f -name '*.txt' -exec sh -c 'echo "{}: $(wc -l < "{}") lines"' \;

          # Local aggregation (best-effort): the query result lands as index.html (a <table> of rows),
          # not plain txt, under org.eclipse.mat.api:query -format=txt -unzip. Extract table cell text
          # per row with Python, then count identical rows with sort|uniq -c instead of OQL GROUP BY.
          python3 - "$OUT" <<'PYEOF'
          import sys, glob, re, html, os
          out = sys.argv[1]
          for prefix in ("02_raw_pairs_v1", "02_raw_pairs_v2", "03_mock_per_invocation_v1"):
              for idx in sorted(glob.glob(os.path.join(out, f"{prefix}_unzipped_*", "index.html"))):
                  with open(idx, encoding="utf-8", errors="ignore") as fh:
                      data = fh.read()
                  rows = re.findall(r"<tr[^>]*>(.*?)</tr>", data, re.S | re.I)
                  lines = []
                  for row in rows:
                      cells = re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", row, re.S | re.I)
                      if not cells:
                          continue
                      cleaned = [html.unescape(re.sub(r"<[^>]+>", "", c)).strip() for c in cells]
                      if any(cleaned):
                          lines.append("\t".join(cleaned))
                  outpath = os.path.join(out, f"{prefix}_extracted_rows.tsv")
                  with open(outpath, "w", encoding="utf-8") as fh:
                      fh.write("\n".join(lines))
                  print(f"{idx} -> {outpath} ({len(lines)} rows)")
          PYEOF

          for f in "$OUT"/02_raw_pairs_v1_extracted_rows.tsv "$OUT"/02_raw_pairs_v2_extracted_rows.tsv \
                   "$OUT"/03_mock_per_invocation_v1_extracted_rows.tsv; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              base=$(basename "$f" .tsv)
              echo "Aggregating $f -> ${base}_top40.txt"
              tail -n +2 "$f" | sort | uniq -c | sort -rn | head -40 > "$OUT/${base}_top40.txt" || true
            fi
          done
          echo "---- oql dir final ----"
          find "$OUT" -type f | sort

      - name: Collect reports (zips only, unpack, drop huge indexes)
        run: |
          set -eux
          mkdir -p report
          # Only the 3 result zips -- do NOT sweep in *.index / .threads (multi-GB MAT working files)
          for z in java_pid2912_Leak_Suspects.zip java_pid2912_System_Overview.zip java_pid2912_Top_Components.zip; do
            if [ -f "$z" ]; then
              mkdir -p "report/${z%.zip}"
              unzip -q "$z" -d "report/${z%.zip}"
            fi
          done
          du -sh report
          find report -type f | sort

      - name: Extract text summaries from report HTML
        run: |
          set -eux
          python3 - <<'PYEOF'
          import glob, re, html

          def extract_text(path, limit=12000):
              with open(path, encoding='utf-8', errors='ignore') as f:
                  data = f.read()
              text = re.sub(r'<(script|style)[^>]*>.*?</\1>', '', data, flags=re.S | re.I)
              text = re.sub(r'<[^>]+>', ' ', text)
              text = html.unescape(text)
              text = re.sub(r'[ \t]+', ' ', text)
              text = re.sub(r'\n\s*\n+', '\n', text)
              return text.strip()[:limit]

          files = sorted(glob.glob('report/**/*.html', recursive=True))
          print(f"Found {len(files)} html files")
          for fp in files:
              print(f"\n===== {fp} =====")
              print(extract_text(fp))
          PYEOF

      - name: Remove huge MAT working files before upload (safety net)
        run: |
          set -eux
          rm -f ./*.hprof ./*.index ./*.threads
          du -sh report || true
          du -sh oql || true

      - name: Show disk/mem after
        if: always()
        run: |
          df -h
          free -g

      - name: Upload MAT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mat-report-3620-shard-5
          path: report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Mockito OQL diagnostics (text/csv only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mat-mockito-3620
          path: oql/
          retention-days: 7
          if-no-files-found: warn
