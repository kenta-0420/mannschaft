name: heap-analysis-oneshot

on:
  push:
    branches: [ops/heap-analysis-3620]

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Show disk/mem before
        run: |
          df -h
          free -g

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download heap dump artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh api repos/${{ github.repository }}/actions/artifacts/11266068128/zip > dump.zip
          unzip -o dump.zip
          rm dump.zip
          ls -lh
          df -h

      - name: Download Eclipse MAT (standalone, Linux x86_64)
        run: |
          set -eux
          curl -L -o mat.zip "https://www.eclipse.org/downloads/download.php?file=/mat/1.17.0/rcp/MemoryAnalyzer-1.17.0.20260601-linux.gtk.x86_64.zip&r=1"
          mkdir -p mat
          unzip -q mat.zip -d mat
          rm mat.zip
          find mat -maxdepth 2
          MAT_DIR=$(find mat -maxdepth 2 -name MemoryAnalyzer.ini -printf '%h\n' | head -1)
          echo "MAT_DIR=$MAT_DIR" >> "$GITHUB_ENV"

      - name: Tune MAT heap size
        run: |
          set -eux
          free -g
          sed -i '/-Xmx/d' "$MAT_DIR/MemoryAnalyzer.ini"
          echo "-Xmx12g" >> "$MAT_DIR/MemoryAnalyzer.ini"
          cat "$MAT_DIR/MemoryAnalyzer.ini"
          chmod +x "$MAT_DIR/ParseHeapDump.sh" "$MAT_DIR/MemoryAnalyzer"

      - name: Run MAT parse (suspects/overview/top_components)
        run: |
          set -eux
          HPROF=$(find . -maxdepth 1 -name '*.hprof' | head -1)
          echo "HPROF=$HPROF"
          cd "$MAT_DIR"
          ./ParseHeapDump.sh "$GITHUB_WORKSPACE/$HPROF" \
            org.eclipse.mat.api:suspects \
            org.eclipse.mat.api:overview \
            org.eclipse.mat.api:top_components

      - name: Mockito InterceptedInvocation / WeakConcurrentMap OQL diagnostics
        run: |
          set -eux
          HPROF=$(find . -maxdepth 1 -name '*.hprof' | head -1)
          cd "$MAT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/oql"
          OUT="$GITHUB_WORKSPACE/oql"

          run_oql () {
            local label="$1" query="$2"
            echo "### $label" >> "$OUT/_log.txt"
            set +e
            ./ParseHeapDump.sh "$GITHUB_WORKSPACE/$HPROF" \
              "-command=oql \"$query\"" \
              org.eclipse.mat.api:query -format=txt -unzip \
              > "$OUT/${label}.txt" 2>> "$OUT/_log.txt"
            rc=$?
            set -e
            echo "  rc=$rc" >> "$OUT/_log.txt"
            # ParseHeapDump names the txt report after the java proc; normalize if a differently-named file appeared
            find "$GITHUB_WORKSPACE" -maxdepth 1 -newer "$OUT/_log.txt" -name '*Query*.txt' -exec cp {} "$OUT/${label}_alt.txt" \; 2>/dev/null || true
          }

          # 0) Field discovery: dump raw structure of one instance of each class we care about.
          run_oql "00_sample_invocation" \
            "SELECT * FROM org.mockito.internal.invocation.InterceptedInvocation LIMIT 1"
          run_oql "00_sample_weakmap" \
            "SELECT * FROM org.mockito.internal.util.concurrent.WeakConcurrentMap LIMIT 1"

          # 1) Distinct (mock type, method name) pairs -- try two plausible field layouts.
          run_oql "01_distinct_pairs_v1" \
            "SELECT DISTINCT toString(classof(invocation.mockRef.referent)) AS mockType, toString(invocation.mockitoMethod.name) AS methodName FROM OBJECTS org.mockito.internal.invocation.InterceptedInvocation invocation"
          run_oql "01_distinct_pairs_v2" \
            "SELECT DISTINCT toString(classof(invocation.mockRef.reference.referent)) AS mockType, toString(invocation.mockitoMethod.method.name) AS methodName FROM OBJECTS org.mockito.internal.invocation.InterceptedInvocation invocation"

          # 2) Fallback: raw per-object dump of mock class + method (capped) in case GROUP BY-by-hand above fails;
          #    this still lets us aggregate counts locally with awk/sort on the runner before upload.
          run_oql "02_raw_pairs_v1" \
            "SELECT toString(classof(invocation.mockRef.referent)) AS mockType, toString(invocation.mockitoMethod.name) AS methodName FROM OBJECTS org.mockito.internal.invocation.InterceptedInvocation invocation"
          run_oql "02_raw_pairs_v2" \
            "SELECT toString(classof(invocation.mockRef.reference.referent)) AS mockType, toString(invocation.mockitoMethod.method.name) AS methodName FROM OBJECTS org.mockito.internal.invocation.InterceptedInvocation invocation"

          # 3) Per-mock invocation counts: list every WeakConcurrentMap/InlineByteBuddyMockMaker-registered mock
          #    together with how many InterceptedInvocation history entries exist for it (raw rows, aggregated later).
          run_oql "03_mock_per_invocation_v1" \
            "SELECT toHex(objectid(invocation.mockRef.referent)) AS mockAddr, toString(classof(invocation.mockRef.referent)) AS mockType FROM OBJECTS org.mockito.internal.invocation.InterceptedInvocation invocation"

          # 4) Who holds the WeakConcurrentMap -- immediate inbound references (owner chain, 1 hop) for the single
          #    WeakConcurrentMap instance, and 1-hop inbound of its backing ConcurrentHashMap.
          run_oql "04_weakmap_inbound" \
            "SELECT toHex(objectid(x)) AS addr, toString(classof(x)) AS ownerType FROM INBOUNDS org.mockito.internal.util.concurrent.WeakConcurrentMap x"

          echo "---- oql dir ----"
          ls -la "$OUT"

          # Local aggregation (best-effort): turn raw pair dumps into top-30 counts without relying on OQL GROUP BY.
          for f in "$OUT"/02_raw_pairs_v1.txt "$OUT"/02_raw_pairs_v2.txt "$OUT"/03_mock_per_invocation_v1.txt; do
            if [ -s "$f" ]; then
              base=$(basename "$f" .txt)
              echo "Aggregating $f -> ${base}_top30.txt"
              # Each data row is typically tab/pipe/space separated "col1 col2"; count identical full lines after the header.
              tail -n +2 "$f" | sort | uniq -c | sort -rn | head -40 > "$OUT/${base}_top30.txt" || true
            fi
          done
          ls -la "$OUT"

      - name: Collect reports (zips only, unpack, drop huge indexes)
        run: |
          set -eux
          mkdir -p report
          # Only the 3 result zips -- do NOT sweep in *.index / .threads (multi-GB MAT working files)
          for z in java_pid2912_Leak_Suspects.zip java_pid2912_System_Overview.zip java_pid2912_Top_Components.zip; do
            if [ -f "$z" ]; then
              mkdir -p "report/${z%.zip}"
              unzip -q "$z" -d "report/${z%.zip}"
            fi
          done
          du -sh report
          find report -type f | sort

      - name: Extract text summaries from report HTML
        run: |
          set -eux
          python3 - <<'PYEOF'
          import glob, re, html

          def extract_text(path, limit=12000):
              with open(path, encoding='utf-8', errors='ignore') as f:
                  data = f.read()
              text = re.sub(r'<(script|style)[^>]*>.*?</\1>', '', data, flags=re.S | re.I)
              text = re.sub(r'<[^>]+>', ' ', text)
              text = html.unescape(text)
              text = re.sub(r'[ \t]+', ' ', text)
              text = re.sub(r'\n\s*\n+', '\n', text)
              return text.strip()[:limit]

          files = sorted(glob.glob('report/**/*.html', recursive=True))
          print(f"Found {len(files)} html files")
          for fp in files:
              print(f"\n===== {fp} =====")
              print(extract_text(fp))
          PYEOF

      - name: Remove huge MAT working files before upload (safety net)
        run: |
          set -eux
          rm -f ./*.hprof ./*.index ./*.threads
          du -sh report || true
          du -sh oql || true

      - name: Show disk/mem after
        if: always()
        run: |
          df -h
          free -g

      - name: Upload MAT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mat-report-3620-shard-5
          path: report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Mockito OQL diagnostics (text/csv only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mat-mockito-3620
          path: oql/
          retention-days: 7
          if-no-files-found: warn
