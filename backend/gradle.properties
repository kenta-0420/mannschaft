# Gradle ビルドキャッシュを有効化（CI・ローカル両方）
org.gradle.caching=true

# Gradle デーモンを有効化（ローカル開発の高速化）
# CI は --no-daemon で明示的に無効化するため、ここでの設定はローカル向け
org.gradle.daemon=true

# 並列ビルドを有効化（モジュールが複数ある場合に効果）
# 現在はシングルモジュール構成のため効果は限定的だが、将来のマルチプロジェクト化に備えて有効化
org.gradle.parallel=true

# JVM メモリ設定
# - Xmx2g: build/compileJava 用。テスト JVM は tasks.withType<Test>.maxHeapSize = "4g" で別途設定済
# - G1GC: 長時間ビルドでの GC 停止を最小化
# - HeapDumpOnOutOfMemoryError: OOM 調査用ダンプを残す
# - Dfile.encoding=UTF-8: Javadoc 内の日本語文字（全角句点等）を正しく処理するため UTF-8 を明示
# - CI の ubuntu-latest は 7GB RAM。ローカル Windows でも十分なメモリを前提
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Windowsで日本語ユーザー名がGradle argfileのエンコーディング問題を引き起こすため、
# gradlew スクリプト内で GRADLE_USER_HOME=C:/gradle-home を自動設定する

# デーモンのアイドルタイムアウトを既定3時間から15分に短縮
# 放置された Gradle デーモンがメモリを長時間占有し続けるのを防ぐ（ローカル開発向け。CI は --no-daemon のため無関係）
org.gradle.daemon.idletimeout=900000

# 注意: org.gradle.workers.max はここに追加しない
# CI（backend-ci.yml）の2coreランナーと本ファイルを共用しているため、ローカル向けに値を固定すると
# CI のワーカー数まで変えてしまう。ローカルで並列度を絞りたい場合は
# ./gradlew build -Dorg.gradle.workers.max=N のようにコマンドライン引数で都度指定すること
