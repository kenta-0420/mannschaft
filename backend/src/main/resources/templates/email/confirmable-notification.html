<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${subject}">確認が必要なお知らせ</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:40px 0;">
        <table width="600" cellpadding="0" cellspacing="0" border="0"
               style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- ヘッダー -->
          <tr>
            <td style="background-color:#1a56db;padding:24px 40px;">
              <span style="color:#ffffff;font-size:22px;font-weight:bold;letter-spacing:0.5px;">Mannschaft</span>
            </td>
          </tr>

          <!-- 本文 -->
          <tr>
            <td style="padding:40px 40px 20px;">
              <h1 style="margin:0 0 16px;font-size:20px;color:#111827;" th:text="${subject}">確認が必要なお知らせ</h1>
              <p style="margin:0 0 12px;font-size:15px;color:#374151;line-height:1.6;" th:text="${bodyMessage}">
                以下の件についてご確認をお願いします。
              </p>

              <!-- 通知タイトル -->
              <div th:if="${notificationTitle != null}"
                   style="margin:20px 0;padding:16px 20px;background-color:#f9fafb;border-left:4px solid #1a56db;border-radius:4px;">
                <p style="margin:0;font-size:15px;font-weight:600;color:#111827;" th:text="${notificationTitle}">通知タイトル</p>
                <p th:if="${notificationBody != null}"
                   style="margin:8px 0 0;font-size:14px;color:#6b7280;line-height:1.6;"
                   th:text="${notificationBody}">通知本文</p>
              </div>
            </td>
          </tr>

          <!-- CTAボタン -->
          <tr>
            <td style="padding:20px 40px 16px;text-align:center;">
              <a th:href="${confirmUrl}"
                 style="display:inline-block;padding:14px 36px;background-color:#1a56db;color:#ffffff;
                        font-size:16px;font-weight:600;text-decoration:none;border-radius:6px;
                        letter-spacing:0.3px;">
                <span th:text="${buttonLabel}">確認する</span>
              </a>
            </td>
          </tr>

          <!-- 有効期限の注記 -->
          <tr>
            <td style="padding:8px 40px 20px;text-align:center;">
              <p style="margin:0;font-size:13px;color:#9ca3af;" th:text="${expiryMessage}">
                このリンクは有効期限があります。
              </p>
            </td>
          </tr>

          <!-- 区切り -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #e5e7eb;margin:0;" />
            </td>
          </tr>

          <!-- 免責文 + フッター -->
          <tr>
            <td style="padding:20px 40px 32px;">
              <p style="margin:0 0 8px;font-size:12px;color:#9ca3af;" th:text="${ignoreMessage}">
                このメールに心当たりがない場合は無視してください。
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;" th:text="${footerMessage}">
                このメールはMannschaftから自動送信されています。
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
