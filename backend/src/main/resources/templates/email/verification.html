<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{email.verification.subject}">メールアドレスの確認</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
          <!-- ヘッダー -->
          <tr>
            <td style="background-color:#1a56db;padding:24px 32px;">
              <h1 style="margin:0;color:#ffffff;font-size:22px;font-weight:bold;">Mannschaft</h1>
            </td>
          </tr>
          <!-- 本文 -->
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px;font-size:16px;color:#333333;" th:text="#{email.verification.greeting(${displayName})}">
                こんにちは
              </p>
              <p style="margin:0 0 24px;font-size:15px;color:#555555;line-height:1.6;" th:text="#{email.verification.body}">
                Mannschaftへの登録ありがとうございます。
              </p>
              <!-- ボタン -->
              <table cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                <tr>
                  <td style="background-color:#1a56db;border-radius:6px;">
                    <a th:href="${verifyUrl}" href="#"
                       style="display:inline-block;padding:14px 28px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;"
                       th:text="#{email.verification.button}">
                      メールアドレスを確認する
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 8px;font-size:13px;color:#888888;" th:text="#{email.verification.expiry}">
                このリンクは24時間有効です。
              </p>
              <p style="margin:0;font-size:13px;color:#888888;" th:text="#{email.verification.ignore}">
                このメールに心当たりがない場合は無視してください。
              </p>
            </td>
          </tr>
          <!-- フッター -->
          <tr>
            <td style="background-color:#f9f9f9;padding:16px 32px;border-top:1px solid #eeeeee;">
              <p style="margin:0;font-size:12px;color:#aaaaaa;text-align:center;" th:text="#{email.common.footer}">
                このメールはMannschaftから自動送信されています。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
