<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="css/pdf-common.css"/>
    <style>
        .entry-header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        .entry-header-table td {
            padding: 4px 8px;
            border: none;
        }
        .entry-header-label {
            font-weight: bold;
            width: 100px;
        }
        .entry-count-badge {
            font-size: 14pt;
            font-weight: bold;
        }
    </style>
</head>
<body class="font-serif">
    <div class="pdf-header">
        <h1>大会エントリー表</h1>
    </div>

    <div class="pdf-body">
        <!-- 基本情報 -->
        <table class="entry-header-table no-border">
            <tr>
                <td class="entry-header-label">大会名</td>
                <td th:text="${tournamentName}">大会名</td>
                <td style="text-align: right;">
                    出力日: <span th:text="${#temporals.format(outputDate, 'yyyy年MM月dd日')}">2026年05月12日</span>
                </td>
            </tr>
            <tr>
                <td class="entry-header-label">ディビジョン</td>
                <td th:text="${divisionName}">ディビジョン名</td>
            </tr>
            <tr>
                <td class="entry-header-label">チーム名</td>
                <td th:text="${teamDisplayName}">チーム名</td>
            </tr>
        </table>

        <hr style="margin: 10px 0;"/>

        <!-- エントリーメンバーテーブル -->
        <div th:if="${not #lists.isEmpty(entryMembers)}">
            <table>
                <thead>
                    <tr>
                        <th style="width: 8%;">No.</th>
                        <th style="width: 30%;">氏名</th>
                        <th style="width: 10%;">背番号</th>
                        <th style="width: 20%;">ポジション</th>
                        <th style="width: 32%;">備考</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="member, stat : ${entryMembers}">
                        <td th:text="${stat.count}" style="text-align: center;">1</td>
                        <td th:text="${member.displayName}">氏名</td>
                        <td th:text="${member.jerseyNumber}" style="text-align: center;">10</td>
                        <td th:text="${member.position}">FW</td>
                        <td th:text="${member.notes}">備考</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- エントリーなし -->
        <div th:if="${#lists.isEmpty(entryMembers)}">
            <p style="text-align: center; color: #666;">エントリーされたメンバーはいません。</p>
        </div>
    </div>

    <!-- フッター -->
    <div class="pdf-footer">
        <span>合計人数: </span>
        <span class="entry-count-badge" th:text="${totalCount}">0</span>
        <span> 名</span>
    </div>
</body>
</html>
