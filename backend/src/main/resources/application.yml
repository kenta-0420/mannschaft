spring:
  application:
    name: mannschaft

  # デフォルトプロファイル（明示指定がない場合は local）
  profiles:
    default: local

  # Virtual Threads（Java 21）
  threads:
    virtual:
      enabled: true

  # JPA / Hibernate（共通設定。環境依存は各プロファイルで上書き）
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

  # Jackson — ISO 8601 文字列で出力（.claudecode.md §20）
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # i18n メッセージソース（F11.3）
  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false

# Server
server:
  port: 8080

# JWT（アプリ固有設定。本番は環境変数で上書き）
mannschaft:
  jwt:
    secret: ${MANNSCHAFT_JWT_SECRET:dev-secret-key-change-in-production-minimum-256-bits-long}
    access-token-expiration: ${MANNSCHAFT_JWT_ACCESS_EXPIRATION:900}
    refresh-token-expiration: ${MANNSCHAFT_JWT_REFRESH_EXPIRATION:604800}
  encryption:
    key: ${MANNSCHAFT_ENCRYPTION_KEY:}
    hmac-key: ${MANNSCHAFT_HMAC_KEY:}
  storage:
    bucket: ${MANNSCHAFT_R2_BUCKET:mannschaft-storage}
    endpoint: ${MANNSCHAFT_R2_ENDPOINT:}        # https://{accountId}.r2.cloudflarestorage.com
    access-key: ${MANNSCHAFT_R2_ACCESS_KEY:}
    secret-key: ${MANNSCHAFT_R2_SECRET_KEY:}
    presigned-upload-ttl: ${MANNSCHAFT_R2_UPLOAD_TTL:600}
    presigned-download-ttl: ${MANNSCHAFT_R2_DOWNLOAD_TTL:3600}
  cdn:
    workers-domain: ${MANNSCHAFT_CDN_WORKERS_DOMAIN:}  # 例: cdn.example.workers.dev
    enabled: ${MANNSCHAFT_CDN_ENABLED:false}
  ses:
    region: ${MANNSCHAFT_SES_REGION:ap-northeast-1}
    endpoint: ${MANNSCHAFT_SES_ENDPOINT:}
  webauthn:
    origin: ${MANNSCHAFT_WEBAUTHN_ORIGIN:https://mannschaft.app}
  google:
    client-id: ${MANNSCHAFT_GOOGLE_CLIENT_ID:}
    client-secret: ${MANNSCHAFT_GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    revoke-uri: https://oauth2.googleapis.com/revoke
    calendar-api-base: https://www.googleapis.com/calendar/v3
    userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
    redirect-uri: ${MANNSCHAFT_GOOGLE_REDIRECT_URI:https://app.mannschaft.com/auth/oauth/callback/google}
    places-api-key: ${MANNSCHAFT_GOOGLE_PLACES_API_KEY:}
    places-api-base: https://places.googleapis.com/v1
  line:
    client-id: ${MANNSCHAFT_LINE_CLIENT_ID:}
    client-secret: ${MANNSCHAFT_LINE_CLIENT_SECRET:}
    token-uri: https://api.line.me/oauth2/v2.1/token
    profile-uri: https://api.line.me/v2/profile
    redirect-uri: ${MANNSCHAFT_LINE_REDIRECT_URI:https://app.mannschaft.com/auth/oauth/callback/line}
  apple:
    client-id: ${MANNSCHAFT_APPLE_CLIENT_ID:}
    client-secret: ${MANNSCHAFT_APPLE_CLIENT_SECRET:}
    token-uri: https://appleid.apple.com/auth/token
    redirect-uri: ${MANNSCHAFT_APPLE_REDIRECT_URI:https://app.mannschaft.com/auth/oauth/callback/apple}
  stripe:
    secret-key: ${MANNSCHAFT_STRIPE_SECRET_KEY:}
    connect:
      return-url: ${MANNSCHAFT_STRIPE_CONNECT_RETURN_URL:https://app.mannschaft.com/settings/stripe/return}
      refresh-url: ${MANNSCHAFT_STRIPE_CONNECT_REFRESH_URL:https://app.mannschaft.com/settings/stripe/refresh}
  # F13.1 Phase 13.1.2: QR チェックイン／アウト トークン署名設定（設計書 §2.3.1 / §10.10）
  # 本番は JOB_QR_SIGNING_SECRET を必ず設定（256bit 以上）。未設定だと起動失敗。
  jobs:
    qr:
      ttl-seconds: 60
      ttl-seconds-max: 300
      rotation-advance-seconds: 5
      short-code-length: 6
      signing-keys:
        - kid: ${JOB_QR_SIGNING_KID:v1}
          secret: ${JOB_QR_SIGNING_SECRET:}
          active: true

# F10.5 Phase 10-α: Spring Boot Actuator + Micrometer 計測軸の整備
# - 共通プロファイルでは健診系 + メトリクス系を広めに公開する
# - prod では application-prod.yml で `health` のみに絞り、内部 NW 経由で別途有効化する運用
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,threaddump,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: mannschaft
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 100ms,500ms,1s,2s
  # F10.5 Phase 10-α 検分指摘 ④ 根治: PrometheusMeterRegistry の登録を全環境で明示する。
  # 既定で true だが Spring Boot バージョン違いの auto-config 挙動に依存しないよう明示化。
  # ※ registry を有効にしても endpoint 公開は management.endpoints.web.exposure.include で
  #   別途制御する（prod では `health` のみに絞る運用を維持）。
  prometheus:
    metrics:
      export:
        enabled: true

# 備品ランキング集計バッチ設定（F09.12）
equipment:
  ranking:
    cron: "0 0 3 * * *"
    min-team-count: 5
    score-weight-team: 3.0
    score-weight-consume: 1.0
    top-n-per-category: 20

# F08.7 シフト予算機能フィーチャーフラグ (Phase 9-α / 9-δ / 10-β)
# default false（本番含むすべての環境で OFF）。
# 有効化したい環境では application-{profile}.yml で feature.shift-budget.enabled=true を設定。
# 設計書 §13: 三値論理（グローバル × 組織別）は Phase 9-δ で完成済。
# monthly-close-cron-enabled: 月次締めバッチの自動起動有無 (Phase 9-δ / 御裁可 Q4)。
#   デフォルト false。手動 API #11 でのみ運用したい環境では false 維持。
# retry-batch-enabled: 失敗イベントリトライバッチ (Phase 10-β) の自動起動有無。
#   デフォルト false。15分毎に PENDING/RETRYING を再実行。3回失敗で EXHAUSTED 化。
feature:
  shift-budget:
    enabled: false
    monthly-close-cron-enabled: false
    retry-batch-enabled: false
  # F00 Phase D-γ/D-δ: Visibility Resolver 段階展開フラグ
  # false = 無効（Bean 未登録、ContentVisibilityChecker は fail-closed で処理）
  # true  = 有効（各 Resolver が登録され可視性評価が機能する）
  # 有効化したい環境では application-{profile}.yml で true を設定すること。
  visibility-resolver:
    team: true   # F00 Phase E-6: ContentVisibilityChecker 経由化で有効化
    organization: true   # F00 Phase E-7: ContentVisibilityChecker 経由化で有効化
  # F00.5 メンバーシップ基盤再設計
  # dualWrite.enabled: Phase 4 完了で false に変更済み（二重書き込みコード自体は Phase 4 で物理削除）
  # shadowComparison.enabled: GET /teams/{id}/members の旧実装と新実装を Shadow 比較する
  #   default false。Phase 2 リリース後、Staging で true に切り替えて diff 観測する
  # 設計書: docs/features/F00.5_membership_basis.md §13.4 / §14.6
  f005:
    dualWrite:
      enabled: false   # Phase 4 完了
    shadowComparison:
      enabled: false

# F03.12 ケア対象者2段階不在アラートバッチ設定
care:
  absent-alert:
    enabled: true
  # F03.12 §16 イベント終了後解散通知リマインドバッチ設定
  dismissal-reminder:
    enabled: true

# F12.5 Phase 2-C/D エラーレポート AI 分析 / GitHub 連携設定
# 設計書: docs/features/F12.5_frontend_error_tracking.md §12-§13
mannschaft.error-report:
  ai:
    enabled: ${ERROR_REPORT_AI_ENABLED:true}
    model: ${ERROR_REPORT_AI_MODEL:claude-haiku-4-5}
    max-tokens: 1500
    temperature: 0.2
    monthly-budget-jpy: ${ERROR_REPORT_AI_BUDGET_JPY:5000}
    auto-batch-delay-minutes: 30
  github:
    # GH_TOKEN / GH_OWNER / GH_REPO は環境変数から直接 @Value で注入される
    enabled: ${ERROR_REPORT_GITHUB_ENABLED:false}

# F12.5 Phase 2-D — GitHub Issue 本文の「内部管理画面」リンクの基底 URL
mannschaft.app-base-url: ${APP_BASE_URL:http://localhost:3000}

# F10.5 Phase 10-β — パフォーマンス監視のアラート閾値
# 設計書: docs/features/F10.5_performance_monitoring.md §5.2.3
# - request.error-ms 超過時に RequestLoggingFilter から
#   ErrorReportNotifier.notifySlowRequest + ErrorReportService.recordBackendException(HIGH) を呼ぶ
# - slow-query / cache-hit-rate は Phase 10-β 段階では値の保持のみ（集計バッチは Phase 10-γ）
mannschaft.performance-monitoring:
  request:
    warn-ms: ${MANNSCHAFT_PERF_REQUEST_WARN_MS:2000}
    error-ms: ${MANNSCHAFT_PERF_REQUEST_ERROR_MS:10000}
  slow-query:
    warn-per-minute: ${MANNSCHAFT_PERF_SLOW_QUERY_WARN_PER_MIN:5}
    error-per-minute: ${MANNSCHAFT_PERF_SLOW_QUERY_ERROR_PER_MIN:30}
  cache-hit-rate:
    warn-threshold: ${MANNSCHAFT_PERF_CACHE_HIT_WARN:0.80}
    error-threshold: ${MANNSCHAFT_PERF_CACHE_HIT_ERROR:0.50}

# F10.5 Phase 10-β-2 / F10.6 §5.4 / §5.6 — エラー監視のヘルスポーリングと集約バッファ
# 設計書: docs/features/F10.5_performance_monitoring.md §5.4 / docs/features/F10.6_error_monitoring.md §5.4 / §5.6
# - aggregation: 同一 error_hash の 2 通目以降を 5 分間蓄積し、まとめて 1 通の Slack サマリで送信する
# - aggregation.max-occurrences-per-hash: 1 entry あたりの上限（OOM 防止、殿様御裁可で 100）
# - health-polling: Spring Boot Actuator HealthEndpoint を 30 秒毎にポーリングし、UP→DOWN 遷移を検知して通知
mannschaft.error-monitoring:
  aggregation:
    enabled: ${MANNSCHAFT_ERROR_AGG_ENABLED:true}
    flush-interval-ms: ${MANNSCHAFT_ERROR_AGG_FLUSH_MS:300000}
    max-occurrences-per-hash: ${MANNSCHAFT_ERROR_AGG_MAX_PER_HASH:100}
  health-polling:
    enabled: ${MANNSCHAFT_HEALTH_POLL_ENABLED:true}
    interval-ms: ${MANNSCHAFT_HEALTH_POLL_INTERVAL_MS:30000}

# F10.6 Phase 10-γ-③-a — システムログ（スロークエリ・SSR エラー）R2 保存設定
# - slow-query-log-path: Spring Boot コンテナからスロークエリログを読むパス
# - slow-query-cron: スロークエリログアップロードバッチの cron スケジュール（デフォルト: 毎日 1:00 AM）
# - ssr-flush-interval-ms: SSR エラーバッファのフラッシュ間隔（デフォルト: 5 分）
# - internal-token: /api/internal/ssr-logs エンドポイントの内部認証トークン（本番は必ず変更）
mannschaft.system-log:
  slow-query-log-path: ${SLOW_QUERY_LOG_PATH:./logs/mysql-slow/mannschaft-slow.log}
  slow-query-cron: "0 0 1 * * *"
  ssr-flush-interval-ms: 300000
  internal-token: ${INTERNAL_LOG_TOKEN:dev-internal-token}

# Phase 4-D — リードレプリカ自動ルーティング設定
# app.datasource.replica.enabled=true のとき DataSourceConfig が有効化される。
# デフォルト false のため既存テストへの影響はゼロ。
# 本番でリードレプリカを有効化する場合は環境変数 DB_REPLICA_URL / DB_REPLICA_USER / DB_REPLICA_PASSWORD を設定し、
# application-prod.yml（または環境変数）で app.datasource.replica.enabled=true に変更すること。
app:
  datasource:
    replica:
      enabled: false
      # jdbc-url: ${DB_REPLICA_URL:${spring.datasource.url}}
      # username: ${DB_REPLICA_USER:${spring.datasource.username}}
      # password: ${DB_REPLICA_PASSWORD:${spring.datasource.password}}
  archive:
    db:
      enabled: false  # 本番で ARCHIVE_DB_URL 設定時に true にする
      # jdbc-url: ${ARCHIVE_DB_URL:}
      # username: ${ARCHIVE_DB_USER:}
      # password: ${ARCHIVE_DB_PASSWORD:}
      # hikari:
      #   maximum-pool-size: 5
      #   read-only: true

# F10.6 Phase 10-γ-② — MySQL DB サイズ監視設定
# 設計書: docs/features/F10.6_error_monitoring.md §5.7
# - MySQL データディレクトリは Docker 名前付きボリューム (mysql-data) でマウントされており
#   ホスト側から java.io.File で参照できないため、JDBC 経由で information_schema から
#   DB データサイズを取得する方式（方式 B）を採用する
# - max-gb: MySQL DB の上限容量 (GB)。環境変数 MYSQL_MAX_SIZE_GB で上書き可能
# - warn-threshold: 使用率がこの値以上で Health.unknown() (WARN) を返す
# - error-threshold: 使用率がこの値以上で Health.down() (CRITICAL) を返す
# - HealthStatusListener が 30 秒毎にポーリングし DOWN 遷移を Slack 通知する（追加設定不要）
mannschaft.disk-monitor:
  max-gb: ${MYSQL_MAX_SIZE_GB:10.0}
  warn-threshold: 0.75
  error-threshold: 0.90

# F02.10 個人ダッシュボード天気ウィジェット — WeatherAPI.com クライアント設定
# 設計書: docs/features/F02.10_weather_widget.md §3 / §7.3 / §7.3.1 / §8
# - base-url は SSRF 対策のためここで固定値として記述する（環境変数で上書きしない）
# - api-key は環境変数 WEATHER_API_KEY から注入する（リポジトリにコミットしない）
# - timeout-ms は WeatherAPI.com 応答タイムアウト（既定 3 秒、超過時はリトライ対象）
# - cache-ttl-seconds は通常 TTL（1 時間）、stale-ttl-seconds は障害時延命 TTL（6 時間）
weather:
  api:
    base-url: https://api.weatherapi.com/v1
    api-key: ${WEATHER_API_KEY:}
    timeout-ms: 3000
    cache-ttl-seconds: 3600
    stale-ttl-seconds: 21600
