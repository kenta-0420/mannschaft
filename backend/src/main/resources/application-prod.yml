# 本番用プロファイル
# 全て環境変数から注入（デフォルト値なし = 未設定時は起動失敗）
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      # WebSocket 外部ブローカー化（Valkey Pub/Sub relay）§8.6: ElastiCache の転送時暗号化
      # （transit_encryption_enabled = true・infra/terraform/modules/data/main.tf）に追随。
      # 本番は terraform 側で SPRING_REDIS_SSL_ENABLED=true を注入する
      # （infra/terraform/modules/app/main.tf）。ローカル/開発（application.yml）は
      # 未設定のまま既定 false を維持し、TLS 無し Valkey（docker-compose）を使い続ける。
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:false}

  jpa:
    show-sql: false

  # F09.6 Phase 8a: 本番は SES 通知 SQS リスナーを有効化する。
  # SES_NOTIFICATION_QUEUE_NAME（terraform 出力のキュー名）も併せて注入すること。
  # IAM はタスクロール（mannschaft-prod-task）に ReceiveMessage/DeleteMessage/GetQueueAttributes を付与済み。
  cloud:
    aws:
      sqs:
        enabled: ${MANNSCHAFT_SQS_ENABLED:true}

# F08.7 Phase 9-α / 9-δ: 本番環境はデフォルト無効（明示的に false 維持）。
# 組織毎オプトインは三値論理 (budget_configs.shift_budget_enabled) で Phase 9-δ から有効化可能。
# monthly-close-cron-enabled: 月次締めバッチの cron 自動起動は本番でも OFF（運用側で
#   FEATURE_SHIFT_BUDGET_MONTHLY_CRON_ENABLED=true を明示設定したときのみ有効化）
feature:
  shift-budget:
    enabled: ${FEATURE_SHIFT_BUDGET_ENABLED:false}
    monthly-close-cron-enabled: ${FEATURE_SHIFT_BUDGET_MONTHLY_CRON_ENABLED:false}

app:
  # 本番環境では APP_BASE_URL を必ず設定すること（デフォルト値なし = 未設定時は起動失敗）。
  # 例: https://app.mannschaft.com
  # ⚠️ 末尾スラッシュなしで設定すること。URL 連結側が "/" を先頭に付加するため二重スラッシュになる。
  # 用途: sitemap.xml・各種メールリンク・webcal URL 等の URL 組み立て
  base-url: ${APP_BASE_URL}

mannschaft:
  jwt:
    secret: ${MANNSCHAFT_JWT_SECRET}
    access-token-expiration: ${MANNSCHAFT_JWT_ACCESS_EXPIRATION:900}
    refresh-token-expiration: ${MANNSCHAFT_JWT_REFRESH_EXPIRATION:604800}
  # 認証 Cookie の Secure 属性。本番は HTTPS 前提のためデフォルト true。
  # 設計書: docs/security/02_cookie_and_session.md §2.1
  cookie:
    secure: ${MANNSCHAFT_COOKIE_SECURE:true}
  # F13.1 Phase 13.1.2: QR 署名鍵は環境変数から必須注入（デフォルト値なし＝未設定時は起動失敗）
  jobs:
    qr:
      signing-keys:
        - kid: ${JOB_QR_SIGNING_KID:v1}
          secret: ${JOB_QR_SIGNING_SECRET}
          active: true

# セキュリティ: 本番では Swagger UI / OpenAPI エンドポイントを無効化（情報漏洩防止）。
# 設計書: docs/security/01_authorization_baseline.md §8
# ※ 型生成用 generateOpenApiDocs タスクは別プロファイル openapi-gen で起動するため影響なし。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # F10.5 Phase 10-α 検分指摘 ④ 根治: prod でも PrometheusMeterRegistry を有効にする。
  # registry は計測（メトリクス収集）を担当するだけで、エンドポイント公開とは独立しているため
  # ここで true にしても外部から /actuator/prometheus を叩ける訳ではない（exposure.include に
  # `prometheus` を追加した場合に限り SYSTEM_ADMIN 経由で取得可能）。
  # 内部ネットワーク経由のスクレイプを開始する際は exposure.include に prometheus を追記する。
  prometheus:
    metrics:
      export:
        enabled: true
