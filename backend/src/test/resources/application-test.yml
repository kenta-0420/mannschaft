spring:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # F00 §13.4: 性能テスト用 SQL 意図カウンタ。テーブル名ベースで発行 SQL 数を集計する。
        # src/main/resources/application-test.yml にも同じ登録があるが、gradle test では
        # 本ファイル（src/test/resources）が main 側を完全に隠蔽するため、そちらの登録は効かない。
        # 登録が無いと SqlIntentCounter は 1 件も捕捉せず、SQL 本数を測るテストが
        # totalCount()=0 で「上限以下」と判定され、N+1 を素通しする偽 green になる（Issue #2782）。
        session_factory:
          statement_inspector: com.mannschaft.app.common.visibility.perf.SqlIntentCounter
        jdbc:
          # Issue #2486 で共有 application.yml にも同じ UTC 指定が入ったため、この行は現在は冗長。
          # ただし本ファイルは「テストの格納基準は UTC である」という前提を明示する場所として意味があり、
          # 消しても挙動は変わらないが（application.yml は profile 個別ファイルの土台として常に読まれる）、
          # テスト側の前提を読み取れなくするため意図的に残している。
          time_zone: UTC

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none

# CMP-260910-1811: Gradle test は本ファイルを優先し、main 側の同名ファイルを隠蔽する。
# 予算機能は有効化する。月次締め・再試行は各試験から手動実行し、自動起動しない。
feature:
  shift-budget:
    enabled: true
    monthly-close-cron-enabled: false
    retry-batch-enabled: false

# F10.5 Phase 10-α: テスト環境での Actuator 設定。
# - `/actuator/health` は DB component を含めると Testcontainer 起動タイミング次第で
#   503 を返してしまうため、テスト環境では DB indicator を無効化してアプリ自身の死活のみ評価する。
#   セキュリティ層 (SYSTEM_ADMIN 限定) の検証が本テストの責務であり、DB 疎通は別テストで担保する。
# - `/actuator/prometheus` を確実に公開し、PrometheusMeterRegistry の auto-config が
#   動くようにする（@ConditionalOnAvailableEndpoint が exposure を見るため）。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,threaddump,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: false
    redis:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

mannschaft:
  # F09.18: テスト環境では実 SES を叩かない（simulate=true でログのみ送信）
  email:
    simulate: true
  # CMP-261012-0910: メール方式 2FA（永続 enum EMAIL の書込み）を試験では解禁する（本番・既定は false）
  auth:
    mfa:
      email-method-enabled: true
  # F09.4 §6: test / openapi-gen は off。署名検証の単体試験は各モードを明示して検査する。
  line:
    signature-verify:
      mode: "off"
  # main の test プロファイルと同じ試験専用ダミー鍵。本物の秘密鍵は使用しない。
  security:
    internal-signing-key: test-internal-pdf-signing-key-fixed-32bytes-xxxxx
  # 試験中の集約・ヘルスポーリングを自動起動しない。対象の単体試験は処理を直接検査する。
  error-monitoring:
    aggregation:
      enabled: false
    health-polling:
      enabled: false
  # 通知 outbox の起こし（AFTER_COMMIT・@Async の即時 drain）を試験では止める（docs/architecture/notification_outbox.md §7）。
  # IT は NotificationOutboxRelay#drainAll() を同期で呼んで取り込む（起こしと IT の drain が競合して結果が揺れないように）。
  # 起こし自体を検証する IT（NotificationOutboxNudgeIT）だけ @TestPropertySource で true にする。
  # 予備ポーラーは test プロファイルで @EnableScheduling が無効（ShedLockConfig）なので自動では走らない。
  notification:
    outbox:
      nudge-enabled: false
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
    access-token-expiration: 900
    refresh-token-expiration: 604800
  encryption:
    key: dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwYWI=
    hmac-key: dGVzdC1obWFjLWtleS0tLTEyMzQ1Njc4OTBhYmNkZWY=
  storage:
    type: local
  # PR5 Billing Center: Stripe platform Webhook 署名 — テスト決定性のために固定 secret を使用。
  # 実 `StripeWebhookController` を実署名で叩く契約テスト（設計書 05 §4）が必要とする。
  # 空文字のままだと HMAC の鍵が空になり Mac#init が落ち、署名検証以前でテストが不能になる。
  stripe:
    webhook-secret: whsec_test_billing_center_pr5_fixed_secret
  # PR4 Billing Center: return state 署名 — テスト決定性のために固定 secret を使用
  billing:
    return-state:
      signing-keys:
        - kid: v1
          secret: test-billing-return-signing-key-32bytes-xxxx
          active: true
  # F13.1 Phase 13.1.2: QR 署名 — テスト決定性のために固定 secret を使用
  # src/main/resources/application-test.yml と同一値（src/test/ が優先されるため同期必須）
  jobs:
    qr:
      ttl-seconds: 60
      ttl-seconds-max: 300
      rotation-advance-seconds: 5
      short-code-length: 6
      anomaly-distance-meters: 500
      signing-keys:
        - kid: v1
          secret: test-qr-signing-key-fixed-32bytes-testingxxxx
          active: true

# 定期再マッチは試験中に自動登録しない。バッチ本体は Mockito の単体試験で検査する。
pointcard:
  rematch-batch:
    enabled: false
