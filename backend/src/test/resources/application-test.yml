spring:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # F00 §13.4: 性能テスト用 SQL 意図カウンタ。テーブル名ベースで発行 SQL 数を集計する。
        # src/main/resources/application-test.yml にも同じ登録があるが、gradle test では
        # 本ファイル（src/test/resources）が main 側を完全に隠蔽するため、そちらの登録は効かない。
        # 登録が無いと SqlIntentCounter は 1 件も捕捉せず、SQL 本数を測るテストが
        # totalCount()=0 で「上限以下」と判定され、N+1 を素通しする偽 green になる（Issue #2782）。
        session_factory:
          statement_inspector: com.mannschaft.app.common.visibility.perf.SqlIntentCounter
        jdbc:
          # Issue #2486 で共有 application.yml にも同じ UTC 指定が入ったため、この行は現在は冗長。
          # ただし本ファイルは「テストの格納基準は UTC である」という前提を明示する場所として意味があり、
          # 消しても挙動は変わらないが（application.yml は profile 個別ファイルの土台として常に読まれる）、
          # テスト側の前提を読み取れなくするため意図的に残している。
          time_zone: UTC

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none

# F10.5 Phase 10-α: テスト環境での Actuator 設定。
# - `/actuator/health` は DB component を含めると Testcontainer 起動タイミング次第で
#   503 を返してしまうため、テスト環境では DB indicator を無効化してアプリ自身の死活のみ評価する。
#   セキュリティ層 (SYSTEM_ADMIN 限定) の検証が本テストの責務であり、DB 疎通は別テストで担保する。
# - `/actuator/prometheus` を確実に公開し、PrometheusMeterRegistry の auto-config が
#   動くようにする（@ConditionalOnAvailableEndpoint が exposure を見るため）。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,threaddump,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: false
    redis:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

mannschaft:
  # F09.18: テスト環境では実 SES を叩かない（simulate=true でログのみ送信）
  email:
    simulate: true
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
    access-token-expiration: 900
    refresh-token-expiration: 604800
  encryption:
    key: dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwYWI=
    hmac-key: dGVzdC1obWFjLWtleS0tLTEyMzQ1Njc4OTBhYmNkZWY=
  storage:
    type: local
  # F13.1 Phase 13.1.2: QR 署名 — テスト決定性のために固定 secret を使用
  # src/main/resources/application-test.yml と同一値（src/test/ が優先されるため同期必須）
  jobs:
    qr:
      ttl-seconds: 60
      ttl-seconds-max: 300
      rotation-advance-seconds: 5
      short-code-length: 6
      anomaly-distance-meters: 500
      signing-keys:
        - kid: v1
          secret: test-qr-signing-key-fixed-32bytes-testingxxxx
          active: true
