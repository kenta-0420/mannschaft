# ArchUnit FreezingArchRule 設定
#
# 既存の大量違反を「凍結（freeze store）」に記録し、新規違反のみを fail させる。
# Phase 1 番人テスト（クロスドメイン Entity 参照 / 新規 Entity の UuidV7Entity 継承）が利用する。
#
# - freeze.store.default.path:
#     凍結ストア（既存違反のスナップショット）の保存先。
#     ここに記録された違反は許容され、新規違反のみテストが fail する。
#     ストアの中身は git 管理対象（コミット必須）。これが「凍結の本体」。
# - freeze.store.default.allowStoreCreation:
#     ストア未生成時に初回作成を許可する。true でないと初回実行が失敗する。
# - freeze.refreeze:
#     true にすると「現在の全違反」を毎回ストアへ再記録してしまい、新規違反すら
#     凍結されてテストが永遠に fail しなくなる。番人としての意味を失うため必ず
#     false（デフォルト）にすること。既存違反を解消した際のストア縮小（chip-away）は
#     FreezingArchRule のデフォルト挙動（解消済み違反の自動削除）で行われ、
#     refreeze=true は不要。
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false
